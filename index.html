<title>OS Exam Practice</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* layout: question navigator on the left, one exam question at a time on the right, slide viewer as a drawer */
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface2: #f3f6f8; --ink: #16212b; --muted: #55646f; --line: #d3dbe2;
  --accent: #0a6a94; --accent-ink: #ffffff; --accent-soft: #d9ecf5;
  --ok: #17703f; --ok-soft: #ddf1e5; --bad: #b3261e; --bad-soft: #f9e0dd; --mid: #8f5400; --mid-soft: #f7ebd0;
  --code: #e6ebef; --shadow: 0 1px 2px rgba(20, 32, 44, .08), 0 4px 14px rgba(20, 32, 44, .05);
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-head: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #161f28; --surface2: #1c2833; --ink: #e6ecf1; --muted: #9bacb9; --line: #2b3a47;
    --accent: #63bde6; --accent-ink: #06202d; --accent-soft: #163447;
    --ok: #62d08f; --ok-soft: #153220; --bad: #ff8d83; --bad-soft: #3b1b19; --mid: #f0b658; --mid-soft: #392d13;
    --code: #202d39; --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --surface2: #1c2833; --ink: #e6ecf1; --muted: #9bacb9; --line: #2b3a47;
  --accent: #63bde6; --accent-ink: #06202d; --accent-soft: #163447;
  --ok: #62d08f; --ok-soft: #153220; --bad: #ff8d83; --bad-soft: #3b1b19; --mid: #f0b658; --mid-soft: #392d13;
  --code: #202d39; --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .9em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
h1, h2, h3, h4, h5 { font-family: var(--f-head); text-wrap: balance; margin: 0; }

.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.top h1 { font-size: 26px; letter-spacing: .01em; line-height: 1.1; }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#pill { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 899px) { .layout { grid-template-columns: minmax(0, 1fr); } }
#navd { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
@media (min-width: 900px) { #navd { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }
#nav-sum { cursor: pointer; padding: 12px 14px; font-family: var(--f-head); font-size: 17px; }
#nav-body { padding: 0 14px 14px; }
.ctl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin-bottom: 10px; }
.ctl label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select, textarea, input[type=text] { width: 100%; min-width: 0; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
textarea { resize: vertical; line-height: 1.5; }
.navmeta { font-size: 12px; color: var(--muted); margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
.ngroup { margin-bottom: 12px; }
.nh { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { min-width: 40px; height: 30px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; font: 500 12px var(--f-mono); }
.chip.s-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.s-mid { background: var(--mid-soft); border-color: var(--mid); color: var(--mid); }
.chip.s-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

main { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.qn { font: 600 22px var(--f-head); color: var(--ink); }
.pts { margin-left: auto; font-family: var(--f-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
.qtext { font-size: 17px; line-height: 1.5; margin-bottom: 14px; max-width: 75ch; }
.flag { font-size: 13px; border-radius: 6px; padding: 8px 10px; margin: 0 0 14px; border: 1px solid var(--line); background: var(--surface2); }
.flag.mid { background: var(--mid-soft); border-color: var(--mid); }
.flag.info { background: var(--accent-soft); border-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0; }
.small { font-size: 12px; color: var(--muted); }
.lab { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }

.opts { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface2); }
.opt label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.opt input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
.otxt { min-width: 0; overflow-wrap: anywhere; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.onote { margin: 8px 0 0 28px; font-size: 13.5px; }
.tf { font: 600 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; margin-right: 6px; border: 1px solid currentColor; }
.tf.t { color: var(--ok); } .tf.f { color: var(--bad); }
.miss { font-size: 12px; font-weight: 600; margin-right: 6px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--bad); }

.btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 7px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface2); filter: none; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
.nav2 { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.result { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.result.ok { background: var(--ok-soft); border-color: var(--ok); }
.result.mid { background: var(--mid-soft); border-color: var(--mid); }
.result.bad { background: var(--bad-soft); border-color: var(--bad); }
.verdict { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); }
.verdict.ok { background: var(--ok-soft); border-color: var(--ok); }
.verdict.bad { background: var(--bad-soft); border-color: var(--bad); }

.ref { font: 500 12px var(--f-mono); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 4px; padding: 1px 6px; cursor: pointer; white-space: nowrap; }
.ref:hover { text-decoration: underline; }

.model { margin-top: 18px; border-top: 2px solid var(--accent); padding-top: 12px; }
.model h4, .fb h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 8px; }
.model h5 { font-size: 15px; margin: 16px 0 6px; }
.kps { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.kps li { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.kps label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.kps input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
.kps span { min-width: 0; overflow-wrap: anywhere; }
.outro { font-size: 13.5px; color: var(--muted); }
.steps { padding-left: 20px; } .steps li { margin: 4px 0; }
figure { margin: 12px 0; } .dia { width: 100%; max-width: 680px; height: auto; display: block; }
.dia .bx { fill: var(--surface2); stroke: var(--ink); stroke-width: 1.4; }
.dia .bx.a { fill: var(--accent-soft); } .dia .bx.m { fill: var(--code); } .dia .bx.g { fill: var(--ok-soft); } .dia .bx.w { fill: var(--mid-soft); }
.dia .bx.hole { fill: none; stroke-dasharray: 5 4; } .dia .bx.frame { fill: none; } .dia .bx.rect { fill: var(--surface); }
.dia text { fill: var(--ink); font: 13px var(--f-body); } .dia text.dim { fill: var(--muted); font-size: 12px; } .dia text.b { font-weight: 600; } .dia text.mono { font-family: var(--f-mono); }
.dia .ln { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dia .dash { stroke-dasharray: 5 4; } .dia .mk { fill: var(--ink); } .dia .dotc { fill: var(--ink); }

.t { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; font-variant-numeric: tabular-nums; }
.t th, .t td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
.t thead th { background: var(--surface2); }
.t.pg td, .t.pg th { text-align: center; padding: 4px 6px; } .t.pg tbody th { text-align: left; background: var(--surface2); }
.t td.fault { background: var(--bad-soft); font-weight: 600; }
.scroll { overflow-x: auto; max-width: 100%; }
.gantt { margin: 8px 0 14px; padding: 0 14px 0 2px; }
.gbar { display: flex; border: 1px solid var(--ink); border-radius: 5px; overflow: hidden; }
.gseg { min-width: 24px; padding: 8px 0; text-align: center; border-right: 1px solid var(--ink); background: var(--accent-soft); font-size: 13px; }
.gseg:last-child { border-right: 0; } .gseg:nth-child(even) { background: var(--surface2); } .gseg.idle { background: var(--code); color: var(--muted); }
.gticks { position: relative; height: 20px; font: 12px var(--f-mono); color: var(--muted); }
.gticks span { position: absolute; top: 3px; transform: translateX(-50%); }
.calcin { margin: 6px 0 4px; } .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.num { display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0; } .num span:first-child { color: var(--muted); }
.mk2 { font-size: 12px; font-weight: 600; } .mk2.ok { color: var(--ok); } .mk2.bad { color: var(--bad); }
.sk { border: 1px dashed var(--line); border-radius: 8px; background: var(--surface2); padding: 6px; margin-bottom: 8px; }
.sk canvas { width: 100%; height: auto; aspect-ratio: 5 / 2; display: block; background: var(--surface); border-radius: 6px; cursor: crosshair; }
.skbar { display: flex; justify-content: flex-end; margin-top: 6px; }

.fb { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
.fbtext { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px; margin: 8px 0; }
.fbtext p { margin: 8px 0; } .fbtext ul { margin: 4px 0 8px; padding-left: 20px; }
.follow .row { display: flex; gap: 8px; }

.ph2 { font-size: 24px; margin-bottom: 4px; } .h3 { font-size: 18px; margin: 20px 0 8px; }
.topics { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: minmax(130px, 1.2fr) minmax(80px, 2fr) 90px auto; gap: 10px; align-items: center; }
@media (max-width: 599px) { .trow { grid-template-columns: 1fr 1fr; } .trow .bar { grid-column: 1 / -1; order: 3; } }
.bar { height: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; } .bar i.ok { background: var(--ok); } .bar i.mid { background: var(--mid); } .bar i.bad { background: var(--bad); }
.tv { font-variant-numeric: tabular-nums; }

#panel { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); display: flex; flex-direction: column; }
@media (min-width: 900px) { #panel { top: 0; bottom: 0; right: 0; width: min(440px, 100vw); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); } }
@media (max-width: 899px) { #panel { left: 0; right: 0; bottom: 0; height: 62vh; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); } }
#panel .ph, #panel .pf { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
#panel .pf { border-top: 1px solid var(--line); border-bottom: 0; }
#panel .pb { flex: 1; overflow: auto; padding: 10px 14px; min-height: 0; }
.slide { margin-bottom: 16px; } .sl { font: 600 12px var(--f-mono); color: var(--accent); margin-bottom: 4px; }
.slide pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--f-mono); background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip { transition: background .12s, filter .12s; } }
</style>

<script>
const SLIDES={"F1": {"1": "Operating Systems\nF1. Introduction\nAndrás Márki\nandras.marki@his.se\nUniversity of Skövde\n2025-09-01", "2": "Content List\n1. Functions of Operating Systems\n2. Computer-System Organization\n3. Operating-System Structure\n4. Operating-System Operations\n5. Operating-System Services\n6. System Calls\n7. System Programs\n8. Protection and Security", "3": "Objectives\n● To describe the basic organization of\ncomputer systems\n● To provide a grand tour of the major\ncomponents of operating systems\n● To describe the OS services to users,\nprocesses, and other systems", "4": "Computers (1)", "5": "Computers (2)", "6": "Computers (3)", "7": "Computers (4)", "8": "A Computer Hardware System (1)", "9": "A Computer Hardware System (2)\nCPU (Processor)\nPSU / Power\nSupply Unit\nNVMe M2 SSD Memory / RAM\nGraphics card\nSATA HDD", "10": "Main Board (1)\nNote: The Integrated\ngraphics processor (IGP)\nis implemented as part of\nthe Nortbridge. More\nmodern designs usually\ninclude have the IGP\nintegrated with the CPU.", "11": "Main Board (2)", "12": "Printed Circuit Board", "13": "What is an Operating System?\n● An OS is a program which acts as an\ninterface between computer system users\nand the computer hardware.\n● Operating system goals:\n○ Execute user programs and make user to\nsolve problems easier\n○ Make the computer system convenient to\nuse\n○ Use the computer hardware in an efficient\nmanner", "14": "Operating Systems Turn Ugly\nHardware into Beautiful Abstractions", "15": "Computer System Structure\nA computer system can be divided into four\ncomponents:\n● Users\n○ People, machines, other computers\n● Application programs\n○ define the ways in which the system\nresources are used to solve the\ncomputing problems of the users\n○ Word processors, compilers, web\nbrowsers, database systems, video\ngames\n● Operating system\n○ Controls and coordinates the use of\nhardware among various applications\nand users\n● Hardware\no provides basic computing resources\no CPU, memory, I/O devices 15", "16": "Four Components of a Computer\nSystem\nuser 1 user 2 user 3 ... user n\ncompiler assembler text editor\n… database system\nsystem and application programs\noperating system\ncomputer hardware", "17": "OS Functions\n● OS is a resource allocator\n○ Manages all resources\n○ Decides between conflicting requests for efficient\nand fair resource use\n● OS is a control program\n○ Controls execution of programs to prevent errors\nand improper use of the computer", "18": "Computer Startup\n● bootstrap program is loaded at power-up\nor reboot\n○ Typically stored in ROM (Read Only Memory) or\nEPROM (Erasable Programmable Read Only\nMemory), generally known as firmware\n○ Initialises all aspects of the system\n○ Loads the operating system kernel and starts\nexecution", "19": "The Bootstrap Process", "20": "Computer System Organization\n● One or more CPUs, device controllers connect through\ncommon bus providing access to shared memory\n● Concurrent execution of CPUs and devices competing\nfor memory cycles", "21": "Computer System Operation\n● I/O devices and the CPU can execute\nconcurrently\n● Each device controller is in charge of a\nparticular device type\n● Each device controller has a local buffer\n● CPU moves data from/to main memory\nto/from local buffers\n● Device controller communicates with the CPU\nby interrupts", "22": "Common Functions of Interrupts\n● Interrupt transfers control to the interrupt\nservice routine generally through the\ninterrupt vector, which contains the\naddresses of all the service routines\n● Interrupt architecture must save the address\nof the interrupted instruction\n● A trap or exception is a software-generated\ninterrupt caused either by an error or a user\nrequest\n● An operating system is interrupt-driven", "23": "Interrupt Timeline\ntime", "24": "Storage Definitions and Notation\nReview (1)\n● The basic unit of computer storage is the bit. A bit can contain one\nof two values, 0 and 1.\n● A byte is 8 bits, and on most computers, it is the smallest\nconvenient chunk of storage. For example, most computers don’t\nhave an instruction to move a bit but do have one to move a byte.\n● A less common term is word, which is a given computer\narchitecture’s native unit of data. A word is made up of one or more\nbytes. For example, a computer with 64-bit registers and 64-bit\nmemory addressing typically uses 64-bit (8-byte) words. A\ncomputer executes many operations in its native word size rather\nthan a byte at a time.", "25": "Storage Definitions and Notation\nReview (2)\nComputer storage, along with most computer throughput, is generally\nmeasured and manipulated in bytes and collections of bytes.\na kilobyte, or KB, is 1,024 (=210) bytes\na megabyte, or MB, is 1,024 KB\na gigabyte, or GB, is 1,024 MB\na terabyte, or TB, is 1,024 GB\na petabyte, or PB, is 1,024 TB\n● Computer manufacturers often round off these numbers and say\nthat a megabyte is 1 million bytes and a gigabyte is 1 billion bytes.\n● Networking measurements are an exception to this general rule;\nthey are given in bits (because networks move data a bit at a time).", "26": "The Principal Metric Prefixes\n● 210=1,024\n● 103=1,000\n● 210 ≈ 103", "27": "Storage Structure\n● Main memory – storage media that the CPU can access directly\n○ Random access\n○ Typically volatile, i.e. data is lost when power is lost\n● Secondary storage – extension of main memory that provides\nlarge nonvolatile storage capacity\n● Hard disks (HDD) – rigid metal or glass platters covered with magnetic\nrecording material\n○ Disk surface is logically divided into tracks, which are subdivided into\nsectors\n○ The disk controller determines the logical interaction between the device\nand the computer\n○ Still well-used in some domains\n● Solid-state disks (SSD) – faster than hard disks, nonvolatile\n○ Various technologies\n○ Becoming more popular\n○ NVMe (NVM express, where NVM is non-volatile memory)\ncan have this form too", "28": "Storage-Device Hierarchy\nsize\nspeed", "29": "Performance of Various Levels of\nStorage\nLevel 1 2 3 4 5\nName registers cache main memory solid state disk magnetic disk\nTypical size < 1 KB < 128MB < 128GB < 4 TB < 16TB\nImplementation Custom On-chip or off- CMOS SRAM Flash memory Magnetic disk\ntechnology memory with chip CMOS\nmultiple ports SRAM\nCMOS\nAccess time 0.25 – 0.5 0.5 – 25 80 – 250 25,000 – 5,000,000\n(ns) 50,000\nBandwith >>25,000 > 25,000 10,000 – 500 – 3,000 20 – 150\n(MB/sec) 25,000\nManaged by compiler hardware operating operating operating\nsystem system system\nBacked by cache main memory disk disk disk or tape", "30": "Operating System Structure\n● Multiprogramming (batch system) needed for efficiency\n○ A single user cannot keep the CPU and I/O devices busy at all times\n○ Multiprogramming organises jobs (code and data) so the CPU always has\none to execute\n○ A subset of total jobs in the system is kept in memory\n○ One job selected and run via job scheduling\n○ When it has to wait (for I/O, for example), OS switches to another job\n● Timesharing (multitasking) is a logical extension in which the CPU switches\njobs so frequently that users can interact with each job while it is running,\ncreating interactive computing\n○ Response time should be < 1 second\n○ Each user has at least one program executing in a memory process\n○ If several jobs are ready to run at the same time, CPU scheduling is\nneeded\n○ If processes don’t fit in memory, swapping moves them in and out to run\n○ Virtual memory allows the execution of processes not completely in\nmemory", "31": "Memory Layout for\nMultiprogrammed System", "32": "OS Services\n● Process Management\n● Memory Management\n● File Management\n● Device Management\n● Concurrency Control", "33": "A View of Operating System Services", "34": "System Call\n● System calls provide an essential interface between a\nprocess (program) and the operating system (kernel).\n● This may include hardware-related services (e.g.\naccessing the hard disk), creating and executing new\nprocesses, and communicating with integral kernel\nservices (like scheduling).", "35": "Types of System Calls\n● Process control\n○ create process, terminate process\n○ end, abort\n○ load, execute\n○ get process attributes, set process attributes\n○ wait for time\n○ wait event, signal event\n○ allocate and free memory\n○ Dump memory if error\n○ Debugger for determining bugs, single-step\nexecution\n○ Locks for managing access to shared data between\nprocesses", "36": "Types of System Calls\n● File management\n○ create file, delete file\n○ open, close file\n○ read, write, reposition\n○ get and set file attributes\n● Device management\n○ request device, release device\n○ read, write, reposition\n○ get device attributes, set device\nattributes\n○ logically attach or detach devices 36", "37": "Types of System Calls (Cont.)\n● Information maintenance\n○ get time or date, set time or date\n○ get system data, set system data\n○ get and set process, file, or device attributes\n● Communications\n○ create, delete communication connection\n○ send, receive messages if message passing model\nto host name or process name\n■ From client to server\n○ transfer status information\n○ attach and detach remote devices", "38": "Types of System Calls (Cont.)\n● Protection\n○ Control access to resources\n○ Get and set permissions\n○ Allow and deny user access", "39": "Examples of Windows and Unix\nSystem Calls", "40": "System Programs\n● System programs provide a convenient environment for\nprogram development and execution. They can be\ndivided into:\n○ File management\n○ Status information\n○ File modification\n○ Programming language support\n○ Program loading and execution\n○ Communications", "41": "Protection and Security\n● Protection – any mechanism for controlling access of processes or users\nto resources defined by the OS\n● Security – defence of the system against internal and external attacks\n○ Huge range, including denial-of-service, worms, viruses, identity theft,\ntheft of service\n● Systems generally first distinguish among users to determine who can do\nwhat\n○ User identities (user IDs, security IDs) include name and associated\nnumber, one per user\n○ User ID is then associated with all files and processes of that user to\ndetermine access control\n○ Group identifier (group ID) allows a set of users to be defined and\ncontrols managed, then also associated with each process, file\n○ Privilege escalation allows a user to change to an effective ID with\nmore rights", "42": "Types of Modern Operating Systems\n● Real-time OS\n● Multi-user OS\n● Multi-tasking vs. single-tasking OS\n● Distributed OS (for network)\n● Templated OS (for cloud computing)\n● Embedded OS", "43": "Examples of popular modern\noperating systems\n● Android\n● BSD\n● iOS\n● Linux\n● Minix\n● OS X\n● QNX\n● Microsoft Windows\n● IBM z/OS\nAll these, except Windows and z/OS, share roots in UNIX.", "44": "Reference\n● Chapter 1 + Chapter 2, Abraham Silberschatz, Peter B.\nGalvin, Greg Gagne, Operating System Concepts, 8th\ninternational student edition, Wiley, 2010, ISBN 978-"}, "F2": {"1": "F2. Processes\nAndrás Márki\nandras.marki@his.se\nUniversity of Skövde\n2021-09-01", "2": "Content\n❑ Process Concept\n❑ Process Scheduling\n❑ Operations on Processes\n❑ Interprocess Communication\n❑ Communication in Client-Server\nSystems", "3": "Objectives\n• To introduce process － a program in\nexecution, which forms the basis of all\ncomputation\n• To describe the various features of\nprocesses, including scheduling, creation\nand termination, and communication\n• To explore interprocess communications\nusing shared memory and message passing\n• To describe communication in client-server\nsystems", "4": "Process Concept Process ≈ Task ≈ Job\n• A instance of a program in the state of execution.\n- Process can be thought of as a container, which holds\nall information needed to run program. Process is\nassociated with an address space, and set of\nresources.\n- Process execution must progress in sequential fashion.\n• Operating system processes execute system code\n• User process execute user code\n• Execution of program starts via GUI mouse clicks, or\ncommand line entry of its name, etc.\n• One program can trigger several processes: consider\nmultiple execution of the same program (by a single or\nmultiple users) 4", "5": "Process vs. Program\n• A computer program is a passive collection of\ninstructions; a process is the actual execution of those\ninstructions\n• Program is passive entity stored on disk (executable\nfile), process is active. Program becomes a process\nwhen executable file loaded into memory", "6": "CPU vs. I/O bound Processes\n• Processes can be described as either:\n- I/O-bound process – spends more time doing I/O than\ncomputations, many short CPU bursts\nCPU\n✓ I/O time >> CPU time (e.g. ftp server)\nI/O\n- CPU-bound process – spends more time doing computations; few\nvery long CPU bursts\nCPU\n✓ CPU time >> I/O time (e.g. image processing I/O", "7": "Process Management\n• The creation and deletion of both user and\nsystem processes.\n• The scheduling of processes.\n• The provision of mechanisms for resource\nallocation, synchronization, communication,\nand deadlock handling for processes.", "8": "Process in Memory (Address Space)\nMultiple parts\n• The program code, also called\ntext section\n• Stack containing temporary Local data\ndata, function parameters,\nreturn addresses, local\nvariables\nDynamic data\n• Data section process\nStatic data\nvariables\n• Heap containing dynamically\nallocated entities in memory at\nrun-time", "9": "Process in Memory (C Program e.g.)\ndata\nCompiler\nLoader", "10": "Process State\nAs a process executes, it changes state\n• new: The process is being created\n• running: Instructions are being\nexecuted\n• waiting: The process is waiting for\nsome event to occur\n• ready: The process is waiting to be\nassigned to a processor\n• terminated: The process has finished\nexecution 10", "11": "Diagram of Process State", "12": "Process Control Block (PCB)\nInformation associated with each process (also\ncalled Process Control Block):\n• Process state – running, waiting, etc\n• Program counter – location of instruction to\nnext execute\n• CPU registers – contents of all registers\nused by the process\n• CPU scheduling information- priorities,\nscheduling queue pointers\n• Memory-management information –\nmemory allocated to the process\n• Accounting information – CPU used, clock\ntime elapsed since start, time limits\n• I/O status information – I/O devices\nallocated to process, list of open files 12", "13": "Registers\n(Read/Write/OpCode\nFetch)\nContext of Execution = Contents of\nregisters corresponding to an\nexecuting process", "14": "CPU Switch from Process to\nProcess\nCo ntext\nve P\nSa 0\no ntext\nsto r e P1 C\nRe\nSave\nP\n1 Conte\nxt\nResto\nre P\n0 Conte 14\nxt", "15": "Context Switch\n• When CPU switches to another process, the system\nmust save the context of the old process and load the\nsaved context for the new process via a context\nswitch\n• Context of a process is saved into the PCB and\nupdated by CPU when the corresponding process is\nrunning\n• Context-switch time is overhead; no user-relevant\nwork is produced while switching\n• The Dispatcher is the operating system module that\nhandles context-switching. It needs to execute and\nhence consumes CPU cycles.", "16": "Context Switch\nFew ms\nWhat user “sees”\nWhat OS is doing", "17": "Process Representation in Linux\nPCB implementation by the C structure task_struct\nt_pid pid; /* process identifier */ long\nstate; /* state of the process */\nunsigned int time_slice /* scheduling information */\nstruct task_struct *parent; /* this process’s parent */\nstruct list_head *children; /* this process’s children */\nstruct files_struct *files; /* list of open files */\nstruct mm_struct *mm; /* address space of this process */\nLink to child process\nLink to parent process", "18": "Process Scheduling\n• Maintains scheduling queues of processes\n- Job queue – set of all processes residing in mass\nstorage and waiting for main-memory allocation\n- Ready queue – set of all processes residing in main\nmemory, ready and waiting (only for CPU) to execute\n- Device queues – set of processes waiting for an I/O\ndevice (other resources than CPU)\n- Processes migrate among the above various queues", "19": "Process Queues\nReady queue PCB PCB PCB PCB\nDevice 1\nI/O Queues\nPCB PCB\nDevice 2\nPCBs move from queue to\nqueue as processes\nchange state", "20": "Representation of Process Scheduling\nA new process is initially put in the job queue and then it is\nmoved to ready queue once it is allocated memory\nFrom job Process terminates\nqueue\nProcess issues an I/O request\nProcess time-share expired\nProcess makes system call\nto create child processes &\nwait for their termination.\nProcess makes other system\ncalls (e.g. create a directory),\nInterrupts grab OS attention and waits for interrupts\nto respond system call 20", "21": "Schedulers\n• Short-term scheduler (or CPU scheduler) – manages ready queues\nand selects which process should be executed next and allocates CPU\n- Sometimes the only scheduler in a system\n- Short-term scheduler is invoked frequently (milliseconds) ⇒ (must be\nfast)\n• Long-term scheduler (or job scheduler) – manages job queue and\nselects which processes should be brought into the ready queue\n- Long-term scheduler is invoked infrequently (seconds, minutes) ⇒\n(may be slow)", "22": "Addition of Medium Term\nScheduling\n• Medium-term scheduler can be added if degree of\nmultiprogramming needs to decrease, to allow faster\nprocess execution\n• Memory management module may release a memory\nspace allocated to a non-executing process (e.g. when\nthe process is waiting for I/O)\n• The medium-term scheduler Process swapping\nswaps out a process and\nswaps in a partially executed\nprocess by moving back and\nforth processes between RAM\nand disk (used as virtual\nmemory)", "23": "Operations on Processes\nOperating System provides mechanisms for:\n• process creation\n• process termination\n• process communication (with other\nprocesses)", "24": "Process Creation\n• Parent process creates children processes, which, in turn\ncreate other processes, forming a tree of processes\n• Each process is identified and managed via a process\nidentifier (pid)\n• Resource sharing options\n- Parent and children share all resources\n- Children share subset of parent’s resources\n- Parent and child share no resources", "25": "Process Creation (Cont’d)\n• Execution options\n- Child duplicates parent’s code and execute\nconcurrently\n- Child executes another code than the parent\n- Parent waits until children terminate\n• In UNIX:\nh Fork() system call creates new process (duplicate\nthe parent)\nh Exec() system call is used after call to replace the\nprocess memory space with a new program", "26": "Process Creation (Cont’d)\n• When creating a new (child) process,\nOS:\n- Allocates new PCB\n- Clones the calling process (almost exactly)\n- Copy of parent process address space\n- Places new PCB on Ready queue\n- Returns from fork() call:\n• 0 for child\n• child PID for parent", "27": "Process Creation with fork()in C", "28": "Process Creation with fork()in C", "29": "Process Creation with fork()in C", "30": "Process Creation with fork()in C", "31": "Process Creation with fork()in C", "32": "Process Creation with fork()in C", "33": "Process Creation with fork()in C", "34": "Process Creation in Kernel Space\nFork() implementation:\nTCB (Thread control block) has a pointer\nto the PCB", "35": "Process Creation in User Space\n• Two possibilities of the address space\n- Child duplicate of parent process\n- Child has a new program loaded into it\n• UNIX examples\n- fork() system call creates new process\n- exec() system call used after a fork() to\nreplace the process’ memory space with a new\nprogram", "36": "A Tree of Processes in Linux\nLinux startup process\ncreated during booting\nLocal connection Remote connection daemon\nkernel\n(Bourne) Shell Remote connection instance\nKernel processes\nShell command Shell application\n(C) Shell", "37": "C Program Forking Separate\nProcess\nwhen compiled and executed, this computer prints", "38": "Process Termination\n• Process executes last statement and asks the\noperating system to delete it ( exit())\nh Process’ resources are deallocated by operating\nsystem\n• Parent may terminate execution of children\nprocesses (abort)\n- Child has exceeded allocated resources\n- Task is no longer required\n- If parent is exiting", "39": "Cooperating Processes\n• Processes within a system may be independent or\ncooperating\n• Cooperating process can affect or be affected by other\nprocesses, including sharing data\n• Advantages of process cooperation:\n- Information sharing\n- Computation speedup\n- Modularity\n- Convenience\n• Cooperating processes need inter-process\ncommunication (IPC)\nh Two models of IPC: Shared memory and Message\npassing 39", "40": "IPC Models\n• Shared Memory\nis faster, because\nno system calls\n• However it\nrequires\nsynchronization\n(handled by the\nprogrammer), and\n• Doesn't work\nacross multiple\nMessage passing. Shared memory. computers.\n• Message Passing requires system calls (send()and\nReceive())for every message transfer, and is therefore slower\n• But it is simpler to set up and works well across multiple\ncomputers.", "41": "Producer-Consumer Problem\n• Paradigm for cooperating processes\n• Producer process produces information that is\nconsumed by a consumer process via an\nintermediary buffer\n- unbounded-buffer places no practical limit on the size of\nthe buffer\n- bounded-buffer assumes that there is a fixed buffer size\n- With a bounded buffer the producer may have to wait until\nthere is space available in the buffer\n- The consumer may need to wait in either case (bounded\nor unbounded) when there is no new data available in the\nbuffer to consume 41", "42": "Bounded-Buffer – Shared-Memory\nSolution\n• Shared buffer implementation in C:\n#define BUFFER_SIZE 10\ntypedef struct {\n. . . Exchanged data is\nset up in the shared\n} item; memory area\nitem buffer[BUFFER_SIZE];\nint in = 0;\nint out = 0;", "43": "Bounded-Buffer – Producer\nitem next_produced; The next element\nto consumer\nwhile (true) {\nitem = input(); /* produce an item */\nwhile (((in + 1) % BUFFER_SIZE) == out);\n; /* do nothing */\nbuffer[in] = item;\nin = (in + 1) % BUFFER_SIZE; }\nbuffer is full when\nThe next slot to \"in\" is one less than\nuse for producing \"out\" in a circular\nsense", "44": "Bounded Buffer – Consumer\nitem next_consumed; • buffer is empty when \"in\" is equal to\n\"out”, i.e.\nwhile (true) { • What has been produced has been all\nwhile (in == out) consumer!\n;/* do nothing – nothing to consume*/\n/*remove an item from the buffer */\nitem = buffer[out];\nout = (out + 1) % BUFFER_SIZE;\n/* consume the item in next consumed */\noutput (item)\n} 44", "45": "Interprocess Communication (IPC) –\nMessage Passing (1)\n• Mechanism for processes to\ncommunicate and to synchronize their\nactions\n• Message system – processes\ncommunicate with no shared variables\n• OS provides two operations (system\ncalls):\n- send(void* message)\n- receive(void* message)\n• The message size is either fixed or\nvariable 45", "46": "Message Passing (2)\n• If processes 1 and 2 wish to communicate, they need to:\n- Establish a communication link between them\n?\n=\n- Exchange messages via send/receive\nSynchronous communication involves waiting, e.g.:\n● Process 1 waits for Process P2 to acknowledge every\nmessage\n● Process 2 waits when Process P1 is not ready to send\nAsynchronous (no waiting!):\n● Process 1 sends whenever it is ready\n● Process 2 proceeds if no sent 46", "47": "Direct Communication\n• Symmetric: Processes must name each other explicitly:\nh send (Process_P, message) ; Send a message to Process P\nh receive (Process_Q , message);Receive a message from Process\nQ\n• Asymmetric: Processes may not name each other explicitly:\nh send (Process_P, message) ; Send a message to Process P\nBut\nh receive ( Process_id , message ) ; Receive a message from\nany process", "48": "Indirect Communication\n• Processes communicate via a named mailbox (also\nreferred to as ports) rather than via a process name.\nh Each mailbox has a unique ID\nh Processes can communicate only if they share a\nmailbox.\n• Recipients listen to arriving messages through a\ndedicated port (i.e. a link may be associated with many\nprocesses)\n• OS provides the following IPC primitives:\nopen( mailbox_name );\nsend ( mailbox_name, message );\nreceive ( mailbox_name, message);", "49": "Illustration on Message Passing\nA mailbox can be used by\nmultiple processes\nProcesses can use multiple\nmailbox\nCapacity of the mailbox should be\nconsidered\n- zero means capacity is null and the\nsendes must wait until the message\nis received\n- Bounded: Sender block if the queue\nis full 49\n- Unbounded", "50": "Sockets (Lower-Level IPC)\n• A socket is defined as an endpoint for Applications,\nservices\ncommunication\n• Concatenation of IP address and port RMI\n• The socket 138.37.94.249:1625 refers RPC\nto port 1625 on host 138.37.94.249\n• Communication consists between a Sockets\npair of sockets\nTCP and UDP\nNetwork", "51": "Sockets in Java\nServer running Port\non local host LocalHost address\nOpen\nConnect\nWait\nRequest\n(Receive)\nReply\n(Send)\nRequest\nClose\n(Receive)", "52": "Remote Procedure Calls (High-Level\nIPC)\n• Abstracts procedure calls between processes Applications,\nservices\non networked systems. Which uses:\nh Ports for service differentiation RMI\nh Stubs – client/server-side proxies for RPC\nmarshalling data Marshalling = transforming data parameters\nof a procedure into a suitable format for\ntransmission (e.g. from integer to bytes) Sockets\nTCP and UDP\nserverFunction(){\n}\nserverFunction\nNetwork\nClient Stub Server Stub\nNetwork", "53": "Object-Oriented RPC: Java RMI\n• RMI (Remote Method Invocation) allows a Java\nprogram on one machine to invoke a method on a\nremote object. Applications,\nservices\nRMI\nRPC\nSockets\nTCP and UDP", "54": "Reference\nChapter 3, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F3": {"1": "F3. Threads\nAndrás Márki\nandras.marki@his.se\nUniversity of Skövde\n2021-09-07", "2": "Content\nOverview\nDefinition of Thread\nMulticore P rogramming\nMultithreading Models\nC oncurrency and P arallelis m\nImplicit Threading\nThreading Is s ues\nOperating S ys tem E xamples", "3": "Objectives\n• To introduce the concept of a thread—a\nfundamental unit of CPU utilization that forms the\nbasis of multithreaded computer systems\n• To explore several strategies that provide implicit\nthreading\n• To examine issues related to multithreaded\nprogramming\n• To cover operating system support for threads in\nWindows and Linux", "4": "Motivation\nMost modern applications are multithreaded\nThreads run within application\nMultiple tas ks with the application can be implemented by s eparate\nthreads\n• Update dis play\n• Fetch data\n• S pell checking\n• Ans wer a network reques t\nP roc es s c reation is heavy-weight while thread c reation is light-weight\nC an s implify c ode, inc reas e effic ienc y\nK ernels are generally multithreaded", "5": "Definition of Thread\n• A thread is the smallest sequence of programmed\ninstructions that can be managed independently by a\nscheduler (typically as part of an operating system).\n• A thread is a component of a process.\n• Multiple threads can exist within the same process\nand share resources such as memory, while different\nprocesses do not share these resources.\n• Many modern operating systems directly support\nboth time-sliced and multiprocessor threading with a\nprocess scheduler.\n• The kernel of an operating system allows\nprogrammers to manipulate threads via the system\ncall interface.", "6": "Process vs. Thread\nThreads differ from traditional multitasking operating system\nproc es s es :\n• proc es s es are typically independent, while threads exis t as\ns ubs ets of a proc es s\n• proc es s es c arry cons iderably more s tate information than threads ,\nwhereas multiple threads within a proc es s s hare process state as\nwell as memory and other res ources\n• proc es s es have s eparate addres s s pac es , whereas threads s hare\ntheir addres s s pac e\n• proc es s es interac t only through s ys tem-provided inter-process\ncommunication mechanis ms\n• c ontext s witc hing between threads in the same proc es s is\ntypically faster than c ontext s witc hing between proc es s es .", "7": "Benefits\nResponsiveness – may allow continued execution if part\nof process is blocked, especially important for user\ninterfaces\nResource Sharing – threads share resources of process,\neasier than shared memory or message passing\nEconomy – cheaper than process creation, thread\nswitching lower overhead than context switching\nScalability – process can take advantage of\nmultiprocessor architectures", "8": "Single and Multithreaded Processes", "9": "Multithreaded Server Architecture", "10": "Multicore Programming (1)\nMulticore or multiprocessor systems putting pressure on\nprogrammers, challenges include:\n• Dividing activities\n• Balance\n• Data splitting\n• Data dependency\n• Testing and debugging\nParallelism implies a s ys tem can perform more than one\ntas k s imultaneous ly\nConcurrency s upports more than one tas k making\nprogres s\n• S ingle proc es s or / c ore, s c heduler providing c onc urrency", "11": "Multicore Programming (2)\nTypes of parallelism\n• Data parallelism – dis tributes s ubs ets of the\ns ame\ndata ac ros s multiple c ores , s ame operation on\neac h\n• Task parallelism – dis tributing threads acros s\nc ores , eac h thread performing unique operation\nAs # of threads grows , s o does architec tural s upport for\nthreading", "12": "Concurrency vs. Parallelism (1)\nConcurrent execution on single-core system:\nParallelism on a multi-core system:", "13": "Concurrency vs. Parallelism (2)\nA A\nB B\nC C\ntime time\nConcurrency Parallelism\n• Single Processor • Multiprocessors, Multicore\n• Logically simultaneous • Physically simultaneous\nprocessing processing 13", "14": "Amdahl’s Law (1)\nIdentifies performance gains from adding additional cores\nto an application that has both s erial and parallel\nc omponents\nS is s erial portion\nN proces s ing cores\nThat is, if application is 75% parallel / 25% s erial, moving\nfrom 1 to 2 c ores res ults in s peedup of 1.6 times\nAs N approaches infinity, speedup approac hes 1 / S\nSerial portion of an application has disproportionate\neffect on perform anc e gained by adding additional\ncores", "15": "Amdahl’s Law (2)\nThe speedup of a program\nus ing multiple proces s ors\nin parallel c omputing is\nlimited by the s equential\nfraction of the program.\nF or example, if 95% of the\nprogram can be\nparallelized, the theoretical\nmaximum s peedup us ing\nparallel c omputing would\nbe 20× as s hown in the\ndiagram, no matter how\nmany proc es s ors are us ed.", "16": "User Threads and Kernel Threads\nUser threads - management done by user-level threads library\nThree primary thread libraries:\n• POSIX Pthreads\n• Windows threads\n• Java threads\nKernel threads - Supported by the Kernel\nExamples – virtually all general purpose operating systems, including:\n• Windows\n• Solaris\n• Linux\n• Tru64 UNIX\n• Mac OS X", "17": "Multithreading Models\nMany-to-One\nOne-to-One\nMany-to-Many", "18": "Many-to-One\n• Many user-level threads mapped\nto single kernel thread\n• One thread blocking causes all\nto block\n• Multiple threads may not run in\nparallel on multicore system\nbecause only one may be in kernel\nat a time\n• Few systems currently use this\nmodel\nExamples:\n• Solaris Green Threads\n• GNU Portable Threads", "19": "One-to-One\n• Each user-level thread maps to one kernel thread\n• Creating a user-level thread creates a kernel\nthread\n• More concurrency than many-to-one\n• Number of threads per process sometimes\nrestricted due to overhead\nExamples\n• Windows\n• Linux\n• Solaris 9 and later", "20": "Many-to-Many Model\n• Allows many user level threads to be mapped to many\nk ernel threads\n• Allows the operating s ys tem to c reate a sufficient\nnumber of kernel threads\nE xamples\n• S olaris prior to vers ion 9\n• Windows\nwith the\nThreadFiber\npac kage", "21": "Two-level Model\n• Similar to M:M, except\nthat it allows a user thread\nto be bound to kernel\nthread\nE xamples\n• IR IX\n• HP -UX\n• Tru64 UNIX\n• S olaris 8 and earlier", "22": "Thread Libraries\n• Thread library provides programmer with\nAPI for creating and managing threads\n• Two primary ways of implementing\n• Library entirely in user space\n• Kernel-level library supported by the OS", "23": "Pthreads\n• May be provided either as user-level or kernel-level\n• A POSIX (Portable Operating System Interface)\nstandard (IEEE 1003.1c)API for thread creation and\nsynchronization\n• Specification , not implementation\n• AP I s pec ifies behavior of the thread library,\nimplementation is up to development of the library\n• C ommon in UNIX operating s ys tems (S olaris,\nLinux,\nMac OS X)", "24": "C++11 multithread example", "25": "Pthreads Example", "26": "Pthreads Example (Cont.)", "27": "Windows Multithreaded C Program", "28": "Java Threads\n• Java threads are managed by the JVM\n• Typically implemented using the threads\nmodel provided by underlying OS\n• Java threads may be created by:\n• Extending thread class\n• Implementing the runnable\ninterface", "29": "Java Multithreaded Program\nNote:\n• This is an example based on the course book (without the\nextras it is similarly complex on code level as in case of\nC++11).\n• The important part is that Summation inherits from the\nRunnable interface and overloads the run() function.\n• Then the Summation type object is passed to a Thread\nand run() is called when .start() is called on the Thread\ntype object thrd.", "30": "Implicit Threading\n• Growing in popularity as numbers of threads increase, program\ncorrectness more difficult with explicit threads\n• Creation and management of threads done by compilers and run-\ntime libraries rather than programmers\n• Three methods explored\n• Thread Pools\n• OpenMP\n• Grand Central Dispatch\n• Other methods include Microsoft Threading Building Blocks\n(TBB),\njava.util.concurrent package\n• B as ically, all modern iterative languages (C ++11 andlater, Java, C\n#) have built in s upport for threads", "31": "Thread Pools\nCreate a number of threads in a pool where they await work\nAdvantages:\nU s ually s lightly fas ter to s erve a reques t with an exis ting thread\nthan c reate a new thread\nAllows the number of threads in the application(s ) to be bound to\nthe s ize of the pool\nWindows AP I s upports thread pools :", "32": "OpenMP\n• OpenMP (Open Multi-Processing) is #pragma omp parallel\nan API that supports multi-platform C reate as many threads as there are\nshared memory multiprocessing c ores\nprogrammingin C, C++, and Fortran, #pragma omp parallel for\non most processor architectures and for(i=0;i<N;i++) {\noperating systems, including Solaris, c[i] = a[i] + b[i]; }\nAIX, HP-UX, Linux, Mac OS X, and R un for loop in parallel\nWindows platforms.\n• It consists of a set of compiler\ndirectives, library routines, and\nenvironment variables that influence\nrun-time behavior.\n• Provides support for parallel\nprogramming in shared-memory\nenvironments\n• Identifies parallel regions – blocks\nof code that can run in parallel", "33": "Grand Central Dispatch\n• Apple technology for Mac OS X and iOS operating\nsystems\n• Extensions to C, C++ languages, API, and run-time\nlibrary\n• Allows identification of parallel sections\n• Manages most of the details of threading\n• Block is in “ ^ { }” - ˆ{ printf(\"I am a block\");\n}\n• B locks placed in dis patch queue\n• As s igned to available thread in thread pool when removed from\nqueue", "34": "Grand Central Dispatch\nTwo types of dispatch queues:\nserial – blocks removed in F IFO order, queue is per proc es s ,\ncalled main queue\nP rogrammers can c reate additional s erial queues within\nprogram\nconcurrent – removed in F IFO order but s everal may be removed\nat a time\nThree s ys tem wide queues with priorities low, default, high", "35": "Threading Issues\nSemantics of fork() and exec()s ys tem\ncalls\nS ignal handling\nS ynchronous and asynchronous\nThread cancellation of target thread\nAs ync hronous or deferred\nThread-local s torage\nS cheduler Activations", "36": "Semantics of fork() and exec()\nDoes fork()duplicate only the calling thread or all\nthreads ?\nS ome UNIXes have two vers ions of fork\nduplicates all threads\nduplicates only the thread that invoked the\nfork() s ys tem call\nexec() us ually works as normal – replace the running\nproces s including all threads", "37": "Signal Handling (1)\nSignals are used in UNIX systems to notify a process that\na particular event has occurred.\nA signal handler is used to process signals\n1) Signal is generated by particular event\n2) Signal is delivered to a process\n3) Signal is handled by one of two signal handlers:\ndefault\nuser-defined\nEvery signal has default handler that kernel runs when\nhandling signal\nUser-defined signal handler can override default\nFor single-threaded, signal delivered to process 37", "38": "Signal Handling (2)\nWhere should a signal be delivered for multi-threaded?\nDeliver the s ignal to the thread to which the s ignal\napplies\nDeliver the s ignal to every thread in the proces s\nDeliver the s ignal to certain threads in the proces s\nAs s ign a s pecific thread to receive all s ignals for the\nproc es s", "39": "Thread Cancellation\nTerminating a thread before it has finished\nThread to be canc eled is t arget thread T wo\ngeneral approaches :\nAsynchronous cancellation terminates the target\nthread immediately\nDeferred cancellation allows the target thread to\nperiodically check if it s hould be cancelled\nP thread c ode to c reate and canc el a thread:", "40": "Thread Cancellation (Cont.)\nInvoking thread cancellation requests cancellation, but actual\ncanc ellation depends on thread s tate\nIf thread has c anc ellation dis abled, canc ellation remains pending until\nthread enables it\nDefault type is deferred\nC anc ellation only oc c urs when thread reac hes c ancellation point\ni.e. pthread_testcancel()\nT hen cleanup handler is invoked\nOn Linux systems, thread cancellation is handled through s ignals", "41": "Thread-Local Storage\nThread-local storage (TLS) allows each thread to have\nits own copy of data\nUseful when you do not have control over the thread\ncreation process (i.e., when using a thread pool)\nDifferent from local variables\nLocal variables visible only during single function\ninvocation\nTLS visible across function invocations\nSimilar to static data\nTLS is unique to each thread", "42": "Scheduler Activations\n• Both M:M and Two-level models require\ncommunication to maintain the appropriate\nnumber of kernel threads allocated to the\napplication\n• Typically use an intermediate data structure\nbetween user and kernel threads –\nlightw eight process (LWP)\n• Appears to be a virtual proc es s or on\nwhic h proc ess can s c hedule us er thread\nto run\n• E ach LWP attached to kernel thread\n• How many L W P s to c reate?\n• S c heduler activations provide upcalls - a\nc ommunication mec hanis m from the kernel\nto the upcall handler in the thread library\n• This communication allows an application to\nmaintain the c orrec t number kernel threads 42", "43": "Operating System Examples\nWindows Threads\nLinux Threads", "44": "Windows Threads\nWindows implements the Windows API – primary AP I for Win 98, Win\nNT, Win 2000, Win XP, Win 7, Win 8 and Win 10\nImplements the one-to- one mapping, kernel- level\nE ach thread contains\nA thread id\nR egis ter s et repres enting s tate of proc es s or\nS eparate us er and kernel s tacks for when thread runs in us er\nmode or kernel mode\nP rivate data s torage area us ed by run-time libraries and dynamic\nlink libraries (DLLs )\nThe regis ter s et, s tacks, and private s torage area are known as the\ncontext of the thread", "45": "Windows Threads (Cont.)\nThe primary data structures of a thread include:\nE T HR E AD (executive thread block) – includes pointer\nto proces s to which thread belongs and to\nK T H R E AD, in kernel s pace\nK T H R E AD (kernel thread block) – s c heduling and\ns ynchronization info, kernel-mode s tack, pointer to\nT E B , in kernel s pace\nT E B (thread environment block) – thread id, us er-\nmode s tack, thread-local s torage, in us er s pace", "46": "Windows Threads Data Structures\nETHREAD: executive\nthread block\nKTHREAD: kernel thread\nblock\nTEB: thread environment\nblock", "47": "Linux Threads\nLinux refers to them as t asks rather than t hreads\nThread creation is done through clone() s ys tem call\nclone() allows a child task to s hare the addres s s pac e of the parent task\n(proc es s )\nFlags control behavior\nstruct task_struct points to proces s data s tructures (s hared or unique)", "48": "Reference\nChapter 4, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F4": {"1": "F4. Scheduling\nAndrás Márki\nandras.marki@his.se\nUniversity of Skövde\n2025-09-16", "2": "Content\n▪ Levels and goals of process scheduling\n▪ Preemptive vs. non-preemptive scheduling\n▪ Scheduling criteria\n▪ Common scheduling algorithms\n▪ Multi-Processor Scheduling\n▪ Scheduling Algorithms Evaluation", "3": "Objectives\n▪ To introduce CPU scheduling, which is the basis for\nmultiprogrammed operating systems\n▪ To describe various CPU-scheduling algorithms\n▪ To discuss evaluation criteria for selecting a CPU-\nscheduling algorithm for a particular system\n▪ To examine the scheduling algorithms of several\noperating systems", "4": "Process Behaviour\n▪ CPU-bound process is one that has more and longer\nCPU bursts (spends most of its time computing).\n▪ An I/O-bound process spends most of its time waiting\nfor I/O\n• Maximum CPU utilization is obtained with multiprogramming", "5": "Histogram of CPU-burst times\nCPU bursts vary from process to process, but a\nstudy shows the following frequency patterns\nThe study shows that most of\nthe processes have short CPU\nbursts of 2-3 milliseconds.\nThis means several short CPU bursts,\nand fewer longer CPU bursts per\nprocess to be executed on limited\nCPU. Hence the need for scheduling", "6": "Scheduler\n• Scheduler picks the next\nprocess in a queue\n• There are three types of\nScheduler", "7": "Levels of Scheduling\nProcess in\nMain Memory\nProcess in\nSwap Space\nProcess in\nDisk 7", "8": "Queuing Diagram for Scheduling\n• Long-term scheduler selects\nthe next New process from\nthe job queue to be allocated\nRAM space and joins the\nJob queue manager Ready queue manager ready queue\n• Short-term scheduler selects\nthe next Ready process from\nthe ready queue to be\nallocated CPU\n• Medium-term scheduler\nSwap space selects the next process Ready\nManager or Blocked, from the\nready/blocked queues to join\nthe swap space in suspended\nqueues, and back to the ready\nqueue from the swap space", "9": "CPU Scheduler\n▪ Short-term scheduler selects from among the\nprocesses in the ready queue to allocate the CPU\n▪ The queue may be ordered in various ways\n▪ CPU scheduling (i.e. short-term scheduling) decisions\nmay take place when a process:\n1. Switches from running to waiting\n2. Switches from running to ready\n3. Switches from waiting to ready\n4. A process terminates\n▪ If only the 1. and 4. situations occurs, scheduling is said to be\nnon-preemptive, and preemptive otherwise", "10": "When is scheduler invoked?\nPreemptive vs. Non-Preemptive Scheduling\nNon-Preemptive Scheduling Preemptive Scheduling\nOnce a process is allocated CPU can be taken away\nthe CPU, it cannot be taken temporarily without the process\naway, unless the process cooperation, and returned later to\nterminates or yields it. the process", "11": "Dispatcher\n▪ Dispatcher module gives control of the CPU to\nthe process selected by the short-term scheduler;\nthis involves:\n• switching context\n• switching to user mode\n• jumping to the proper\nlocation in the user\nprogram to restart that\nprogram", "12": "User mode vs Kernel mode\n• User mode is a non-privileged mode in the sense that it\nis forbidden for the process in this mode to access those\nmemory portions reserved for the Kernel or other\nprograms\n• When a kernel service is requested, the system state\nswitches temporarily to Kernel mode, which has\nsupervisory privileges over system resources\n• When kernel has satisfied the\nprocess’s request, user mode is\nrestored", "13": "Scheduling Criteria\n▪ CPU utilization – the percentage of time during which the\nCPU is not idle\n▪ Throughput – # of processes that complete their execution\nper time unit\n▪ Turnaround time – total amount of time to execute a\nparticular process (since submission)\n▪ Waiting time – the amount of time a process has been\nwaiting in the ready queue\n▪ Response time – amount of time it takes from issuing a\ncommand and getting a first response (i.e. first line of\noutput) 13", "14": "Scheduling Goals\n▪ Batch Processing: execution ▪ Interactive Processing:\nof jobs with no manual e.g. booking concert\nintervention, e.g. utility tickets, individual bank\nbillings or payroll systems: account transactions:\n• Maximize CPU utilization\n• Minimize response\n• Maximize throughput time (on average)\n• Minimize turnaround time ▪ In all cases, OS ensures:\n(average)\n• Fairness (among processes\n• Minimize waiting time to avoid \"starvation\")\n(average)\n• Efficiency (balance load\nacross all system parts)\n▪ Real-time processing\n• Complete process by given deadline • Scalability (expand\nperformance with further\nresources)", "15": "How to schedule?\nScheduling Algorithms\n• First-Come First-Served (FCFS) Scheduling\n• Shortest-Job First (SJF) Scheduling\n• Priority Scheduling\n• Round-Robin Scheduling\n• Multi-Level Scheduling\n• Multilevel Feedback Queue Scheduling", "16": "First- Come, First-Served (FCFS)\nScheduling (1)\nProcess Burst Time • Processes dispatched\nP1 24 according to their\narrival time\nP2 3\n• Non-preemptive\nP3 3\nSuppose that the processes arrive in the order: P1 , P2 , P3\nThe Gantt Chart for the schedule is:\nWaiting time for P1= 0; P2= 24; P3 = 27\nAverage waiting time: (0 + 24 + 27)/3 = 17", "17": "FCFS Scheduling (2)\nSuppose that the same processes arrive in the order:\nP2 , P3 , P1\n• - in this case the shorter jobs get the CPU first\n• - The Gantt chart for the schedule would be:\n• Waiting time for P1= 6; P2= 0; P3 = 3\n• Average waiting time: (6 + 0 + 3)/3 = 3 I/O bound processes behind\nCPU-bound process\n• Much better than the previous case\nFCFS Problem: Convoy effect:\nshort jobs behind long jobs", "18": "Shortest-Job-First (SJF) Scheduling\n▪ Scheduler selects processes with the smallest time to\nfinish\n• Lower average waiting time than FCFS\n• Reduces the number of waiting processes\n▪ SJF is proven optimal – gives minimum average waiting\ntime for a given set of processes\nSJF Problem: knowing (estimating) the length of the next\nCPU burst (requires future knowledge)", "19": "Example of SJF\nProcess Burst Time\nP1 0.0 6\nP2 2.0 8\nP3 4.0 7\nP4 5.0 3\nSJF scheduling chart (all processes arrive at Time 0)\nAverage waiting time = (P4+P1+P3+P2 )/4= (0+3+9+16)/4 = 7", "20": "Example of Shortest-remaining-time-\nFirst (Preemptive SJF)\n• Now we add the concepts of varying arrival times and preemption\nto the analysis\nProcess Arrival Time Burst Time\nP1 0 8\nP2 1 4\nP3 2 9\nP4 3 5\nPreemptive SJF Gantt Chart\nAverage waiting time = [(10-1)+(1-1)+(17-2)+(5-3)]/4 = 26/4 = 6.5\nmsec 20", "21": "Priority Scheduling\n▪ A priority number (integer) is associated with each\nprocess\n▪ The CPU is allocated to the process with the highest\npriority (smallest integer ≡ highest priority in Linux)\n- Preemptive version\n- Nonpreemptive version\n▪ SJF is priority scheduling where priority is the inverse of\nthe predicted next CPU burst time\n▪ Problem ≡ Starvation – low-priority processes may\nnever execute\n▪ Solution ≡ Ageing – as time progresses, increase the\npriority of the process", "22": "Example of Priority Scheduling\nProcess Burst Time Priority\nP1 10 3\nP2 1 1\nP3 2 4\nP4 1 5\nP5 5 2\nPriority scheduling Gantt Chart (all processes arrive at Time 0)\nAverage waiting time = (0+1+6+16+18)/5= 8.2 msec", "23": "Round Robin (RR) Scheduling\n▪ Each process gets a small unit of CPU time (time quantum\nq), usually 10-100 milliseconds. After this time has elapsed,\nthe process is preempted and added to the end of the ready\nqueue.\n▪ If there are n processes in the ready queue and the time\nquantum is q, then no process waits more than (n-1)q time\nunits.\n▪ Timer interrupts are triggered every quantum to schedule the\nnext process\n▪ Performance\n• Typically, higher average turnaround than SJF, but better\nresponse\n• q large ⇒ FIFO\n• q small ⇒ High overhead (i.e. frequent context switches) 23", "24": "Example of RR with Time\nQuantum = 4\nProcess Burst Time\nP1 24\nP2 3\nP3 3\n• The Gantt chart is (All processes arrive at Time 0):\n• Average waiting time =[(10-4)+4+7]/3=5.66 msec\n• q should be large compared to context-switch time\n• q usually 10ms to 100ms, context switch < 10 μsec", "25": "Another example with time\nquantum = 5)\nProcess Burst Time\nP1 10\nP2 6\nP3 3\nP4 5\nP1 P2 P3 P4 P1 P2\n0 5 10 13 18 23 24\nAverage waiting time =[(18-5)+(23-5)+10+13]/4=13.5", "26": "Time Quantum and Context Switch Time", "27": "Multilevel Queue\n▪ Ready queue is partitioned into separate queues, eg:\nforeground (interactive)\nbackground (batch)\n▪ Each queue has its own scheduling algorithm:\nforeground – RR\nbackground – FCFS\n▪ Scheduling must be done between the queues:\n• Fixed priority scheduling (i.e., serve all from foreground\nthen from background). Possibility of starvation.\n• Time slice – each queue gets a certain amount of CPU\ntime, i.e., 80% to foreground in RR, 20% to background\nin FCFS 27", "28": "Multilevel Queue Scheduling", "29": "Multilevel Feedback Queue\n▪ Different processes have different needs\n- Short I/O-bound interactive processes should generally run\nbefore CPU-bound batch processes\n- Behaviour patterns of processes are not immediately\nobvious to the scheduler (CPU-bound vs. I/O-bound)\n▪ Multilevel-feedback-queue:\n- Processes in each queue are served with round-robin\n- Arriving processes enter the highest-level queue and\nexecute with higher priority\n- Long processes repeatedly descend into lower levels\n- Short processes and I/O-bound processes are\nprioritized", "30": "Example of Multilevel Feedback\nQueue\n▪ Three queues:\nQ0 – RR with time quantum 8 milliseconds\nQ1 – RR time quantum 16 milliseconds\nQ2 – FCFS\nQ0\n▪ Scheduling\n• A new job enters queue Q0, which is served RR\n(8)\nQ1\n• When it gains CPU, the job receives 8\nmilliseconds\n• If it does not finish in 8 milliseconds, job is Q2\nmoved to queue Q1\n• At Q1 queue, job is served with RR (16) and\nreceives 16 additional milliseconds\n• If it still does not complete, it is preempted and\nmoved to queue Q2 where it is served with FCFS 30", "31": "Multiple-Processor Scheduling\n• Most current computers are utilising\nmultiprocessors (i.e. multicore processors)\n• A multicore processor has two or more\nprocessors called cores (usually, but not\nnecessarily, homogeneous)\n• The scheduler chooses an available\nprocessor to assign processes\n• CPU scheduling is more complex:\nsequencing and assignment", "32": "Asymmetric multiprocessing\nAll scheduling decisions handled\nby a single processor", "33": "Symmetric multiprocessing\n• Each processor is self-\nscheduling\n• Each processor may have its\nown private queue of ready\nprocesses\n• This is currently the most\ncommon approach to\nmultiple-processor scheduling", "34": "Scheduling Algorithm Evaluation\n▪ How to select a CPU-scheduling algorithm for an OS?\n✓ Deterministic Model: analyse a number of\nscenarios using fixed values\n✓ Develop an analytical model based on queuing\ntheory\n✓ Run simulation (not real systems) and collect\ndata to analyse\n✓ Implement the real system and evaluate it", "35": "Deterministic Modeling\n• Takes a particular predetermined\nworkload and defines the\nperformance of each algorithm for\nthat workload\n• E.g, consider 5 processes arriving\nat time 0\n• Pros\n- Simple and fast\n- Provides exact numbers for comparison between\nalgorithms\n• Cons\n• Applies only to the selected workload", "36": "Deterministic Evaluation (Example)\n▪ For each algorithm, calculate the minimum average waiting time\n▪ Simple and fast, but applies only to those workload inputs\nFCFS is 28ms:\nNon-preemptive SFJ is 13ms:\nRR is 23ms (quantum=10 ms):", "37": "Analytical Evaluation\n▪ Describes the arrival of processes and CPU and I/O\nbursts probabilistically\n- Distributions can be measured from real systems\n- Arrival rate is commonly exponential (typical\nprobability distribution used to model discrete events)\n- Workload is described by means (average processing\ntime)\n▪ A computer system is described as a network of\nservers, each with a queue of waiting processes\n- Each server has a service rate and dispatching discipline\n- Knowing the arrival rates and workload, one can compute\nutilisation, average wait time, etc.\n▪ Pros: Useful in comparing scheduling algorithms\n▪ Cons: Distributions are often oversimplified and resulting\naccuracy is questionable", "38": "Analytical Evaluation (Example)\nw = mean # items waiting\nTw = mean waiting time\nqueue\nDispatching server0\ndiscipline\nqueue\narrivals\nserver1\nλ= arrival rate\n……….\nqueue\nServern-1", "39": "Analytical Evaluation (Little Law)\n• Average number of processes in a system (r ) =\narrival rate (λ) * average time spent in the system\nTr (i.e. turnaround time):\nr = Tr * λ (1)\n• If we inject a workload r, then we can determine Tr\ngiven an estimated value of λ\n• Average turnaround time is average waiting time\n(Tw) + average service time (Ts):\nTr = Tw + Ts (2)\n• Knowing Tr from (1), and assuming a\npredetermined value of Ts , we determine Tw 39", "40": "Simulations\n• Simulations can provide an accurate evaluation of\nscheduling algorithms\n- Code a program that mimics a computer system and\nexperiment with different algorithms\n- Gather data that drives the simulation\n• Random number generator according to probabilities\n• Distributions derived empirically (i.e. from observations)\n• Trace record sequences of real events in real systems\n• Pros: Can provide accurate representations of how various\nalgorithms perform (especially when using trace tapes)\n• Cons: Can be very time-consuming 40", "41": "Implementation\n• Forgo simulations and estimations, just\nimplement the new scheduler and test it in\nreal systems\n• Pros\n– The most accurate approach for comparing\nalgorithms\n• Cons\n– High cost\n– Environments vary", "42": "References\nChapter 5, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F5": {"1": "F5. Synchronization\nAndrás Márki\nandras.marki@his.se\nUniversity of Skövde\n2025-09-24", "2": "Content\nBackground\nThe Critical-Section Problem\nPeterson’s Solution\nSynchronization Hardware\nMutex Locks\nSemaphores\nClassic Problems of Synchronization\nMonitors", "3": "Objectives\nTo present the concept of process\nsynchronization\nTo introduce the critical-section problem,\nwhose solutions can be used to ensure the\nconsistency of shared data\nTo present both software and hardware\nsolutions of the critical-section problem\nTo examine several classical process-\nsynchronization problems", "4": "Background\nProcesses can execute concurrently\n• May be interrupted at any time, partially completing execution\n• Concurrent access to shared data may result in data inconsistency\n• Maintaining data consistency requires mechanisms to ensure the\norderly execution of cooperating processes\nIllustration of the problem:\nSuppose that we want to provide a solution to the consumer-\nproducer problem that fills all the buffers. We can do so by having\nan integer counter that keeps track of the number of full buffers.\nInitially, the counter is set to 0. It is incremented by the producer\nafter it produces a new buffer and is decremented by the\nconsumer after it consumes a buffer.", "5": "Producer - Consumer\nwhile (true) {\nProducer /* produce an item in next produced */\nwhile (counter == BUFFER_SIZE) ;\n/* do nothing */\nbuffer[in] = next_produced;\nin = (in + 1) % BUFFER_SIZE;\ncounter++;\n}\nwhile (true) {\nwhile (counter == 0);\nConsumer /* do nothing */\nnext_consumed = buffer[out];\nout = (out + 1) % BUFFER_SIZE;\ncounter--;\n/* consume the item in next consumed */\n} 5", "6": "Race Condition (Race Hazard)\ncounter++ could be implemented as\nregister1 = counter\nregister1 = register1 + 1\ncounter = register1\ncounter-- could be implemented as\nregister2 = counter\nregister2 = register2 - 1\ncounter = register2\nConsider this execution interleaving with “count = 5” initially:\nT0: producer execute register1 = counter {register1 = 5}\nT1: producer execute register1 = register1 + 1 {register1 = 6}\nT2: consumer execute register2 = counter {register2 = 5}\nT3: consumer execute register2 = register2 – 1 {register2 = 4}\nT4: producer execute counter = register1 {counter = 6 }\nT5: consumer execute counter = register2 {counter = 4}\nT4: consumer execute counter = register2 {counter = 4}\nT5: producer execute counter = register1 {counter = 6 }", "7": "Critical Section Problem\nConsider system of n processes {p0 , p1 , … pn-1}\nEach process has a critical section segment of code\n• Process may be changing common variables,\nupdating a table, writing a file, etc\n• When one process is in the critical section, no other\nmay be in its critical section\nThe critical section problem is to design a protocol to\nenable the processes to cooperate\nEach process must ask permission to enter the critical\nsection in the entry section, may follow the critical\nsection with the exit section, then the remainder\nsection", "8": "Critical Section\nGeneral structure of process Pi\n1. Entry Section\nCode where a process requests permission to\nenter the critical section (right before a critical\nsection)\n1. Critical Section\n2. Exit Section\nCode executed when a process leaves the\ncritical section (right after a critical section)\n1. Remainder Section\nCode not affecting shared data", "9": "Solution to Critical-Section Problem\n1. Mutual Exclusion - If process Pi is executing in its critical section,\nthen no other processes can be executing in their critical sections\n2. Progress - if no process is executing in its critical section and\nsome processes wish to enter their critical sections, then only\nthose processes that are not executing in their remainder sections\ncan participate in making the decision as to which process will\nenter its critical section next. This selection cannot be postponed\nindefinitely. ( i.e. processes cannot be blocked forever waiting to\nget into their critical sections. )\n3. Bounded Waiting - There exists a limit as to how many other\nprocesses can get into their critical sections after a process\nrequests entry into their critical section and before that request is\ngranted. ( i.e. a process requesting entry into their critical section\nwill get a turn eventually, and there is a limit as to how many other\nprocesses get to go first. )", "10": "Peterson’s Solution\n• Good algorithmic description of solving the problem\n• Two process solution (sometimes called Peterson’s\noriginal solution)\nAssume that the load and store machine-language\ninstructions are atomic; that is, they cannot be\ninterrupted\nAssume the two processes share two variables:\nint turn;// who’s turn to enter CS,\neither 0 or 1\nBoolean flag[i]; // flag[i]==true\nindicates Pi ready (willing) to enter\nCS", "11": "Peterson’s Algorithm\nAlgorithm for Process Pi Algorithm for Process Pj\ndo { do {\nflag[i] = true; flag[j] = true;\nturn = j; turn = i;\nwhile (flag[j] && turn == j); while (flag[i] && turn == i);\ncritical section critical section\nflag[i] = false; flag[j] = false;\nremainder section remainder section\n} while (true); } while (true);", "12": "Peterson’s Solution (Cont.)\nIt is provable that the three CS requirements are met using Peterson’s\nSolution:\n1. Mutual exclusion is preserved\nPi enters CS only if flag[j]==false (flag[i]==true) or (and) turn!=j (turn=i)\nPossible that both processes want to enter CS ( flag[0]==true and\nflag[1]==true )\nturn can only be 0 or 1, but not both at the same time\n2. Progress requirement is satisfied\nTo prevent Pi from entering CS, flag[j]==true or turn==j!=i must hold\nThis implies that Pj can enter CS if it likes, as test for turn==i fails\nExiting its CS, Pj sets flag[j]=false, which allows Pi to complete its entry\nsection’s while loop and enter its CS\n3. Bounded-waiting requirement is met\nPj can only again enter its CS once it gave Pi the opportunity to enter its\nCS ( turn=i )", "13": "Synchronization Hardware\n● Many systems provide hardware support for implementing the critical\nsection code.\n● All solutions below are based on the idea of locking\n○ Protecting critical regions via locks\n● Uniprocessors – could disable interrupts\n○ Currently running code would execute without preemption\n○ Generally too inefficient on multiprocessor systems\n■ Operating systems using this are not broadly scalable\n● Modern machines provide special atomic hardware instructions\n■ Atomic = non-interruptible\n■ Atomic instructions that allow us\n● either to test and modify the content of a word or\n● to swap the contents of two words", "14": "Solution to Critical-section Problem\nUsing Locks\ndo {\nacquire lock\ncritical section\nrelease lock\nremainder section\n} while (TRUE);\nUni-processor environment disable all interrupts while in\nCS\nMulti-processor environment too time-consuming, side\neffects", "15": "Test and modify the content of a\nword atomically\nDefinition:\nboolean TestAndSet (boolean *target)\n{\nboolean rv = *target;// copy target to rv (return value)\n*target = TRUE;// set target to true\nreturn rv;//false: lock available | true:lock in use\n}\n1. Executed atomically\n2. Returns the original value of passed parameter\n3. Set the new value of passed parameter to “TRUE”.", "16": "Mutual Exclusion with TestAndSet\nShared Boolean variable lock, initialized to FALSE\nboolean lock = false;\nProcess Pi\ndo {\nwhile (TestAndSet(*lock));\n/* critical section */\nlock = false;\n/* remainder section */\n} while (true);", "17": "Atomically swap two variables\nvoid Swap(boolean *a, boolean *b) {\nboolean temp = *a;\n*a = *b;\n*b = temp;\n}", "18": "Bounded-waiting Mutual Exclusion\nwith TestandSet()\ndo {\nwaiting[i] = true; Unfortunately, for hardware\nkey = true; designers, implementing atomic\nwhile (waiting[i] && key) TestAndSet () instructions on\nkey = TestAndSet(*lock); multiprocessors is not a trivial\ntask.\nwaiting[i] = false;\n/* critical section */\nj = (i + 1) % n;\nwhile ((j != i) && !waiting[j])\nj = (j + 1) % n;\nif (j == i)\nlock = false;// release the lock\nelse\nwaiting[j] = false;\n/* remainder section */\n} while (true);", "19":

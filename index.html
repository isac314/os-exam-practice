 "Semaphore\nIt is a synchronisation tool that provides more sophisticated ways (than\nMutex locks) for processes to synchronise their activities.\nSemaphore S – integer variable\nCan only be accessed via two indivisible (atomic) operations\nwait() and signal()\nOriginally called P() and V()\nDefinition of the wait() operation\nwait(S) {\nwhile (S <= 0)\n; // busy wait\nS--;\n}\nDefinition of the signal() operation\nsignal(S) {\nS++;\n} 19", "20": "Semaphore Usage\nCounting semaphore – integer value can range over an unrestricted domain\nBinary semaphore – integer value can range only between 0 and 1\nSame as a mutex lock\nCan solve various synchronization problems\nConsider P1 and P2 that require a statement S1 to happen before S2\nCreate a semaphore “synch” initialized to 0\nP1:\nS1;\nsignal(synch);\nP2:\nwait(synch);\nS2;\nCan implement a counting semaphore S as a binary semaphore", "21": "Semaphore Implementation\nno two processes can execute the wait() and signal() on the same\nsemaphore at the same time\nThus, the implementation becomes the critical section problem where the\nwait and signal code are placed in the critical section\nCould now have busy waiting in the critical section implementation\n• But the implementation code is short\n• Little busy waiting is acceptable if the critical section is rarely\noccupied\nNote that applications may spend lots of time in critical sections, and\ntherefore, this is not a good solution\ndo {\nwait(mutex);\n/* critical section*/\nsignal(mutex);\n/*remainder section*/ 21", "22": "Semaphore Implementation with no\nBusy waiting\n• With each semaphore, there is an associated waiting queue\n• Each entry in a waiting queue has two data items:\nvalue (of type integer)\npointer to the next record in the list\n• Two operations:\nBlock – place the process invoking the operation on the\nappropriate waiting queue\nWakeup – remove one of the processes in the waiting queue and\nplace it in the ready queue\ntypedef struct{\nint value;\nstruct process *list;\n} semaphore;", "23": "Implementation with no Busy\nwaiting (Cont.)\nwait(semaphore *S) {\nS->value--;\nif (S->value < 0) {\nadd this process to S->list;\nblock();\n}\n}\nsignal(semaphore *S) {\nS->value++;\nif (S->value <= 0) {\nremove a process P from S->list;\nwakeup(P);\n}\n}", "24": "Deadlock and Starvation\nDeadlock – two or more processes are waiting indefinitely for an event that\ncan be caused by only one of the waiting processes\nLet S and Q be two semaphores initialized to 1\nP0\nP1\nwait(S); wait(Q);\nwait(Q); wait(S);\n...\n...\nsignal(S); signal(Q);\nsignal(Q); signal(S);\nStarvation – indefinite blocking\nA process may never be removed from the semaphore queue in which it is\nsuspended\nPriority Inversion – Scheduling problem when lower-priority process holds a\nlock needed by higher-priority process\nSolved via priority-inheritance protocol", "25": "Classical Problems of\nSynchronization\nClassical problems used to test newly-proposed synchronization schemes\nBounded-Buffer Problem\nReaders and Writers Problem\nDining-Philosophers Problem", "26": "Bounded-Buffer Problem\nn buffers, each can hold one item\nSemaphore mutex initialized to the value 1\nSemaphore full initialized to the value 0\nSemaphore empty initialized to the value n", "27": "Bounded Buffer Problem (Cont.)\nThe structure of the producer process\ndo {\n...\n/* produce an item in next_produced */\n...\nwait(empty);\nwait(mutex);\n...\n/* add next produced to the buffer */\n...\nsignal(mutex);\nsignal(full);\n} while (true);", "28": "Bounded Buffer Problem (Cont.)\nThe structure of the consumer process\ndo {\nwait(full);\nwait(mutex);\n...\n/* remove an item from buffer to next_consumed */\n...\nsignal(mutex);\nsignal(empty);\n...\n/* consume the item in next consumed */\n...\n} while (true);", "29": "Readers-Writers Problem\nA data set is shared among a number of concurrent processes\nReaders – only read the data set; they do not perform any updates\nWriters – can both read and write\nProblem – allow multiple readers to read at the same time\nOnly one single writer can access the shared data at the same time\nSeveral variations of how readers and writers are considered – all involve\nsome form of priorities\nShared Data\nData set\nSemaphore rw_mutex initialized to 1\nSemaphore mutex initialized to 1\nInteger read_count initialized to 0", "30": "Readers-Writers Problem (Cont.)\nThe structure of a writer process\ndo {\nwait(rw_mutex);\n...\n/* writing is performed */\n...\nsignal(rw_mutex);\n} while (true);", "31": "Readers-Writers Problem (Cont.)\nThe structure of a reader process\ndo {\nwait(mutex);\nread_count++;\nif (read_count == 1)\nwait(rw_mutex);\nsignal(mutex);\n...\n/* reading is performed */\n...\nwait(mutex);\nread_count--;\nif (read_count == 0)\nsignal(rw_mutex);\nsignal(mutex);\n} while (true);", "32": "Readers-Writers Problem Variations\nFirst variation – no reader kept waiting unless the writer has permission to\nuse the shared object\nSecond variation – once the writer is ready, it performs the write ASAP\nBoth may have starvation leading to even more variations\nProblem is solved on some systems by the kernel providing reader-writer\nlocks", "33": "Dining-Philosophers Problem\nPhilosophers spend their lives alternating between thinking and eating\nDon’t interact with their neighbours, occasionally try to pick up two\nchopsticks (one at a time) to eat from a bowl\nNeed both to eat, then release both when done\nIn the case of 5 philosophers\nShared data\nBowl of rice (data set)\nSemaphore chopstick [5] initialised to 1 33", "34": "Dining-Philosophers Problem\nAlgorithm\nThe structure of Philosopher i:\ndo {\nwait (chopstick[i] );\nwait (chopStick[ (i + 1) % 5] );\n// eat\nsignal (chopstick[i] );\nsignal (chopstick[ (i + 1) % 5] );\n// think\n} while (TRUE);\nWhat is the problem with this algorithm?", "35": "Dining-Philosophers Problem\nAlgorithm (Cont.)\nDeadlock handling\nAllow at most 4 philosophers to be sitting simultaneously at the table.\nAllow a philosopher to pick up the forks only if both are available\n(picking must be done in a critical section).\nUse an asymmetric solution -- an odd-numbered philosopher picks up\nfirst the left chopstick and then the right chopstick. Even-numbered\nphilosopher picks up first the right chopstick and then the left\nchopstick.", "36": "Problems with Semaphores\nIncorrect use of semaphore operations:\nsignal (mutex) …. wait (mutex)\nwait (mutex) … wait (mutex)\nOmitting wait (mutex) or signal (mutex) (or both)\nDeadlock and starvation are possible.", "37": "Monitors\nA high-level abstraction that provides a convenient and effective mechanism for\nprocess synchronization\nAbstract data type (ADT), internal variables only accessible by code within the\nprocedure\nOnly one process may be active within the monitor at a time\nBut not powerful enough to model some synchronization schemes\nmonitor monitor-name\n{\n// shared variable declarations\nprocedure P1 (…) {…}\nprocedure Pn (…) {…}\nInitialization code (…) { … }\n}\n}", "38": "Condition Variables\ncondition x, y;\nTwo operations are allowed on a condition variable:\nx.wait() – a process that invokes the operation is suspended until\nx.signal()\nx.signal() – resumes one of processes (if any) that invoked\nx.wait()\nIf no x.wait() on the variable, then it has no effect on the\nvariable", "39": "Condition Variables Choices\nIf process P invokes x.signal(), and process Q is suspended in\nx.wait(), what should happen next?\nBoth Q and P cannot execute in parallel. If Q is resumed, then P must\nwait\nOptions include\nSignal and wait – P waits until Q either leaves the monitor or it waits for\nanother condition\nSignal and continue – Q waits until P either leaves the monitor or it\nwaits for another condition\nBoth have pros and cons – language implementer can decide\nMonitors implemented in Concurrent Pascal compromise\nP executing signal immediately leaves the monitor, Q is resumed\nImplemented in other languages including Mesa, C#, Java", "40": "Monitor Solution to Dining\nPhilosophers\nmonitor DiningPhilosophers\n{\nenum { THINKING; HUNGRY, EATING) state [5] ;\ncondition self [5];\nvoid pickup (int i) {\nstate[i] = HUNGRY;\ntest(i);\nif (state[i] != EATING) self[i].wait;\n}\nvoid putdown (int i) {\nstate[i] = THINKING;\n// test left and right neighbours\ntest((i + 4) % 5);\ntest((i + 1) % 5);\n}", "41": "Solution to Dining Philosophers\n(Cont.)\nvoid test (int i) {\nif ((state[(i + 4) % 5] != EATING) &&\n(state[i] == HUNGRY) &&\n(state[(i + 1) % 5] != EATING) ) {\nstate[i] = EATING ;\nself[i].signal () ;\n}\n}\ninitialization_code() {\nfor (int i = 0; i < 5; i++)\nstate[i] = THINKING;\n}\n}", "42": "Solution to Dining Philosophers\n(Cont.)\nEach philosopher i invokes the operations pickup() and putdown() in\nthe following sequence:\nDiningPhilosophers.pickup(i);\nEAT\nDiningPhilosophers.putdown(i);\nNo deadlock, but starvation is possible", "43": "Monitor Implementation Using\nSemaphores\nVariables\nsemaphore mutex; // (initially = 1)\nsemaphore next; // (initially = 0)\nint next_count = 0;\nEach procedure F will be replaced by\nwait(mutex);\n…\nbody of F;\n…\nif (next_count > 0)\nsignal(next)\nelse\nsignal(mutex);\nMutual exclusion within a monitor is ensured", "44": "Monitor Implementation – Condition\nVariables\nFor each condition variable x, we have:\nsemaphore x_sem; // (initially = 0)\nint x_count = 0;\nThe operation x.wait can be implemented as:\nx_count++;\nif (next_count > 0)\nsignal(next);\nelse\nsignal(mutex);\nwait(x_sem);\nx_count--;", "45": "Monitor Implementation (Cont.)\nThe operation x.signal can be implemented as:\nif (x_count > 0) {\nnext_count++;\nsignal(x_sem);\nwait(next);\nnext_count--;\n}", "46": "Resuming Processes within a\nMonitor\nIf several processes queued on condition x, and x.signal() executed, which\nshould be resumed?\nFCFS frequently not adequate\nconditional-wait construct of the form x.wait(c)\nWhere c is priority number\nProcess with lowest number (highest priority) is scheduled next", "47": "Single Resource allocation\nAllocate a single resource among competing processes using priority\nnumbers that specify the maximum time a process plans to use the\nresource\nR.acquire(t);\n...\naccess the resource;\n...\nR.release;\nWhere R is an instance of type ResourceAllocator", "48": "A Monitor to Allocate Single\nResource\nmonitor ResourceAllocator\n{\nboolean busy;\ncondition x;\nvoid acquire(int time) {\nif (busy)\nx.wait(time);\nbusy = TRUE;\n}\nvoid release() {\nbusy = FALSE;\nx.signal();\n}\ninitialization code() {\nbusy = FALSE;\n}\n}", "49": "References\nChapter 6, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F6": {"1": "F6. Deadlocks\nAndrás Márki\nandras.marki@his.se\nUniversity of Skövde\n2025-09-25", "2": "Content\nSystem Model\nDeadlock Characterization\nMethods for Handling Deadlocks\nDeadlock Prevention\nDeadlock Avoidance\nDeadlock Detection\nRecovery from Deadlock", "3": "Objectives\nTo develop a description of deadlocks, which\nprevent sets of concurrent processes from\ncompleting their tasks\nTo present a number of different methods for\npreventing or avoiding deadlocks in a\ncomputer system", "4": "System Model\nSystem consists of resources\nResource types R1, R2, . . ., Rm\nCPU cycles, memory space, I/O devices\nEach resource type Ri has Wi instances.\nEach process utilizes a resource as follows:\nrequest\nuse\nrelease", "5": "Deadlock Characterization\nDeadlock can arise if four conditions hold simultaneously.\nMutual exclusion: only one process at a time can use a resource\nHold and wait: a process holding at least one resource is waiting to\nacquire additional resources held by other processes\nNo preemption: a resource can be released only voluntarily by the\nprocess holding it, after that process has completed its task\nCircular wait: there exists a set {P0, P1, …, Pn} of waiting processes\nsuch that P0 is waiting for a resource that is held by P1, P1 is\nwaiting for a resource that is held by P2, …, Pn–1 is waiting for a\nresource that is held by Pn, and Pn is waiting for a resource that is\nheld by P0.", "6": "Resource-Allocation Graph\nA set of vertices V and a set of edges E.\nV is partitioned into two types:\nP = {P1, P2, …, Pn}, the set consisting of all the\nprocesses in the system\nR = {R1, R2, …, Rm}, the set consisting of all resource\ntypes in the system\nE: directed edge\nrequest edge – directed edge Pi → Rj\nassignment edge – directed edge Rj → Pi", "7": "Resource-Allocation Graph (Cont.)\nProcess\nResource Type with 4 instances\nPi requests an instance of Rj (Request edge)\nPi\nRj\nPi is holding one instance of Rj (Assignment edge)\nPi\nRj 7", "8": "Example of a Resource Allocation\nGraph", "9": "Resource Allocation Graph With A\nDeadlock", "10": "Graph With A Cycle But No Deadlock", "11": "Basic Facts\nIf graph contains no cycles ⇒ no deadlock\nIf graph contains a cycle ⇒\nif only one instance per resource type, then\ndeadlock\nif several instances per resource type,\npossibility of deadlock", "12": "Methods for Handling Deadlocks\nEnsure that the system will never enter a deadlock state:\nDeadlock prevention\nDeadlock avoidance\nAllow the system to enter a deadlock state and then\nrecover\nIgnore the problem and pretend that deadlocks never\noccur in the system; this is used by most operating\nsystems, including UNIX", "13": "Deadlock Prevention\nEnsure at least one of the four necessary conditions does\nnot hold:\nMutual Exclusion – not required for sharable resources\n(e.g., read-only files); must hold for non-sharable\nresources\nHold and Wait – must guarantee that whenever a process\nrequests a resource, it does not hold any other\nresources\nRequire process or allow process to request\nresources only when the process has none\nallocated to it.\nLow resource utilisation; starvation possible.", "14": "Deadlock Prevention (Cont.)\nNo Preemption –\nIf a process that is holding some resources requests\nanother resource that cannot be immediately\nallocated to it, then all resources currently being\nheld are released\nPreempted resources are added to the list of\nresources for which the process is waiting\nProcess will be restarted only when it can regain its\nold resources, as well as the new ones that it is\nrequesting\nCircular Wait – impose a total ordering of all resource\ntypes, and require that each process request resources\nin an increasing order of enumeration 14", "15": "Deadlock Example\n/* thread one runs in this function */\nvoid *do_work_one(void *param)\n{\npthread_mutex_lock(&first_mutex);\npthread_mutex_lock(&second_mutex);\n/** * Do some work */\npthread_mutex_unlock(&second_mutex);\npthread_mutex_unlock(&first_mutex);\npthread_exit(0);\n}\n/* thread two runs in this function */\nvoid *do_work_two(void *param)\n{\npthread_mutex_lock(&second_mutex);\npthread_mutex_lock(&first_mutex);\n/** * Do some work */\npthread_mutex_unlock(&first_mutex);\npthread_mutex_unlock(&second_mutex);\npthread_exit(0);\n}", "16": "Deadlock Example with Lock\nOrdering\nvoid transaction(Account from, Account to, double amount)\n{\nmutex lock1, lock2;\nlock1 = get_lock(from);\nlock2 = get_lock(to);\nacquire(lock1);\nacquire(lock2);\nwithdraw(from, amount);\ndeposit(to, amount);\nrelease(lock2);\nrelease(lock1);\n}\nTransactions 1 and 2 execute concurrently. Transaction 1 transfers $25 from\naccount A to account B, and Transaction 2 transfers $50 from account B to\naccount A", "17": "Deadlock Avoidance\nRequires that the system has some additional a priori\ninformation available\nSimplest and most useful model requires that each\nprocess declare the maximum number of resources of\neach type that it may need\nThe deadlock-avoidance algorithm dynamically examines\nthe resource-allocation state to ensure that there can\nnever be a circular-wait condition\nResource-allocation state is defined by the number of\navailable and allocated resources, and the maximum\ndemands of the processes", "18": "Safe State\nWhen a process requests an available resource, the system must\ndecide if immediate allocation leaves the system in a safe state\nSystem is in a safe state if there exists a sequence <P1, P2, …, Pn> of\nALL the processes in the system such that for each Pi, the\nresources that Pi can still request can be satisfied by currently\navailable resources + resources held by all the Pj, with j < I\nThat is:\nIf Pi resource needs are not immediately available, then Pi can\nwait until all Pj have finished\nWhen Pj is finished, Pi can obtain needed resources, execute,\nreturn allocated resources, and terminate\nWhen Pi terminates, Pi +1 can obtain its needed resources, and so\non", "19": "Basic Facts\nIf a system is in a safe state ⇒ no deadlocks\nIf a system is in an unsafe state ⇒ possibility\nof deadlock\nAvoidance ⇒ ensure that a system will never\nenter an unsafe state.", "20": "Safe, Unsafe, Deadlock State", "21": "Avoidance Algorithms\nSingle instance of a resource type\nUse a resource-allocation graph\nMultiple instances of a resource type\nUse the banker’s algorithm", "22": "Resource-Allocation Graph Scheme\nClaim edge Pi → Rj indicated that process Pi may request\nresource Rj; represented by a dashed line\nClaim edge converts to request edge when a process\nrequests a resource\nRequest edge converted to an assignment edge when the\nresource is allocated to the process\nWhen a resource is released by a process, assignment\nedge reconverts to a claim edge\nResources must be claimed a priori in the system", "23": "Resource-Allocation Graph\nAssignment edge:\nR1 → P1\nRequest edge:\nP2 → R1\nClaim edge:\nP1 → R2\nP2 → R2", "24": "Unsafe State In Resource-Allocation\nGraph", "25": "Resource-Allocation Graph\nAlgorithm\nSuppose that process Pi requests a resource Rj\nThe request can be granted only if converting\nthe request edge to an assignment edge does\nnot result in the formation of a cycle in the\nresource allocation graph", "26": "Banker’s Algorithm\nMultiple instances\nEach process must a priori claim maximum\nuse\nWhen a process requests a resource it may\nhave to wait\nWhen a process gets all its resources it must\nreturn them in a finite amount of time", "27": "Data Structures for the Banker’s\nAlgorithm\nLet n = number of processes, and m = number of resource\ntypes.\nAvailable: Vector of length m. If available[j] = k, there are\nk instances of resource type Rj available\nMax: n x m matrix. If Max[i,j] = k, then process Pi may\nrequest at most k instances of resource type Rj\nAllocation: n x m matrix. If Allocation[i,j] = k then Pi is\ncurrently allocated k instances of Rj\nNeed: n x m matrix. If Need[i,j] = k, then Pi may need k\nmore instances of Rj to complete its task\nNeed [i,j] = Max[i,j] – Allocation [i,j] 27", "28": "Safety Algorithm\n1. Let Work and Finish be vectors of length m and n, respectively.\nInitialize:\nWork = Available\nFinish [i] = false for i = 0, 1, …, n- 1\n2. Find an i such that both:\n(a) Finish [i] = false\n(b) Needi ≤ Work\nIf no such i exists, go to step 4\n3. Work = Work + Allocationi\nFinish[i] = true\ngo to step 2\n4. If Finish [i] == true for all i, then the system is in a safe state", "29": "Resource-Request Algorithm for\nProcess Pi\nRequesti = request vector for process Pi. If Requesti [j] = k\nthen process Pi wants k instances of resource type Rj\n1. If Requesti ≤ Needi go to step 2. Otherwise, raise error condition,\nsince process has exceeded its maximum claim\n2. If Requesti ≤ Available, go to step 3. Otherwise Pi must wait,\nsince resources are not available\n3. Pretend to allocate requested resources to Pi by modifying the\nstate as follows:\nAvailable = Available – Requesti;\nAllocationi = Allocationi + Requesti;\nNeedi = Needi – Requesti;\nIf safe ⇒ the resources are allocated to Pi\nIf unsafe ⇒ Pi must wait, and the old resource-allocation state is\nrestored", "30": "Example of Banker’s Algorithm\n5 processes P0 through P4;\n3 resource types:\nA (10 instances), B (5 instances), and C (7 instances)\nSnapshot at time T0:\nAllocation Max Available\nA B C A B C A B C\nP0 0 1 0 7 5 3 3 3 2\nP1 2 0 0 3 2 2\nP2 3 0 2 9 0 2\nP3 2 1 1 2 2 2\nP4 0 0 2 4 3 3", "31": "Example II.\nThe content of the matrix Need is defined to be Max – Allocation\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nTotal_allocated 7 2 5\nA B C\nAvailable 3 3 2\nMax_Available 10 5 7", "32": "Example III.\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,4,3] > Available [3,3,2]\nA B C P1 needs [1,2,2] <= Available [3,3,2]\nAvailable 3 3 2 -> P1 can execute and release its\nallocated resources\nMax_Available 10 5 7 Sequence <P1>", "33": "Example IV.\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,4,3] > Available [5,3,2]\nA B C P2 needs [6,0,0] > Available [5,3,2]\nAvailable 5 3 2 P3 needs [0,1,1] <= Available [5,3,2]\n-> P3 can execute and release its\nMax_Available 10 5 7 allocated resources\nSequence <P1,P3> 33", "34": "Example V.\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP2 3 0 2 9 0 2 6 0 0\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,4,3] <= Available [7,4,3]\nA B C -> P0 can execute and release its\nAvailable 7 4 3 allocated resources\nSequence <P1,P3,P0>\nMax_Available 10 5 7", "35": "Example VI.\nAllocation Max Need\nA B C A B C A B C\nP2 3 0 2 9 0 2 6 0 0\nP4 0 0 2 4 3 3 4 3 1\nP2 needs [6,0,0] <= Available [7,5,3]\nA B C -> P2 can execute and release its\nAvailable 7 5 3 allocated resources\nSequence <P1,P3,P0,P2>\nMax_Available 10 5 7", "36": "Example VII.\nAllocation Max Need\nA B C A B C A B C\nP4 0 0 2 4 3 3 4 3 1\nP4 needs [4,3,1] <= Available [10,5,5]\nA B C -> P4 can execute and release its\nAvailable 10 5 5 allocated resources\nSequence <P1,P3,P0,P2,P4>\nMax_Available 10 5 7", "37": "Example VIII.\nAllocation Max Need\nA B C A B C A B C\nSequence <P1,P3,P0,P2,P4>\nA B C -> safe sequence exists\nAvailable 10 5 7 -> the system is in a safe state\nMax_Available 10 5 7", "38": "Example IX.\nAllocation Max Need\nA B C A B C A B C\nSequence <P1,P3,P0,P2,P4>\nA B C -> safe sequence exists\nAvailable 10 5 7 -> the system is in a safe state\nNote: multiple safe sequences can exist\nMax_Available 10 5 7 <P1, P3, P4, P2, P0> is safe too in\nthis case 38", "39": "Second example P1 requests [1,0,2]: I.\nP1 requests additional [1,0,2], i.e [3,0,2] instead of [2,0,0] compared to the\nfirst example -> Can P1’s request be granted?\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP1 3 0 2 3 2 2 0 2 0\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nTotal_allocated 8 2 7\nA B C\nAvailable 2 3 0\nMax_Available 10 5 7", "40": "Second example P1 requests [1,0,2]: II.\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP1 3 0 2 3 2 2 0 2 0\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,4,3] > Available [2,3,0]\nP1 needs [0,2,0] <= Available [2,3,0]\n-> P1 can execute and release its\nA B C allocated resources\nSequence <P1>\nAvailable 2 3 0\n-> and the rest is the same with the\nsequence, the system is still in safe\nMax_Available 10 5 7 state 40", "41": "Third example P4 requests [3,3,0]: I.\nP4 requests additional [3,3,0], i.e [3,3,2] instead of [0,0,2] compared to the\nfirst example -> Can P4’s request be granted?\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 3 3 2 4 3 3 1 0 1\nTotal_allocated 10 5 5\nA B C\nAvailable 0 0 2\nMax_Available 10 5 7", "42": "Third example P4 requests [3,3,0]: II.\nAllocation Max Need\nA B C A B C A B C\nP0 0 1 0 7 5 3 7 4 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 3 3 2 4 3 3 1 0 1\nP0 needs [7,4,3] > Available [0,0,2]\nP1 needs [1,2,2] > Available [0,0,2]\nP2 needs [6,0,0] > Available [0,0,2]\nP3 needs [0,1,1] > Available [0,0,2]\nP4 needs [1,0,1] > Available [0,0,2]\nA B C Sequence <>\nAvailable 0 0 2 -> Unsafe\n-> The request of P4 cannot be granted\nMax_Available 10 5 7", "43": "Fourth example P0 requests [0,2,0]: I.\nP0 requests additional [0,2,0], i.e [0,3,0] instead of [0,1,0] compared to the\nfirst example -> Can P0’s request be granted?\nAllocation Max Need\nA B C A B C A B C\nP0 0 3 0 7 5 3 7 2 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nTotal 7 4 5\nA B C\nAvailable 3 1 2\nMax_Available 10 5 7", "44": "Fourth example P0 requests [0,2,0]: II.\nAllocation Max Need\nA B C A B C A B C\nP0 0 3 0 7 5 3 7 2 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP3 2 1 1 2 2 2 0 1 1\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,2,3] > Available [3,1,2]\nP1 needs [1,2,2] > Available [3,1,2]\nP2 needs [6,0,0] > Available [3,1,2]\nP3 needs [0,1,1] <= Available [3,1,2]\nA B C -> P3 can execute and release its\nAvailable 3 1 2 allocated resources\nSequence <P3>\nMax_Available 10 5 7", "45": "Fourth example P0 requests [0,2,0]: III.\nAllocation Max Need\nA B C A B C A B C\nP0 0 3 0 7 5 3 7 2 3\nP1 2 0 0 3 2 2 1 2 2\nP2 3 0 2 9 0 2 6 0 0\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,2,3] > Available [5,2,3]\nP1 needs [1,2,2] <= Available [5,2,3]\n-> P1 can execute and release its\nallocated resources\nA B C\nAvailable 5 2 3 Sequence <P3,P1>\nMax_Available 10 5 7", "46": "Fourth example P0 requests [0,2,0]: IV.\nAllocation Max Need\nA B C A B C A B C\nP0 0 3 0 7 5 3 7 2 3\nP2 3 0 2 9 0 2 6 0 0\nP4 0 0 2 4 3 3 4 3 1\nP0 needs [7,2,3] <= Available [7,2,3]\n-> P0 can execute and release its\nallocated resources\nA B C Sequence <P3,P1,P0>\nAvailable 7 2 3\nMax_Available 10 5 7", "47": "Fourth example P0 requests [0,2,0]: V.\nAllocation Max Need\nA B C A B C A B C\nP2 3 0 2 9 0 2 6 0 0\nP4 0 0 2 4 3 3 4 3 1\nP2 needs [6,0,0] <= Available [7,5,3]\n-> P2 can execute and release its\nallocated resources\nA B C Sequence <P3,P1,P0,P2>\nAvailable 7 5 3\nMax_Available 10 5 7", "48": "Fourth example P0 requests [0,2,0]: VI.\nAllocation Max Need\nA B C A B C A B C\nP4 0 0 2 4 3 3 4 3 1\nP4 needs [0,0,2] <= Available [10,5,5]\n-> P4 can execute and release its\nallocated resources\nA B C Sequence <P3,P1,P0,P2,P4>\nAvailable 10 5 5\nMax_Available 10 5 7", "49": "Fourth example P0 requests [0,2,0]: VII.\nAllocation Max Need\nA B C A B C A B C\nSequence <P3,P1,P0,P2,P4>\n-> safe sequence exists\nCan P0’s request be granted?\n-> yes, P0’s request for [0,2,0] can be\nA B C granted\nAvailable 10 5 7\nMax_Available 10 5 7", "50": "Deadlock Detection\nAllow system to enter deadlock state\nDetection algorithm\nRecovery scheme", "51": "Single Instance of Each Resource\nType\nMaintain wait-for graph\nNodes are processes\nPi → Pj if Pi is waiting for Pj\nPeriodically invoke an algorithm that searches\nfor a cycle in the graph. If there is a cycle,\nthere exists a deadlock\nAn algorithm to detect a cycle in a graph\nrequires an order of n2 operations, where n\nis the number of vertices in the graph", "52": "Resource-Allocation Graph and\nWait-for Graph\nResource-Allocation Graph Corresponding wait-for graph", "53": "Several Instances of a Resource\nType\nAvailable: A vector of length m indicates the number of\navailable resources of each type\nAllocation: An n x m matrix defines the number of\nresources of each type currently allocated to each\nprocess\nRequest: An n x m matrix indicates the current request\nof each process. If Request [i][j] = k, then process Pi\nis requesting k more instances of resource type Rj", "54": "Detection Algorithm\n1. Let Work and Finish be vectors of length m and n, respectively\nInitialize:\n(a) Work = Available\n(b) For i = 1,2, …, n, if Allocationi ≠ 0, then\nFinish[i] = false; otherwise, Finish[i] = true\n2. Find an index i such that both:\n(a) Finish[i] == false\n(b) Requesti ≤ Work\nIf no such i exists, go to step 4\n3. Work = Work + Allocationi\nFinish[i] = true\ngo to step 2\n4. If Finish[i] == false, for some i, 1 ≤ i ≤ n, then the system is in\ndeadlock state. Moreover, if Finish[i] == false, then Pi is deadlocked\nThe algorithm requires an order of O(m x n2) operations to detect whether\nthe system is in a deadlocked state 54", "55": "Example of Detection Algorithm I.\nFive processes P0 through P4; three resource types\nA (7 instances), B (2 instances), and C (6 instances)\nSnapshot at time T0: Allocation Request\nA B C A B C\nP0 0 1 0 0 0 0\nP1 2 0 0 2 0 2\nP2 3 0 3 0 0 0\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 0 0 0\nMax_Available 7 2 6", "56": "Example of Detection Algorithm II.\nAllocation Request\nA B C A B C\nP0 0 1 0 0 0 0\nP1 2 0 0 2 0 2\nP2 3 0 3 0 0 0\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 0 0 0\nMax_Available 7 2 6\nSequence: <>\nP0 can be added to the sequence as it request can be fulfilled 56", "57": "Example of Detection Algorithm III.\nAllocation Request\nA B C A B C\nP1 2 0 0 2 0 2\nP2 3 0 3 0 0 0\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 0 1 0\nMax_Available 7 2 6\nSequence: <P0>\nP2 can be added to the sequence as it request can be fulfilled 57", "58": "Example of Detection Algorithm IV.\nAllocation Request\nA B C A B C\nP1 2 0 0 2 0 2\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 3 1 3\nMax_Available 7 2 6\nSequence: <P0,P2>\nP1 can be added to the sequence as it request can be fulfilled 58", "59": "Example of Detection Algorithm V.\nAllocation Request\nA B C A B C\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 5 1 3\nMax_Available 7 2 6\nSequence: <P0,P2,P1>\nP3 can be added to the sequence as it request can be fulfilled 59", "60": "Example of Detection Algorithm VI.\nAllocation Request\nA B C A B C\nP4 0 0 2 0 0 2\nA B C\nAvailable 7 2 4\nMax_Available 7 2 6\nSequence: <P0,P2,P1,P3>\nP4 can be added to the sequence as it request can be fulfilled 60", "61": "Example of Detection Algorithm VII.\nAllocation Request\nA B C A B C\nA B C\nAvailable 7 2 6\nMax_Available 7 2 6\nSequence: <P0,P2,P1,P3,P4>\n-> The system is not in a deadlock state. 61", "62": "Second example of\nDetection Algorithm I.\nP2 requests an additional instance of type C\nSnapshot at time T0: Allocation Request\nA B C A B C\nP0 0 1 0 0 0 0\nP1 2 0 0 2 0 2\nP2 3 0 3 0 0 1\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 0 0 0\nMax_Available 7 2 6", "63": "Second example of\nDetection Algorithm II.\nAllocation Request\nA B C A B C\nP0 0 1 0 0 0 0\nP1 2 0 0 2 0 2\nP2 3 0 3 0 0 1\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 0 0 0\nMax_Available 7 2 6\nSequence: <>\nP0 can be added to the sequence as it request can be fulfilled 63", "64": "Second example of\nDetection Algorithm III.\nAllocation Request\nA B C A B C\nP1 2 0 0 2 0 2\nP2 3 0 3 0 0 1\nP3 2 1 1 1 0 0\nP4 0 0 2 0 0 2\nA B C\nAvailable 0 1 0\nMax_Available 7 2 6\nSequence: <P0>\n• Resources held by P0 can be reclaimed\n• Insufficient resources to fulfil other processes\n• Deadlock exists, consisting of processes P1, P2, P3 and P4", "65": "Detection-Algorithm Usage\nWhen and how often to invoke depends on:\nHow often is a deadlock likely to occur?\nHow many processes will be affected by the\ndeadlock when it happens?\nIf the detection algorithm is invoked arbitrarily,\nthere may be many cycles in the resource\ngraph, and so we would not be able to tell\nwhich of the many deadlocked processes\n“caused” the deadlock.", "66": "Recovery from Deadlock: Process\nTermination\nAbort all deadlocked processes\nAbort one process at a time until the deadlock cycle is\neliminated\nFactors may affect which order we should choose to\nabort.\n1. Priority of the process\n2. How long has the process been computed, and\nhow much longer until completion\n3. Resources the process has used\n4. Resources process needs to be completed\n5. How many processes will need to be terminated\n6. Is the process interactive or batch? 66", "67": "Recovery from Deadlock: Resource\nPreemption\nSelecting a victim – minimise cost\nRollback – return to some safe state, restart the process\nfor that state\nStarvation – the same process may always be picked as\na victim, adding the number of rollbacks in the cost\nfactor (without actually solving the situation)", "68": "Reference\nChapter 7, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F7": {"1": "F7. Main Memory\nSimon Butler\nsimon.butler@his.se\nUniversity of Skövde\n2020-09-29", "2": "Content\n● Background\n● Memory Allocation\n● Paging\n● Segmentation", "3": "Objectives\n● Describe the organizing memory\nhardware\n● Discuss memory-management\ntechniques, including paging and\nsegmentation", "4": "Base and Limit Registers\n● A pair of base and\nlimit registers\ndefine the logical\naddress space\n● CPU must check\nevery memory\naccess generated\nin user mode to be\nsure it is between\nbase and limit for\nthat user", "6": "Address Binding\n● Programs on disk, ready to be brought into memory to\nexecute form an input queue\n●\nWithout support, must be loaded into address 00000\n● Source-code programmer uses symbolic references, such as\nvariables\n● Compiled code addresses bind to relocatable addresses\n●\ni.e. “14 bytes from beginning of this module”\n● Linker or loader will bind relocatable addresses to absolute\naddresses\n●\ni.e. 74014\n● Each binding maps one address space to another", "7": "Binding of Instructions and Data to\nMemory\n● Address binding of instructions and data to\nmemory addresses can happen at three different\nstages\n●\nCompile time: If memory location of a code is\nknown a priori, absolute code is generated (by\nCompiler)\n●\nLoad time: Use relocatable code (produced by by\ncompiler) to generate absolute code (by Loader)\n●\nExecution time: Binding occurs at run time when\nthe process is moved during its execution\n●\nNeed hardware support for address mapping\n(e.g., base or relocation register)", "8": "Multistep Processing of a User\nProgram\n● Module\n○ Programs are written in modules\n○ Modules can be written and\ncompiled independently\n○ Modules can be shared among\nprocesses\n● Linking\n○ Static linking – system libraries and\nprogram code combined by the\nloader into the binary version of the\nprogram, at compile-time\n○ Dynamic linking –linking postponed\nuntil execution time (useful for\nruntime libraries such as Windows\nDLL)", "9": "Logical vs. Physical Address Space\n● The logical address space is bound to a separate\nphysical address space\n● Logical address - generated by the CPU; also\nreferred to as virtual address\n● Physical address – address seen by the memory\nunit\n● Logical (virtual) and physical addresses differ at\nexecution-time", "10": "Dynamic relocation using a\nrelocation register\n● Routine is not loaded until it is\ncalled\n● All routines kept on disk in\nrelocatable load format\n● No special support from the\noperating system is required\n●\nImplemented through\nprogram design\n●\nOS can help by providing\nlibraries to implement (Memory Management Unit)\ndynamic loading\nA memory management unit (MMU), sometimes called paged memory management unit (PMMU), is a\ncomputer hardware unit having all memory references passed through itself, primarily performing the\ntranslation of virtual memory addresses to physical addresses. https://en.wikipedia.org/wiki/Memory_management_unit", "11": "Swapping\n● A process can be swapped\ntemporarily out of memory\nto a backing store, and back\ninto memory for continued\nexecution\n●\nTotal physical memory\nspace of processes can\nexceed physical memory\n● Major swap time is\ntransfer time; total transfer\ntime is proportional to the\namount of memory swapped", "12": "Contiguous Memory Allocation\n● Main memory must support both OS and user\nprocesses\n● Limited resource, must allocate efficiently\n● Contiguous allocation is one early method\n● Main memory usually is divided into two\npartitions:\n●\nOperating system, is in low memory with\ninterrupt vector\n●\nUser processes are in high memory\n● Each process contained in single contiguous\nsection of memory", "13": "Multiple-partition allocation\n● Multiple-partition allocation\n●\nDegree of multiprogramming limited by number of partitions\n●\nHole – block of available memory; holes of various size are scattered\nthroughout memory\n●\nWhen a process arrives, it is allocated memory from a hole large\nenough to accommodate it\n●\nExiting process frees its partition, adjacent free partitions combined\n●\nOperating system maintains information about:\na) allocated partitions b) free partitions (hole)", "14": "Dynamic Storage-Allocation\nProblem\nHow to satisfy a request of size n from a list of free\nholes?\n● First-fit: Allocate the first hole that is big enough\n● Best-fit: Allocate the smallest hole that is big\nenough; must search entire list, unless ordered by size\n●\nProduces the smallest leftover hole\n● Worst-fit: Allocate the largest hole; must also search\nentire list\n●\nProduces the largest leftover hole\nFirst-fit and best-fit better than worst-fit in terms of\nspeed and storage utilization", "15": "Fragmentation\n● External Fragmentation – total memory space\nexists to satisfy a request, but it is not\ncontiguous\n● Internal Fragmentation – allocated memory\nmay be slightly larger than requested memory;\nthis size difference is memory internal to a\npartition, but not being used", "16": "Paging\n● Process physical address space can be noncontiguous; process is\nallocated physical memory when it is available:\n○ Avoids external fragmentation\n○ Avoids problem of varying sized memory chunks\n● Divide physical memory into fixed-sized blocks called frames\n● Divide logical memory into blocks of same size called pages\n● Keep track of all free frames\n● To run a program of size N pages, need to find N free frames and\nload program\n● Set up a page table to translate logical to physical addresses\n● Backing store likewise split into pages\n● Still have Internal fragmentation", "18": "Paging Hardware\np: page number\nd: offset\nf: frame number", "19": "Paging Model of Logical and\nPhysical Memory", "21": "Paging (Cont.)\n● Calculating internal fragmentation\n●\nFor example:\n●\nPage size = 2,048 bytes (2kb)\n●\nProcess size = 72,766 bytes\n●\n35 pages + 1,086 bytes\n●\nInternal fragmentation of 2,048 - 1,086 = 962 bytes\n●\nWorst case fragmentation = 1 frame – 1 byte =2,047 bytes\n●\nOn average fragmentation = 1 / 2 frame size\n●\nSo small frame sizes desirable?\n●\nBut each page table entry takes memory to track\n●\nPage sizes growing over time\n● Process view and physical memory are very different\n● Process can only access its own memory", "22": "Free Frames\nBefore allocation After allocation 22", "23": "Implementation of Page Table\n● Page table is kept in main memory\n● Page-table base register (PTBR) points to the\npage table\n● Page-table length register (PTLR) indicates\nsize of the page table\n● Every data/instruction access requires two\nmemory accesses\n●\nOne for the page table and one for the data /\ninstruction\n● The two memory access problem can be solved by\nthe use of a special fast-lookup hardware cache\ncalled associative memory or translation look-\naside buffers (TLBs)", "24": "Paging Hardware With TLB", "25": "Effective Access Time (EAT)\n● Associative Lookup = ε time unit\n●\nCan be < 10% of memory access time\n● Hit ratio = α\n●\nHit ratio – percentage of times that a page\nnumber is found in the associative registers; ratio\nrelated to number of associative registers\n● Consider α = 80%, ε = 20ns (nanoseconds) for\nTLB search, 100ns for memory access\n●\nEAT = 0.80 x 100 + 0.20 x 200 = 120ns\n● Consider more realistic hit ratio: α = 99%, ε =\n20ns for TLB search, 100ns for memory access\n●\nEAT = 0.99 x 100 + 0.01 x 200 = 101ns", "26": "Memory Protection\n● Memory protection: associating protection bit with each\nframe to indicate read-only or read-write\n●\nCan add more bits to indicate page execute-only, and so\non\n● Valid-invalid bit attached to each entry in the page table:\n●\n“valid” indicates the associated page is in the process’\nlogical address space, and is a legal page\n●\n“invalid” indicates that the page is not in the process’\nlogical address space\n●\nOr use page-table length register (PTLR)\n● Any violations result in a trap to the kernel", "27": "Valid (v) or Invalid (i) Bit In A Page\nTable", "28": "Shared Pages\n● Shared code\n●\nOne copy of read-only (reentrant) code shared\namong processes (i.e., text editors, compilers,\nwindow systems)\n●\nSimilar to multiple threads sharing the same\nprocess space\n●\nAlso useful for interprocess communication if\nsharing of read-write pages is allowed", "29": "Shared Pages Example", "30": "Structure of the Page Table\n● Memory structures for paging can get huge using straight-\nforward methods\n●\nConsider a 32-bit logical address space as on modern\ncomputers\n●\nPage size of 4 KB (212)\n●\nPage table would have 1 million entries (232 / 212=220)\n● Hierarchical Paging\n● Hashed Page Tables\n● Inverted Page Tables", "31": "Hierarchical Page Tables\n● Break up the logical address space into\nmultiple page tables\n● A simple technique is a two-level page\ntable\n● Page the page table", "32": "Two-Level Page-Table Scheme", "33": "Two-Level Paging Example\n● A logical address (on 32-bit machine with 1K page size) is divided\ninto:\n●\na page number consisting of 22 bits\n●\na page offset consisting of 10 bits\n● Since the page table is paged, the page number is further divided\ninto:\n●\na 12-bit page number\n●\na 10-bit page offset\n● Thus, a logical address is as follows:\n● where p is an index into the outer page table, and p2 is the\ndisplacement within the page of the inner page table\n● Known as forward-mapped page table", "34": "Address-Translation Scheme", "35": "64-bit Logical Address Space\n● Even two-level paging scheme not sufficient\n● If page size is 4 KB (212)\n●\nThen page table has 252 entries\n●\nIf two level scheme, inner page tables could be 210 4-byte entries\n●\nAddress would look like\n●\nOuter page table has 242 entries or 244 bytes\n●\nOne solution is to add a 2nd outer page table\n●\nBut the 2nd outer page table is still 234 bytes in size\n●\nAnd possibly 4 memory access to get to one physical memory\nlocation", "36": "Three-level Paging Scheme", "37": "Hashed Page Tables\n● Common in address spaces > 32 bits\n● The virtual page number is hashed into a page table\n●\nThis page table contains a chain of elements hashing to\nthe same location\n● Each element contains (1) the virtual page number (2) the\nvalue of the mapped page frame (3) a pointer to the next\nelement\n● Virtual page numbers are compared in this chain searching\nfor a match\n●\nIf a match is found, the corresponding physical frame is\nextracted\n● Variation for 64-bit addresses is clustered page tables\n●\nSimilar to hashed but each entry refers to several pages\n(such as 16) rather than 1\n●\nEspecially useful for sparse address spaces (where\nmemory references are non-contiguous and scattered)", "38": "Hashed Page Table", "39": "Inverted Page Table\n● Rather than each process having a page table and keeping\ntrack of all possible logical pages, track all physical pages\n● One entry for each real page of memory\n● Entry consists of the virtual address of the page stored in\nthat real memory location, with information about the\nprocess that owns that page\n● Decreases memory needed to store each page table, but\nincreases time needed to search the table when a page\nreference occurs\n● Use hash table to limit the search to one — or at most a few\n— page table entries\n●\nTLB can accelerate access\n● But how to implement shared memory?\n●\nOne mapping of a virtual address to the shared physical\naddress", "40": "Inverted Page Table Architecture", "41": "Segmentation\n● Memory-management scheme that supports user view of\nmemory\n● A program is a collection of segments\n●\nA segment is a logical unit such as:\n●\nmain program\n●\nprocedure\n●\nfunction\n●\nmethod\n●\nobject\n●\nlocal variables, global variables\n●\ncommon block\n●\nstack\n●\nsymbol table\n●\narrays", "42": "User’s View of a Program", "43": "Logical View of Segmentation\n3 2\nuser physical memory\nspace space", "44": "Segmentation Architecture\n● Logical address consists of a two tuple:\n<segment-number, offset>\n● Segment table – maps two-dimensional physical\naddresses; each table entry has:\n●\nbase – contains the starting physical address where the\nsegments reside in memory\n●\nlimit – specifies the length of the segment\n● Segment-table base register (STBR) points to the\nsegment table’s location in memory\n● Segment-table length register (STLR) indicates number\nof segments used by a program;\nsegment number s is legal if s < STLR", "45": "Segmentation Architecture (Cont.)\n● Protection\n●\nWith each entry in segment table associate:\n●\nvalidation bit = 0 ⇒ illegal segment\n●\nread/write/execute privileges\n● Protection bits associated with segments; code\nsharing occurs at segment level\n● Since segments vary in length, memory allocation\nis a dynamic storage-allocation problem", "46": "Segmentation Hardware", "48": "Paging vs. Segmentation\n● Common Features\n○ Protection of segments/pages: Read-only, non-executable, kernel\n○ Sharing among different process\n● Can be combined (example: Intel Pentium)\n○ Process ⇒ Segmentation unit ⇒ Paging unit ⇒ Main memory\n● Differences\nPaging Segmentation\nAddressing Page number derived from Explicit lookup in segment\nlogical address, fixed size table, requires limit entry,\nflexible size\nFragmentation internal fragmentation easy, external fragmentation need\nreplacement can replace any frame to find a suitable hole", "49": "Reference\n● Chapter 8, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F8": {"1": "F8. Virtual Memory\nSimon Butler\nsimon.butler@his.se\nUniversity of Skövde\n2020-10-06", "2": "Content\n● Background\n● Demand Paging\n● Copy-on-Write\n● Page Replacement\n● Allocation of Frames\n● Thrashing", "3": "Objectives\n● To describe the benefits of a virtual\nmemory system\n● To explain demand paging, page-\nreplacement algorithms, and allocation\nof page frames", "4": "Background (1)\nCode needs to be in memory to execute, but some\ncode in entire program rarely executed\n\nError code, unusual routines, large data\nstructures\nEntire program code not needed at same time\nConsider ability to execute partially-loaded\nprogram\n\nProgram no longer constrained by limits of\nphysical memory\n\nProgram (more programs) could be larger than\nphysical memory", "5": "Background (2)\n Virtual memory (memory management technique) –\nseparation of user logical memory from physical memory\n\nOnly part of the program needs to be in memory for\nexecution\n\nLogical address space can be much larger than physical\naddress space\n\nAllows address spaces to be shared by several processes\n\nAllows for more efficient process creation\n\nMore programs running concurrently\n\nLess I/O needed to load or swap processes\n Virtual memory can be implemented via:\n\nDemand paging\n\nDemand segmentation", "6": "Virtual Memory is larger than\nPhysical Memory", "7": "Virtual-address Space\n Usually design logical address space for\nstack to start at Max logical address and\ngrow “down”, while heap grows “up”\n\nMaximizes address space use\n\nUnused address space between the two is\nhole\n Enables sparse address spaces with holes\nleft for growth, dynamically linked libraries,\netc\n System libraries shared via mapping into\nvirtual address space\n Shared memory by mapping pages read-\nwrite into virtual address space\n Pages can be shared during fork(),\nspeeding process creation", "8": "Shared Library Using Virtual Memory", "9": "Demand Paging\n Could bring entire process into memory\nat load time\n Or bring a page into memory only when\nit is needed\n\nLess I/O needed, no unnecessary I/O\n\nLess memory needed\n\nFaster response\n\nMore users\n Similar to paging system with swapping\n(diagram on right)\n Page is needed ⇒ reference to it\n\ninvalid reference ⇒ abort\n\nnot-in-memory ⇒ bring to memory\n Lazy swapper – never swaps a page\ninto memory unless page will be\nneeded\n\nSwapper that deals with pages is a\npager", "10": "Basic Concepts\n With swapping, pager guesses which pages will be\nused before swapping out again, and pager brings in\nonly those pages into memory\n How to determine that set of pages?\n\nNeed new MMU (Memory Management Unit)\nfunctionality to implement demand paging\n If pages needed are already memory resident\n\nNo difference from non demand-paging\n If page needed and not memory resident\n\nNeed to detect and load the page into memory from\nstorage\n\nWithout changing program behaviour\n\nWithout programmer needing to change code", "11": "Page table: when needed pages are\nnot in main memory", "12": "Page Fault\n● Access to a page marked invalid cause a page\nfault\n1. Operating system looks at another table to decide:\na. Invalid reference ⇒ abort\nb. Just not in memory\n2. Find free frame\n3. Swap page into frame via scheduled disk\noperation\n4. Reset tables to indicate page now in memory\nSet validation bit = v\n5. Restart the instruction that caused the page fault", "13": "Valid-Invalid bit\n● With each page table entry a valid–invalid bit is associated\n(v ⇒ in-memory – memory resident, i ⇒ not-in-memory)\n● Initially valid–invalid bit is set to i on all entries\n● Example of a page table snapshot:\n● During MMU address translation, if valid–invalid bit in page\ntable entry is i ⇒ page fault", "14": "Steps in handling a Page Fault", "15": "Aspects of Demand Paging\n Extreme case – start process with no pages in memory\n\nOS sets instruction pointer to first instruction of process,\nnon-memory-resident ⇒ page fault\n\nAnd for every other process pages on first access\n\nPure demand paging\n A given instruction could access multiple pages ⇒ multiple\npage faults\n\nConsider fetch and decode of instruction which adds 2\nnumbers from memory and stores result back to memory\n\nPerformance is not decreased so much because of locality\nof reference\n Hardware support needed for demand paging\n\nPage table with valid / invalid bit\n\nSecondary memory (swap device with swap space)\n\nInstruction restart", "16": "Performance of Demand Paging\n● Stages in Demand Paging (worse case)\n1. Trap to the operating system\n2. Save the user registers and process state\n3. Determine that the interrupt was a page fault\n4. Check that the page reference was legal and determine the location\nof the page on the disk\n5. Issue a read from the disk to a free frame:\na. Wait in a queue for this device until the read request is serviced\nb. Wait for the device seek and/or latency time\nc. Begin the transfer of the page to a free frame\n6. While waiting, allocate the CPU to some other user\n7. Receive an interrupt from the disk I/O subsystem (I/O completed)\n8. Save the registers and process state for the other user\n9. Determine that the interrupt was from the disk\n10. Correct the page table and other tables to show page is now in\nmemory\n11. Wait for the CPU to be allocated to this process again\n12. Restore the user registers, process state, and new page table, and\nthen resume the interrupted instruction", "17": "Performance of Demand Paging\n(Cont.)\n Page Fault Rate 0 ≤ p ≤ 1\n\nif p = 0 no page faults\n\nif p = 1, every reference is a fault\n Effective Access Time (EAT)\nEAT = (1 – p) x memory access\n+ p (page fault overhead\n+ swap page out\n+ swap page in)", "18": "Demand Paging Example\nEAT = (1 – p) x memory access\n+ p (page fault overhead + swap page out + swap page in)\n Memory access time = 200 nanoseconds\n Average page-fault service time = 8 milliseconds\n EAT = (1 – p) x 200 + p (8 milliseconds)\n= (1 – p) x 200 + p x 8,000,000\n= 200 + p x 8,000,000\n If one access out of 1,000 causes a page fault (p=0.001), then\nEAT = 8,200 nanoseconds\n If want performance degradation < 10 percent\n\n[200x(1+0.1)=220] > 200 + 8,000,000 x p\n20 > 8,000,000 x p\n\np < .0000025\n\n< one page fault in every 400,000 memory accesses", "19": "Copy-on-Write\n Copy-on-Write (COW) allows both parent and child processes to\ninitially share the same pages in memory\n\nIf either process modifies a shared page, only then is the page\ncopied\n COW allows more efficient process creation as only modified pages\nare copied\n● Before Process 1 Modifies Page C\n● After Process 1 Modifies Page C", "20": "What happens if there is no free\nframe?\n Memory is over-allocated\n●\nTerminate process?\n●\nSwap process out?\n●\nPage replacement – find some page in memory, but\nnot really in use, page it out\n Performance: algorithm should result in minimum\nnumber of page faults\n Trade-off: Same page may be brought into memory\nseveral times", "21": "Basic Page Replacement\n Find the location of the desired page on disk\n Find a free frame:\n\nIf there is a free frame, use it\n\nIf there is no free frame, use a page replacement\nalgorithm to select a victim frame\n\nWrite victim frame to disk if dirty\n Bring the desired page into the (newly) free frame;\nupdate the page and frame tables\n Continue the process by restarting the instruction that\ncaused the trap\nPotentially 2 page transfers for page fault – increasing\nEAT.", "22": "Page Replacement", "23": "Page and Frame Replacement\nAlgorithms\n Frame-allocation algorithm determines\n\nHow many frames to give each process\n\nWhich frames to replace\n Page-replacement algorithm\n\nWant lowest page-fault rate on both first access and re-\naccess\n Evaluate algorithm by running it on a particular string of\nmemory references (reference string) and computing the\nnumber of page faults on that string\n\nString is just page numbers, not full addresses\n\nRepeated access to the same page does not cause a page\nfault\n\nResults depend on number of frames available", "25": "Graph of page faults versus the\nnumber of frames", "26": "Belady’s Anomaly\nReference string: 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\nNumber of frames allocated = 3\nNumber of page faults = 9\nNumber of frame = 4\nNumber of page faults = 10", "29": "Least Recently Used (LRU)\nAlgorithm\n Use past knowledge rather than future\n Replace page that has not been used recently in the most amount\nof time\n Associate time of last use with each page\ntime\npage fault: 12\n 12 faults – better than FIFO but worse than OPT\n Generally good algorithm and frequently used\n So, how might LRU be implemented?", "30": "LRU Algorithm (Cont.)\n Counter implementation\n\nEvery page entry has a counter; every time page is referenced\nthrough this entry, copy the clock into the counter\n\nWhen a page needs to be changed, look at the counters to find\nsmallest value\n\nSearch through table needed\n Stack implementation\n\nKeep a stack of page numbers in a double link form:\n\nPage referenced:\n\nmove it to the top\n\nrequires 6 pointers to be changed\n\nBut each update more expensive\n\nNo search for replacement\n LRU and OPT are cases of stack algorithms that don’t have\nBelady’s Anomaly", "32": "LRU Approximation Algorithms\n LRU needs special hardware and still slow\n LRU Approximation Algorithms\n\nAdditional reference bit algorithm\n\nWith each page associate a bit, initially = 0\n\nWhen page is referenced bit set to 1\n\nReplace any with reference bit = 0 (if one exists)\n\nProblem: The OS does not know the order, however\n\nSecond-chance algorithm\n\nGenerally FIFO, plus hardware-provided reference bit\n\nClock replacement\n\nIf page to be replaced has\n\nReference bit = 0 ⇒ replace it\n\nReference bit = 1 then:\n\nset reference bit 0, leave page in memory\n\nreplace next page, subject to same rules", "34": "Enhanced Second-Chance Algorithm\n● Improve algorithm by using reference bit and modify bit (if\navailable) in concert\n● Take ordered pair (reference, modify)\n1. (0, 0) neither recently used nor modified – best page to\nreplace\n2. (0, 1) not recently used but modified – not quite as good,\nmust write out before replacement\n3. (1, 0) recently used but clean – probably will be used again\nsoon\n4. (1, 1) recently used and modified – probably will be used\nagain soon and need to write out before replacement\n Each page is in one of the four classes. When page replacement\ncalled for, use the clock scheme but use the four classes replace\npage in lowest non-empty class\n\nMight need to search circular queue several times", "35": "Counting Algorithms\n Keep a counter of the number of references that have\nbeen made to each page\n\nNot common\n Least Frequently Used (LFU) Algorithm: replaces\npage with smallest count\n Most Frequently Used (MFU) Algorithm: based on\nthe argument that the page with the smallest count\nwas probably just brought in and has yet to be used", "36": "Page-Buffering Algorithms\n Keep a pool of free frames always. When a page fault occurs, a\nvictim frame is chosen. The desired page is read into a free frame\nfrom the pool before the victim is written out. This procedure allows\nthe process to restart as soon as possible, without waiting for the\nvictim page to be written out. When the victim is later written out,\nits frame is added to the free-frame pool.\n Possibly, keep list of modified pages\n\nWhen backing store is idle, write pages there and set to non-dirty\n Possibly, keep free frame contents intact and note what is in them\n\nIf referenced again before reused, no need to load contents again\nfrom disk\n\nGenerally useful to reduce penalty if wrong victim frame selected", "37": "Allocation of Frames\n● Each process needs minimum number of frames. It is\ndefined by the architecture.\n● Maximum is total frames in the system\n● Strategies are needed for the allocation of frames", "39": "Global vs. Local Allocation\n Global replacement – process selects a replacement\nframe from the set of all frames; one process can take\na frame from another\n\nBut process execution time can vary greatly\n\nBut greater throughput so more common\n Local replacement – each process selects from only\nits own set of allocated frames\n\nMore consistent per-process performance\n\nBut possibly underutilized memory", "40": "Thrashing\n If a process does not have “enough” frames, the page-\nfault rate is very high\n\nPage fault to get page\n\nReplace existing frame\n\nQuickly need replaced frame back\n\nThis consequences are:\n\nLow CPU utilization by processes\n\nOperating system trying to increase the degree of\nmultiprogramming\n\nAnother process added to the system\n Thrashing: a process is busy swapping pages in and\nout", "41": "Thrashing (Cont.)", "42": "Reference\n● Chapter 9, Abraham Silberschatz, Peter B. Galvin, Greg\nGagne, Operating System Concepts, 8th international\nstudent edition, Wiley, 2010, ISBN 978-0470233993"}, "F9": {"1": "F9. File Systems\nSimon Butler\nsimon.butler@his.se\nUniversity of Skövde\n2020-10-13", "2": "Content\n● File Concept\n● Disk and Directory Structure\n● File-System Structure\n● Directory Implementation\n● Disk Scheduling\n● Disk Management\n● RAID Structure", "3": "Objectives\n● To explain the function of file systems\n● To describe the interfaces to file systems\n● To discuss file-system design trade-offs, including\naccess methods, file sharing, and directory\nstructures\n● To describe file-system protection", "4": "File Concept\n“A file is a named collection of related information that\nis recorded on secondary storage.” (Silberschatz et al, Ch 10)\n Contiguous logical address space\n Types:\n\nData\n\nnumeric\n\ncharacter\n\nbinary\n\nProgram\n Contents defined by file’s creator\n\nMany types\n\nConsider text file, source file, executable file", "5": "File Attributes\n● Name – only information kept in human-readable form\n● Identifier – unique tag (number) identifies file within file system\n● Type – needed for systems that support different types\n● Location – pointer to file location on device\n● Size – current file size\n● Protection – controls who can do reading, writing, executing\n● Time, date, and user identification – data for protection,\nsecurity, and usage monitoring\n● Many variations, including extended file attributes such as file\nchecksum\n● Information kept in the directory structure", "6": "File Operations\n● Create: make a new file ● Append: like write, but\n● Delete: remove an only at the end of the\nexisting file file\n● Open: prepare a file to ● Seek: move the\nbe accessed “current” pointer\n● Close: indicate that a elsewhere in the file\nfile is no longer being ● Get attributes: retrieve\naccessed attribute information\n● Read: get data from a ● Set attributes: modify\nfile attribute information\n● Write: put data to a file ● Rename: change a\nfile’s name", "7": "Open Files\nSeveral pieces of data are needed to manage\nopen files:\n\nFile pointer: pointer to last read/write location,\nper process that has the file open\n\nFile-open count: counter of number of times a\nfile is open – to allow removal of data from open-\nfile table when last processes closes it\n\nDisk location of the file: cache of data access\ninformation\n\nAccess rights: per-process access mode\ninformation", "8": "File Types – Name, Extension", "9": "Executable\nfile\nArchive", "10": "Directories\n Naming is nice, but limited\n Humans like to group things together for convenience\n File systems allow this to be done with directories\n(sometimes called folders)\n Grouping makes it easier to\n\nFind files in the first place: remember the enclosing\ndirectories for the file\n\nLocate related files (or just determine which files are\nrelated)", "11": "Single-Level Directory\n● A single directory for all users\n Many files and users\n\nNaming problem\n\nGrouping problem", "12": "Two-Level Directory\n● Separate directory for each user\n● Path name\n● Can have the same file name for different user\n● Efficient searching\n● No grouping capability", "13": "Tree-Structured Directories\n● Efficient searching\n● Grouping Capability", "14": "Tree-Structured Directories (Cont)\n Absolute or relative path name\n Creating a new file in current directory\n Delete a file\nrm <file-name>\n Creating a new subdirectory is done in current directory\nmkdir <dir-name>\nExample: if in current directory /mail\nmkdir count\nDeleting “mail” ⇒ deleting the entire subtree rooted by “mail”", "15": "Unix directory tree", "16": "Operations on directories\n● Create: make a new  Readdir: read a directory\ndirectory entry\n● Delete: remove a  Rename: change the\ndirectory (usually must name of a directory\nbe empty) \nSimilar to renaming a file\n● Opendir: open a  Link: create a new entry\ndirectory to allow in a directory to link to\nsearching it an existing file\n● Closedir: close a  Unlink: remove an entry\ndirectory (done in a directory\nsearching) \nRemove the file if this is\nthe last link to this file", "17": "File system implementation issues\n How are disks divided into file systems?\n How does the file system allocate blocks to files?\n How does the file system manage free space?\n How are directories handled?\n How can the file system improve:\n\nPerformance?\n\nReliability?", "18": "Disk Structure\nEntire disk\nPartition table\nMaster\nPartition 1 Partition 2 Partition 3 Partition 4\nboot record\nBoot Super Free space Index\nFiles & directories\nblock block management nodes", "19": "Contiguous allocation for file blocks\nA B C D E F\nA Free C Free E F\nContiguous allocation requires all blocks of a file\nto be consecutive on disk\nProblem: deleting files leaves “holes”\n\nSimilar to memory allocation issues\n\nCompacting the disk can be a very slow procedure", "20": "Contiguous allocation\n Data in each file is stored in 0 1 2 3\nconsecutive blocks on disk\n Simple & efficient indexing\n\nStarting location (block #) on disk\n(start)\n\nLength of the file in blocks (length) 4 5 6 7\n Random access well-supported\n Logical to physical mapping is easy\nblocknum = (pos / 1024) + start;\noffset_in_block = pos % 1024;\n Difficult to grow files\n8 9 10 11\n\nMust pre-allocate all needed space\n\nWasteful of storage if file isn’t using\nall of the space\nStart=5 2902=1024+1024+854\nLength=2902", "21": "Linked allocation\n0 1 2 3\n File is a linked list of disk\n4 6\nblocks\n\nBlocks may be scattered around\nthe disk drive\n\nBlock contains both pointer to 4 5 6 7\nnext block and data x x\n\nFiles may be as long as needed\n New blocks are allocated as\nneeded 8 9 10 11\n\nLinked into list of blocks in file 0\n\nRemoved from list (bitmap) of\nfree blocks\nStart=9 Start=3\nEnd=4 End=6\nLength=2902 Length=1500", "22": "Finding blocks with linked allocation\n Directory structure is simple\n\nStarting address looked up from directory\n\nDirectory only keeps track of first block (not others)\n No wasted space - all blocks can be used\n Random access is difficult: must always start at first\nblock!\n Logical to physical mapping is done by\nblock = start;\noffset_in_block = pos % 1024;\nfor (j = 0; j < pos / 1024; j++) {\nblock = block->next;\n}\n\nAssumes that next pointer is stored at end of block\n\nMay require a long time for seek to random location in file", "23": "Index allocation\nStore file block\nName index size\naddresses in an array grades 4 4802\n\nArray itself is stored in a\ndisk block\n\nDirectory has a pointer to 0 1 2 3\nthis disk block\n\nNon-existent blocks\nindicated by -1 6\nRandom access easy 4 5 6 7\nLimit on file size? 7\n8 8 9 10 11", "24": "Larger files with indexed allocation\n● How can indexed allocation allow files larger than a single\nindex block?\n● Linked index blocks: similar to linked file blocks, but using\nindex blocks instead\n● Logical to physical mapping is done by\nindex = start;\nblocknum = pos / 1024;\nfor (j = 0; j < blocknum /255; j++) {\nindex = index->next;\n}\nblock = index[blocknum % 255];\noffset_in_block = pos % 1024;\n● File size is now unlimited\n● Random access slow, but only for very large files", "26": "File Sharing\n Sharing of files on multi-user systems is desirable\n Sharing may be done through a protection scheme\n On distributed systems, files may be shared across a\nnetwork\n Network File System (NFS) is a common distributed file-\nsharing method\n If multi-user system\n\nUser IDs identify users, allowing permissions and\nprotections to be per-user\nGroup IDs allow users to be in groups, permitting\ngroup access rights\n\nOwner of a file / directory\n\nGroup of a file / directory", "27": "Access Lists and Groups\n● Mode of access: read, write, execute\n● Three classes of users on Unix / Linux\nRWX\na) owner access 7 ⇒ 111\nRWX\nb) group access 6 ⇒ 110\nRWX\nc) public access 1 ⇒ 001\n● Ask manager to create a group (unique name), say G, and add\nsome users to the group.\n● For a particular file (say game) or subdirectory, define an\nappropriate access.\nAttach a group to a file\nchgrp G game", "28": "File-System Structure\n File structure\n\nLogical storage unit\n\nCollection of related information\n File system resides on secondary storage (disks)\n\nProvides user interface to storage, mapping logical to\nphysical\n\nProvides efficient and convenient access to disk by\nallowing data to be stored, located retrieved easily\n Disk provides in-place rewrite and random access\n\nI/O transfers performed in blocks of sectors (usually 512\nbytes)\n File control block – storage structure consisting of\ninformation about a file\n Device driver controls the physical device\n File system organized into layers", "29": "File-System Implementation\n We have system calls at the API level, but how do we implement\ntheir functions?\n\nOn-disk and in-memory structures\n Boot control block contains info needed by system to boot OS\nfrom that volume\n\nNeeded if volume contains OS, usually first block of volume\n Volume control block (superblock, master file table) contains\nvolume details\n\nTotal # of blocks, # of free blocks, block size, free block pointers\nor array\n Directory structure organizes the files\n\nNames and inode numbers, master file table", "30": "File-System Implementation (Cont.)\n Per-file File Control Block (FCB) contains many details about the\nfile\n\ninode number, permissions, size, dates\nA typical FCB", "31": "In-Memory File System Structures\n(a) file open (b) file read 31", "32": "Disk Block Allocation Methods -\nContiguous\n An allocation method refers to how disk blocks are\nallocated for files:\n Contiguous allocation – each file occupies set of\ncontiguous blocks\n\nBest performance in most cases\n\nSimple – only starting location (block #) and length\n(number of blocks) are required\n\nProblems include finding space for file, knowing file\nsize, external fragmentation.", "33": "Free-Space Management\n File system maintains free-space list to track available blocks/clusters\n(Using term “block” for simplicity)\n Bit vector or bit map (n blocks)\n0 1 2 n-1\n…\n｛ 0 ⇒ block[i] occupied\n1 ⇒ block[i] free\nbit[i] =\nBlock number calculation\n(number of bits per word) *\n(number of 0-value words) +\noffset of first 1 bit\nCPUs have instructions to return offset within word of first “1” bit", "34": "Linked Allocation\n Linked list (free list)\n\nCannot get contiguous space\neasily\n\nNot waste of space\n\nNo need to traverse the\nentire list (if # free blocks\nrecorded)", "37": "Disk Scheduling\n● The operating system is responsible for using hardware\nefficiently — for the disk drives, this means having a fast\naccess time and disk bandwidth\n● Minimize seek time\n● Seek time ≈ seek distance\n● Disk bandwidth is the total number of bytes transferred,\ndivided by the total time between the first request for\nservice and the completion of the last transfer", "38": "Disk Scheduling (Cont.)\nThere are many sources of disk I/O request\n\nOS\n\nSystem processes\n\nUsers processes\nI/O request includes input or output mode, disk\naddress, memory address, number of sectors to\ntransfer\nOS maintains queue of requests, per disk or device\nIdle disk can immediately work on I/O request,\nbusy disk means work must queue\n\nOptimization algorithms only make sense when a\nqueue exists", "39": "Disk Scheduling (Cont.)\n● Note that drive controllers have small buffers and can\nmanage a queue of I/O requests (of varying “depth”)\n● Several algorithms exist to schedule the servicing of\ndisk I/O requests\n● The analysis is true for one or many platters\n● We illustrate scheduling algorithms with a request\nqueue (blocks on cylinders)\n98, 183, 37, 122, 14, 124, 65, 67\nHead pointer 53", "40": "FCFS (First come, first served)\ndisk position\ntime\nIllustration shows total head movement of 640 cylinders:\n(98-53)+(183-98)+(183-37)+(122-37)+(122-14)+(124-14)\n+(124-65)+(67-65)=640", "41": "SSTF (Shortest seek time first)\n● Shortest Seek Time First selects the request with the minimum seek time\nfrom the current head position\n● SSTF scheduling is a form of SJF (Shortest-Job-First) scheduling; may\ncause starvation of some requests\ndisk position\ntime\n Illustration shows total head movement of 236 cylinders: (65-53)+(67-\n65)+(65-37)+(37-14)+(98-14)+(122-98)\n+(124-122)+(183-124)=236", "43": "SCAN (Cont.)\ndisk position\ntime\n(53-37)+(37-14)+(14-0)+(65-0)+(67-65)+(98-67)+(122-98)\n+(124-122)+(183-124)=236", "44": "C-SCAN\n Provides a more uniform wait time than SCAN\n The head moves from one end of the disk to the other,\nservicing requests as it goes\n\nWhen it reaches the other end, however, it\nimmediately returns to the beginning of the disk,\nwithout servicing any requests on the return trip\n Treats the cylinders as a circular list that wraps around\nfrom the last cylinder to the first one\n Total number of cylinders?", "45": "C-SCAN (Cont.)\ndisk position\ntime\nTotal number of cylinders?", "46": "C-LOOK\n● LOOK a version of SCAN, C-LOOK a version of C-SCAN\n● Arm only goes as far as the last request in each direction, then reverses\ndirection immediately, without first going all the way to the end of the disk\n● Total number of cylinders?\ndisk position\ntime", "47": "Selecting a Disk-Scheduling\nAlgorithm\n SSTF is common and has a natural appeal\n SCAN and C-SCAN perform better for systems that place a heavy\nload on the disk\n\nLess starvation\n Performance depends on the number and types of requests\n Requests for disk service can be influenced by the file-allocation\nmethod\n\nAnd metadata layout\n The disk-scheduling algorithm should be written as a separate\nmodule of the operating system, allowing it to be replaced with a\ndifferent algorithm if necessary\n Either SSTF or LOOK is a reasonable choice for the default algorithm", "48": "Disk Management\n Low-level formatting, or physical formatting — Dividing a disk\ninto sectors that the disk controller can read and write\n\nEach sector can hold header information, plus data, plus error\ncorrection code (ECC)\n\nUsually 512 bytes of data but can be selectable\n To use a disk to hold files, the operating system still needs to record\nits own data structures on the disk\n\nPartition the disk into one or more groups of cylinders, each\ntreated as a logical disk\n\nLogical formatting or “making a file system”\n\nTo increase efficiency most file systems group blocks into\nclusters\n\nDisk I/O done in blocks\n\nFile I/O done in clusters", "49": "Disk Management (Cont.)\n Raw disk access for apps that want to do their own\nblock management, keep OS out of the way (databases\nfor example)\n Boot block initializes system\n\nThe bootstrap is stored in ROM\n\nBootstrap loader program stored in boot blocks of\nboot partition\n\nMaster Boot Record (MBR) – old system\n\nUEFI – more recent, and more complex\n Methods such as sector sparing used to handle bad\nblocks", "51": "RAID Structure (Cont.)\n RAID – Redundant Array of Inexpensive Disks\n\nmultiple disk drives provides reliability via redundancy\n Increases the mean time to failure\n Mean time to repair – exposure time when another failure could\ncause data loss\n Mean time to data loss based on above factors\n If mirrored disks fail independently, consider disk with 100,000\nhours mean time to failure and 10 hour mean time to repair\n\nMean time to data loss of a mirrored disk system is 100, 000 2 / (2\n∗ 10) = 500 ∗ 106 hours, or 57,000 years!\n Frequently combined with NVRAM (nonvolatile RAM) to improve\nwrite performance\n Several improvements in disk-use techniques involve the use of\nmultiple disks working cooperatively", "52": "RAID (Cont.)\n Disk striping uses a group of disks as one storage unit\n RAID is arranged into seven different levels\n RAID schemes improve performance and improve the reliability of\nthe storage system by storing redundant data\n\nMirroring or shadowing (RAID 1) keeps duplicate of each disk\n\nStriped mirrors (RAID 1+0) or mirrored stripes (RAID 0+1)\nprovides high performance and high reliability\n\nBlock interleaved parity (RAID 4, 5, 6) uses much less\nredundancy\n RAID within a storage array can still fail if the array fails, so\nautomatic replication of the data between arrays is common\n Frequently, a small number of hot-spare disks are left unallocated,\nautomatically replacing a failed disk and having data rebuilt onto\nthem", "54": "Reference\n● Chapter 10, 11, 12, Abraham Silberschatz, Peter B.\nGalvin, Greg Gagne, Operating System Concepts, 8th\ninternational student edition, Wiley, 2010, ISBN 978-"}, "F10": {"1": "F10. Protection, Security\nSimon Butler\nsimon.butler@his.se\nUniversity of Skövde\n2020-10-19", "2": "Protection\nSimon Butler\nsimon.butler@his.se\nUniversity of Skövde", "3": "Content\n● Principles of Protection\n● Domain of Protection\n● Access Matrix\n● Implementation of Access Matrix", "4": "Objectives\n● Discuss the goals and principles of protection in a\nmodern computer system\n● Explain how protection domains combined with an\naccess matrix are used to specify the resources a\nprocess may access", "5": "Goals of Protection\n● Each object has a unique name and can be\naccessed through a well-defined set of\noperations\n● Ensure that each object is accessed correctly\nand only by those processes that are allowed\nto do so", "6": "Principles of Protection\nGuiding principle – principle of least privilege\n\nPrograms, users and systems should be given\njust enough privileges to perform their tasks\n\nLimits damage if entity has a bug, gets abused\n\nCan be static (during life of system, during life of\nprocess)\n\nOr dynamic (changed by process as needed) –\ndomain switching, privilege escalation\n\n“Need to know” a similar concept regarding\naccess to data", "7": "Domain Structure\n● Protection domain specifies the resources that\nthe process may access.\n● Domain = set of access-rights\n● A domain can be realized in a variety of ways: A\ndomain could be a user, a process, a procedure.", "8": "Access Matrix\n● View protection as a matrix (access matrix)\n● Rows represent domains\n● Columns represent objects\n● Access(i, j) is the set of operations that a process executing\nin Domaini can invoke on Objectj. e.g. process executing in\ndomain D1 can read files F1 and F3 .", "9": "Use of Access Matrix\n If a process in Domain D tries to do “op” on object O ,\ni j\nthen “op” must be in the access matrix\n User who creates object can define access column for\nthat object\n Can be expanded to dynamic protection\n\nOperations to add, delete access rights\n\nSpecial access rights:\n owner of O\ni\n copy op from O to O (denoted by “*”)\ni j\n control – D can modify D access rights\ni j\n transfer – switch from domain D to D\ni j\n\nCopy and Owner applicable to an object\n\nControl applicable to domain object", "10": "Use of Access Matrix (Cont.)\n Access matrix design separates mechanism from\npolicy\n\nMechanism\n\nOperating system provides access-matrix + rules\n\nIt ensures that the matrix is only manipulated by\nauthorized agents and that rules are strictly\nenforced\n\nPolicy\n\nUser dictates policy\n\nWho can access what object and in what mode", "11": "Access Matrix: with Domains as\nObjects\nA process executing in domain D2 can switch to domain D3 or to\ndomain D4. A process in domain D4 can switch to D1, and one in\ndomain D1 can switch to D2.", "12": "Access Matrix with Copy Rights\nThe copy right allows the\naccess right to be copied\nonly within the column (that\nis, for the object) for which\nthe right is defined.\nThree copy rights:\n● copy\n● transfer\n● limited copy", "13": "Access Matrix With Owner Rights\nOwner right can add or\nremove some rights.\nIf access (i, j) includes\nthe owner right, then a\nprocess executing in domain\nDi can add and remove any\nright in any entry in column j.", "14": "Modified Access Matrix with Control\nThe control right is applicable only to domain objects. If\naccess(i, j) includes the control right, then a process\nexecuting in domain Di can remove any access right from\nrow j.", "15": "Implementation of Access Matrix\nGenerally, an access matrix is a sparse matrix\n\nOption 1 – Global table\n●\nA set of ordered triples: <domain, object, rights-set>\n\nOption 2 – Access lists for objects\n●\nPer-object list of ordered pairs: <domain, rights-set>\n

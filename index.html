\nOption 3 – Capability list for domains\n●\nObject capability model\n\nOption 4 – Lock-key, between objects and domains\n●\nOperation allowed if domain’s key matches object’s\nlock", "16": "Comparison of Implementations\n Many trade-offs to consider\n\nGlobal table is simple, but can be large\n\nAccess lists correspond to needs of users, column based in access\nmatrix\n\nDetermining set of access rights for domain non-localized is\ndifficult\n\nEvery access to an object must be checked\n\nMany objects and access rights ⇒ slow\n\nCapability lists useful for localizing information for a given\nprocess, row based in access matrix\n\nBut revocation capabilities can be inefficient\n\nLock-key effective and flexible, keys can be passed freely from\ndomain to domain, easy revocation\n Most systems use combination of access lists and capabilities", "17": "Reference\n● Chapter 14, Abraham Silberschatz, Peter B. Galvin,\nGreg Gagne, Operating System Concepts, 8th\ninternational student edition, Wiley, 2010, ISBN 978-", "18": "Security\nSimon Butler\nsimon.butler@his.se\nUniversity of Skövde", "19": "Content\n● The Security Problem\n● Program Threats\n● Cryptography as a Security Tool", "20": "Objectives\n● To discuss security threats and attacks\n● To explain the fundamentals of encryption\n● To discuss the uses of cryptography in computing", "21": "Security Violation Categories\n● Against confidentiality\n○ Unauthorized reading of data\n● Against integrity\n○ Unauthorized modification of data\n● Against availability\n○ Unauthorized destruction of data\n● Theft of service\n○ Unauthorized use of resources\n● Denial of service (DoS)\n○ Prevention of legitimate use", "22": "Security Violation Methods\n● Masquerading (breach authentication)\n○ Pretending to be an authorized user to escalate\nprivileges\n● Replay attack\n○ A valid data transmission is maliciously or\nfraudulently repeated or delayed.\n● Man-in-the-middle attack\n○ Intruder sits in data flow, masquerading as sender to\nreceiver and vice versa\n● Session hijacking\n○ Intercept an already established session to bypass\nauthentication", "24": "Security Measure Levels\nSecurity must occur at four levels to be effective:\n● Physical\n○ Data centers, servers, connected terminals,\nmobile devices\n● Operating System\n○ Protection mechanisms, debugging\n● Network\n○ Intercepted communications, interruption, DoS\n● Human\n○ Avoid social engineering, phishing, dumpster\ndiving", "25": "Program Threats\n● Trojan Horse: any malicious computer program (code segment)\nwhich misleads users of its true intention.\n● Trap Door (Backdoor): bits of code embedded in programs by the\nprogrammer(s) to quickly gain access at a later time, often during\nthe testing or debugging phase.\n● Logic Bomb: program that initiates a security incident under certain\ncircumstances.\n● Stack and Buffer Overflow: a program writes to a memory address\non the program's call stack outside of the intended data structure.\n● Viruses: a type of malicious software program (\"malware\")\n● Worms: use spawn mechanism; standalone program\n● Port scanning: attempt to connect to a range of ports on one or a\nrange of IP addresses\n● Denial of Service (DoS): the attacker seeks to make a machine or\nnetwork resource unavailable to its intended users.", "26": "Layout of Typical Stack Frame", "27": "Hypothetical Stack Frame\nBefore attack After attack 27", "29": "Cryptography\nMeans to constrain potential senders (sources)\nand / or receivers (destinations) of messages\n\nBased on secrets (keys)\n\nConfirmation of source\n\nReceipt only by certain destination\n\nTrust relationship between sender and receiver", "31": "Symmetric Encryption\n Same key used to encrypt and decrypt\n\nE(k) can be derived from D(k), and vice versa\n DES (Data Encryption Standard) is most commonly\nused symmetric block-encryption algorithm (created by\nUS Govt)\n\nEncrypts a block of data at a time\n RC4 is most common symmetric stream cipher, but\nknown to have vulnerabilities\n\nEncrypts/decrypts a stream of bytes (i.e., wireless\ntransmission)\n\nKey is an input to pseudo-random-bit generator\n\nGenerates an infinite keystream", "32": "Asymmetric Encryption\n Public-key encryption based on each user having two\nkeys:\n\npublic key – published key used to encrypt data\n\nprivate key – key known only to individual user used\nto decrypt data\n Must be an encryption scheme that can be made public\nwithout making it easy to figure out the decryption\nscheme\n\nMost common is RSA (Rivest–Shamir–Adleman) block\ncipher\n\nEfficient algorithm for testing whether or not a\nnumber is prime\n\nNo efficient algorithm is know for finding the prime\nfactors of a number 32", "33": "Asymmetric Encryption (Cont.)\n Formally, it is computationally infeasible to derive\nD(kd , N) from E(ke , N), and so E(ke , N) need not be\nkept secret and can be widely disseminated\n E(k , N) (or just k ) is the public key\ne e\n D(kd , N) (or just kd) is the private key\n\nN is the product of two large, randomly chosen prime\nnumbers p and q (for example, p and q are 512 bits\neach)\n Encryption algorithm is E(k , N)(m) = mke mod N,\ne\nwhere ke satisfies kekd mod (p−1)(q −1) = 1\n The decryption algorithm is then D(kd , N)(c) = ckd\nmod N", "34": "Asymmetric Encryption Example\n For example. make p = 7and q = 13\n We then calculate N = 7∗13 = 91 and (p−1)(q−1) = 72\n We next select k relatively prime to 72 and < 72, yielding 5\ne\n Finally,we calculate k such that kekd mod 72 = 1, yielding 29\nd\n We how have our keys\n Public key, ke, N = 5, 91\n Private key, kd , N = 29, 91\n Encrypting the message 69 with the public key results in the\ncyphertext 62\n Cyphertext can be decoded with the private key\n\nPublic key can be distributed in cleartext to anyone who wants to\ncommunicate with holder of the private key", "36": "Cryptography (Cont.)\nNote symmetric cryptography based on\ntransformations, asymmetric based on\nmathematical functions\n\nAsymmetric much more compute\nintensive\n\nTypically not used for bulk data encryption", "37": "Digital Certificates\n Proof of who or what owns a public key\n Public key digitally signed a trusted party\n Trusted party receives proof of identification from entity\nand certifies that public key belongs to entity\n Certificate authority are trusted party – their public\nkeys included with web browser distributions\n\nThey vouch for other authorities via digitally signing\ntheir keys, and so on.", "38": "Security Solutions\n● AAA framework for access control\n○ Authentication: to identify a right user. Who is who?\n○ Authorization: to enable the access to right resource.\nWhat for whom?\n○ Accounting: to enable the right amount of resources\nfor users. How much for whom?\n● Technical solutions:\n○ Cryptography\n○ Password\n○ Firewall\n○ Intrusion detection", "39": "Firewall", "42": "Passwords (Cont.)\n Encrypt to avoid having to keep secret\n\nBut keep secret anyway (i.e. Unix uses superuser-only readable\nfile /etc/shadow)\n\nUse algorithm easy to compute but difficult to invert\n\nOnly encrypted password stored, never decrypted\n\nAdd “salt” to avoid the same password being encrypted to the\nsame value\n One-time passwords\n\nUse a function based on a seed to compute a password, both user\nand computer\n\nHardware device / calculator / key fob to generate the password\n\nChanges very frequently\n Biometrics\n\nSome physical attribute (fingerprint, hand scan)\n Multi-factor authentication\n\nNeed two or more factors for authentication\n\ni.e. USB “dongle”, biometric measure, and password", "43": "Reference\n● Chapter 15, Abraham Silberschatz, Peter B. Galvin,\nGreg Gagne, Operating System Concepts, 8th\ninternational student edition, Wiley, 2010, ISBN 978-"}};

const B = {};
B.shortLong = [
  'The <b>short-term (CPU) scheduler</b> picks which ready process gets the CPU next. It runs very often (milliseconds), so it must be fast. In many systems it is the <b>only</b> scheduler (F2 p.21, F4 p.8).',
  '<b>Example where only a short-term scheduler is enough:</b> an interactive time-sharing system such as a desktop, phone or Linux server. Every new process goes straight into the ready queue and virtual memory handles overload, so nothing needs to be admitted or held back first.',
  'The <b>long-term (job) scheduler</b> decides which jobs in the job queue are brought into memory and the ready queue. It runs rarely (seconds or minutes), so it may be slow, and it controls the degree of multiprogramming (F2 p.21, F4 p.8).',
  '<b>Example where a long-term scheduler is also preferred:</b> a batch or cluster system with many submitted jobs. The long-term scheduler admits a good mix of CPU-bound and I/O-bound jobs so that both CPU and I/O devices stay busy and memory is not overcommitted.'
];
B.shared = [
  '<b>Shared memory is better</b> when processes on the same machine exchange a lot of data quickly, e.g. a producer and consumer passing large video frames through a shared buffer. After the setup, no system calls are needed, so it is faster (F2 p.40). The programmer must add synchronization.',
  '<b>Message passing is better</b> when processes are on different computers or exchange small amounts of data, e.g. a client sending requests to a server over sockets or RPC. It needs send()/receive() system calls for every message, so it is slower, but it is simpler to set up, works across machines and needs no shared-variable synchronization (F2 p.40, F2 p.45, F2 p.50).'
];
B.threadsBenefits = [
  '<b>Benefits (two of):</b> <i>responsiveness</i> (the program keeps running or the UI stays responsive while one thread is blocked), <i>resource sharing</i> (threads share memory and resources, easier than shared memory or message passing), <i>economy</i> (thread creation and switching are cheaper than process creation and context switching), <i>scalability</i> (use several cores) (F3 p.7).',
  '<b>Drawbacks (two of):</b> <i>harder programming</i>: dividing activities, balancing work, splitting data, data dependencies (F3 p.10); <i>testing and debugging</i> is harder; <i>race conditions</i>: shared memory needs synchronization (F5 p.4-6); <i>no isolation</i>: a bug or crash in one thread can bring down the whole process; in many-to-one one blocking thread blocks all (F3 p.18).'
];
B.threadsDraw = [
  '<b>Single-threaded process:</b> one address space with code (text), data and files, plus <b>one</b> set of registers, <b>one</b> program counter and <b>one</b> stack (F3 p.8).',
  '<b>Multithreaded process:</b> the code, data and open files are <b>shared</b> by all threads; each thread has its <b>own</b> registers (incl. program counter), stack and thread id (F3 p.6, F3 p.8).',
  'Label shared parts versus per-thread parts clearly; a thread is a component of a process (F3 p.5).'
];
B.cs = [
  '<b>Entry section</b>: the code that requests permission to enter the critical section (F5 p.8).',
  '<b>Critical section</b>: the code that touches shared data; only one process may be inside at a time (F5 p.7-8).',
  '<b>Exit section</b>: code executed when leaving the critical section, releasing the permission (F5 p.8).',
  '<b>Remainder section</b>: the rest of the code that does not touch shared data. The whole structure sits in a loop <code>do { … } while (true)</code> (F5 p.8, F5 p.14).'
];
B.sem = [
  '<b>signal(mutex) … wait(mutex)</b>: the process releases the semaphore before it takes it. The critical section sits between signal and wait, so it is <b>not protected</b> and several processes can be inside at once. Mutual exclusion is violated (F5 p.36).',
  '<b>wait(mutex) … wait(mutex)</b>: the process waits on a semaphore it already holds, so it blocks forever and nobody can signal it. This is a <b>deadlock</b> for that process and for all others waiting on the mutex (F5 p.24, F5 p.36).',
  '<b>signal(mutex) … signal(mutex)</b>: the value is incremented twice, so the binary semaphore reaches 2. Then <b>two or more processes</b> can enter the critical section together. Mutual exclusion is violated (F5 p.36). Omitting wait or signal gives the same kinds of errors.'
];
B.bounded = [
  'Bounded-buffer (producer-consumer) problem: a producer puts items into a buffer with <i>n</i> slots, a consumer takes them out. The producer must wait when the buffer is full, the consumer when it is empty (F2 p.41, F5 p.26).',
  'Solution with three semaphores: <code>mutex = 1</code>, <code>full = 0</code>, <code>empty = n</code> (F5 p.26-28).',
  'The code that adds or removes an item updates shared variables (buffer, in/out pointers, count). If producer and consumer did this at the same time we get a <b>race condition</b> (F5 p.5-6), so this part is a critical section protected by <code>wait(mutex) … signal(mutex)</code>.'
];
B.rw = [
  'Readers-writers problem: a data set is shared by readers (only read) and writers (read and write). Many readers may read at the same time, but a writer must have exclusive access (F5 p.29).',
  'Starvation: in the first variation no reader waits unless a writer already has access, so a steady stream of readers can keep the writer waiting forever. In the second variation writers go first, so readers can starve. Both can starve someone (F5 p.32).'
];
B.dining = [
  'Dining-philosophers problem: philosophers alternate between thinking and eating. Each needs <b>two</b> chopsticks (shared resources) at the same time to eat. It models processes that need several resources at once (F5 p.33).',
  'The simple solution (everyone picks the left chopstick first, then the right) can <b>deadlock</b> if all pick up their left chopstick at the same time (circular wait) (F5 p.34).',
  'An <b>asymmetric solution</b> lets odd-numbered philosophers take left then right, and even-numbered take right then left. Neighbours then compete for the same chopstick first, so a circular wait cannot form and deadlock is avoided (F5 p.35).'
];
B.scheduleGoals = [
  '<b>Batch</b> jobs run with no user waiting. Goals: maximize CPU utilization and throughput, minimize turnaround time and average waiting time (F4 p.14).',
  '<b>Interactive</b> processes have a user who waits for answers. The goal is a low (average) <b>response time</b>, so the user feels that the system reacts immediately. Time-sharing aims for responses &lt; 1 s (F4 p.14, F1 p.30).',
  'Therefore the same algorithm does not suit both: batch systems can use non-preemptive algorithms such as FCFS or SJF, interactive systems need preemption and short time slices such as round robin or a multilevel feedback queue (F4 p.23, F4 p.29).',
  'Fairness (no starvation), efficiency and scalability are goals in all cases (F4 p.14).'
];
B.fragmentation = null;
B.hier = [
  '<b>Two-level scheme:</b> the page table itself is paged. The logical address is split into <b>p1 | p2 | d</b>. p1 indexes the <b>outer page table</b>, which points to an <b>inner page table</b>; p2 indexes the inner table to get the <b>frame number</b>; d is the offset inside the frame (F7 p.31-34). Only the needed inner tables have to be in memory.',
  '<b>Why more levels are slow:</b> every level is one more memory access to walk the tables before the data access. With a 64-bit address you may need four memory accesses to reach one physical location (F7 p.35); the TLB hides this only on hits (F7 p.23-25).'
];
B.hashed = [
  '<b>Structure:</b> the virtual page number is passed through a <b>hash function</b> to get an index in the hash table. Each entry is a chain of elements with (1) the virtual page number, (2) the mapped frame number and (3) a pointer to the next element (F7 p.37-38).',
  '<b>Lookup:</b> hash the page number, go to that slot, walk the chain comparing virtual page numbers. When one matches, the stored frame number is combined with the offset to give the physical address. Used for address spaces larger than 32 bits (F7 p.37).'
];
B.cowAns = [
  '<b>On fork:</b> the child does not get a copy of the parent&rsquo;s pages. Parent and child <b>share the same physical pages</b>, which are marked read-only / copy-on-write (F8 p.19).',
  '<b>On a write:</b> when either process modifies a shared page, the write traps. Only then the OS <b>copies that page</b> into a free frame, maps the copy to the writing process and lets it modify the copy. Unmodified pages stay shared (F8 p.19).',
  '<b>Benefits:</b> process creation is fast and needs little memory, since only modified pages are copied. This is very good for the common <code>fork()</code> followed by <code>exec()</code>, where the child replaces its memory anyway (F8 p.7, F8 p.19, F2 p.25).'
];
B.digitalCert = {
  i: ['A <b>digital certificate</b> is a proof of who owns a public key: the public key together with the owner&rsquo;s identity, digitally signed by a trusted party, a certificate authority (CA) (F10 p.37).'],
  ii: [
    '<b>Problem:</b> with public-key cryptography anyone can claim a public key belongs to someone else, e.g. an attacker could publish his own key as &ldquo;Bob&rsquo;s&rdquo; key and read messages meant for Bob (man-in-the-middle). The receiver needs to know that the public key really belongs to the claimed owner (F10 p.22, F10 p.37).',
    '<b>Solution:</b> the CA checks the proof of identification of the entity and then signs the entity&rsquo;s public key. The CA&rsquo;s own public keys are shipped with browsers/OS, so everyone can verify the signature and trust the key. CAs can vouch for other CAs (a chain of trust) (F10 p.37).'
  ]
};

    ['Asynchronous cancellation terminates the target thread immediately', true, 'Exactly the definition (F3 p.39).'],

  ], { flag: { t: 'low', note: 'Option 1 (&ldquo;enabled by default&rdquo;) is not stated on the slides. I checked it against the POSIX man pages for pthread_setcancelstate (default: PTHREAD_CANCEL_ENABLE, type deferred).' } });

  M('2.2', 1, 'What is true about <b>Amdahl&rsquo;s law</b>?', [
    ['The more parallel part a program has, the more it will scale with more processor cores.', true, 'With a smaller serial portion S the bound 1/S is higher (F3 p.14).'],
    ['The expected speedup is smaller or equivalent to 1 / (serial_portion + (1-serial_portion)/number_of_processing_cores).', true, 'This is Amdahl&rsquo;s formula (F3 p.14).'],
    ['Doubling the number of processors can yield up to 249% speedup according to the law.', false, 'Doubling the cores can give at most a factor of 2 (100% more), and only if there is no serial part. 249% is impossible (F3 p.14-15).'],
    ['Independent of how your program works, there will be no speedup when increasing the number of processors over 128.', false, 'The speedup keeps growing towards 1/S as N grows; it depends on S, not on a fixed number like 128 (F3 p.14).'],
    ['Amdahl&rsquo;s law gives an upper bound on how much speedup we can expect of program using multiple processors when more processors are added to the system.', true, 'Yes: the speedup is limited by the sequential fraction (F3 p.15).']
  ]);

  M('2.3', 1, 'What is true about the <b>Windows thread</b> implementation?', [
    ['Addresses security attributes and stack size.', true, 'CreateThread() takes security attributes, stack size, start routine, parameter, creation flags and a thread-id pointer (F3 p.27, F3 p.44).'],
    ['Uses less parameters for thread creation than Java', false, 'CreateThread() has six parameters; creating a Java thread needs a Runnable and start() (F3 p.27-29).'],
    ['Uses less parameters for thread creation than C++11 and onward', false, 'C++11 std::thread takes just the function and its arguments (F3 p.24, F3 p.27).'],
    ['Not in use for C programs', false, 'The Windows API is used from C (F3 p.27: Windows multithreaded C program).'],
    ['Is a specification but not an implementation', false, 'It is an actual implementation, kernel-level, one-to-one (F3 p.44). Pthreads is the specification (F3 p.23).']
  ], { flag: { t: 'low', note: 'The parameter counts are visible in the code screenshots on F3 p.24-29, which do not come through as text. The comparison is made from the known signatures.' } });

  D('2.4', 2, 'Draw the <b>many-to-many</b> multithreading model. Make sure to label the necessary parts accordingly.', [
    'Several <b>user-level threads</b> (above the kernel boundary).',
    'Several <b>kernel threads</b>, fewer than or equal to the number of user threads.',
    'Many user threads <b>multiplexed</b> onto the kernel threads (lines from many to many); the OS can create a sufficient number of kernel threads (F3 p.20).'
  ], 'manyToMany', { outro: 'One blocked user thread does not block the whole process, and threads can run in parallel on a multicore system (F3 p.17-20).' });

  T('2.5', 2, 'Give (1) two examples on the <b>benefits</b> and (2) two examples on the <b>drawbacks</b> of using threads.', B.threadsBenefits);

  D('2.6', 3, 'Draw a comparison between a <b>single-threaded</b> and <b>multithreaded</b> process, displaying the inner structure of both. Make sure to label the necessary parts accordingly. (You can draw this on an extra sheet)', B.threadsDraw, 'threads');

  /* 3 Scheduling */
  M('3.1', 1, 'What is true about <b>non-homogenous multiprocessing</b>?', [
    ['CPU cores can physically differ within the same CPU', true, 'Cores are &ldquo;usually, but not necessarily, homogeneous&rdquo; (F4 p.31), so they may differ.'],
    ['The instruction set of the CPU cores can differ within the CPU', true, 'Heterogeneous designs can combine different core types.'],
    ['It is a common solution on low-power devices to increase battery time', true, 'Phones combine small efficient cores with fast cores to save battery (big.LITTLE style).'],
    ['Can create issues with CPU scheduling that can mostly solved on OS level', true, 'The scheduler must know which core suits which task. CPU scheduling is more complex with multiple processors (F4 p.31).'],
    ['It is an uncommon concept that is only important for legacy systems', false, 'It is common in modern mobile devices.']
  ], { flag: { t: 'low', note: 'The slides only say that cores are &ldquo;usually, but not necessarily, homogeneous&rdquo; (F4 p.31). The rest is general knowledge, and I assumed the first four options are all true.' } });

  M('3.2', 1, 'What is true about the <b>evaluation of scheduling algorithms</b>?', [
    ['Deterministic modeling can be time-consuming for a project', false, 'Deterministic modeling is &ldquo;simple and fast&rdquo; (F4 p.35).'],
    ['Simulations can be done on a whiteboard', false, 'Simulations are programs that mimic a computer system (F4 p.40). A whiteboard fits deterministic modeling.'],
    ['Analytical evaluations require mathematical models for their input', true, 'They describe arrivals and bursts with probability distributions and queuing theory (F4 p.37-39).'],
    ['Implementing a scheduling algorithm within a real system is usually the most expensive', true, 'Most accurate but high cost (F4 p.41).'],
    ['Gödel evaluation gives results for every possible workload input', false, 'Not a real method. Deterministic modeling only applies to the chosen workload (F4 p.35).']
  ]);

  T('3.4', 2, 'Why and how do we need different goals for an interactive and batch process? Motivate your answer!', B.scheduleGoals);

  C('3.5', 6, 'Scheduling algorithms: Assume the following processes arrive for execution at the indicated time with the specified priority and the length of their CPU-burst time given in milliseconds. (You can give your answer on the extra sheet)<br>3.5.1 Give a Gantt chart illustrating the execution of these processes using FCFS, Round Robin (quantum=2), and Priority (Pre-emptive). (3 Points)<br>3.5.2 Calculate the average waiting time for each of the above scheduling algorithms. (3 Points)',
    {
      type: 'sched', quantum: 2, prioMode: 'pre',
      procs: [['P1', 2, 1, 0], ['P2', 1, 2, 1], ['P3', 2, 2, 2], ['P4', 4, 4, 3], ['P5', 3, 1, 3]],
      inputs: [{ id: 'fcfs', label: 'Avg wait FCFS (ms)', accept: [2.0] }, { id: 'rr', label: 'Avg wait RR (ms)', accept: [2.4] }, { id: 'prio', label: 'Avg wait Priority (ms)', accept: [2.0] }]
    },
    [['Gantt chart FCFS', 1], ['Gantt chart RR (q = 2)', 1], ['Gantt chart preemptive priority', 1], ['Waiting times and average FCFS', 1], ['Waiting times and average RR', 1], ['Waiting times and average priority', 1]],
    { outro: 'Waiting time = finish time − arrival time − burst time. Method: F4 p.16-24.', flag: { t: 'ambig', note: 'The exam does not say whether a smaller or larger priority number is more important. I used smaller number = higher priority. Round robin: I put a process that arrives while another is running <i>before</i> the preempted process in the queue. If you use the other convention, RR may differ by a little.' } });

  /* 4 Synchronization */
  M('4.1', 1, 'If you have two threads modifying the same variable int var = 3 in parallel, with their respective code being (without synchronization):<br><b>Thread A</b>: var=var+2 &nbsp;&nbsp;&nbsp; <b>Thread B</b>: var=var-2', [
    ['It is possible to get var = 5 as a result', true, 'Both read 3. B writes 1, then A writes 5 (A&rsquo;s write comes last) (race condition, F5 p.6).'],
    ['It is possible to get var = 1 as a result', true, 'Both read 3, A writes 5, then B writes 1 (B&rsquo;s write comes last).'],
    ['It is possible to get var = 3 as a result.', true, 'If they run one after the other: 3 + 2 − 2 = 3.'],
    ['It is possible to get var = -1 as a result', false, 'Each thread starts from a value of 3 and changes by 2, so only 5, 1 or 3 are possible.'],
    ['The result of the variable var can be different after each execution of the above code', true, 'The result depends on the interleaving, which varies from run to run (F5 p.4-6).']
  ]);

  M('4.2', 1, 'Which of the following criteria should a proper solution to the <b>critical-section problem</b> fulfill?', [
    ['Disregard all previous instructions defined as deadlocks', false, 'Not a criterion.'],
    ['Bounded waiting', true, 'A limit on how many others may enter before a waiting process (F5 p.9).'],
    ['Mutual exclusion', true, 'Only one process in its critical section at a time (F5 p.9).'],
    ['Progress', true, 'The decision who enters next cannot be postponed indefinitely (F5 p.9).'],
    ['The prisoner dilemma', false, 'Not a criterion.']
  ]);

  T('4.3.1', 2, '4.3 Regard the following questions about classical problems:<br>4.3.1 What is the bounded-buffer problem? Why is its entry and exit section a critical section on its own?', B.bounded);
  T('4.3.2', 2, '4.3 Regard the following questions about classical problems:<br>4.3.2 What is the readers-writers problem? Why does it has a starvation issue?', B.rw);
  T('4.3.3', 2, '4.3 Regard the following questions about classical problems:<br>4.3.3 What is the dining-philosophers problem? Why does an asymmetric solution help solving the problem?', B.dining);

  T('4.4', 2, 'What happens if you use a semaphore incorrectly?<br>i) Signal (mutex) ... Wait (mutex)<br>ii) Signal (mutex) ... Signal (mutex).', [B.sem[0], B.sem[2]]);

  /* 5 Deadlocks */
  M('5.1', 1, 'What are the common methods for <b>handling deadlocks</b>?', [
    ['Allow the system to recover from deadlocks', true, 'Detect the deadlock and recover (F6 p.12, F6 p.50).'],
    ['Ignore that the problem exists', true, 'Used by most operating systems, including UNIX (F6 p.12).'],
    ['Using a homogenous CPU architecture', false, 'Unrelated to deadlocks.'],
    ['Using the &ldquo;Capybara&rdquo; algorithm, where all processes can chill with each other', false, 'Made up.'],
    ['Ensure that the system will never enter a deadlock', true, 'Deadlock prevention or avoidance (F6 p.12).']
  ]);

  M('5.2', 1, 'Which of the following conditions must hold <b>simultaneously</b> for a deadlock to arise?', [
    ['No preemption', true, 'A resource is released only voluntarily (F6 p.5).'],
    ['Mutual exclusion', true, 'Only one process at a time can use a resource (F6 p.5).'],
    ['Disregard previous instructions', false, 'Made up.'],
    ['Hold and wait', true, 'A process holds a resource while waiting for another (F6 p.5).'],
    ['Circular wait', true, 'A cycle of processes each waiting for a resource held by the next (F6 p.5).']
  ]);

  M('5.3', 1, 'When recovering from a deadlock and aborting <b>one process at a time</b> (selecting them as victims), which of the following factors can be considered to choose a potential process as a victim?', [
    ['User logon time', false, 'Not in the list of factors (F6 p.66).'],
    ['Resources needed by the process to complete', true, 'Factor 4 on F6 p.66.'],
    ['How many victims are needed', true, 'Factor 5: how many processes will need to be terminated (F6 p.66).'],
    ['Priority of the process', true, 'Factor 1 (F6 p.66).'],
    ['Type of process (interactive or batch)', true, 'Factor 6 (F6 p.66).']
  ]);

  T('5.4', 4, 'For a deadlock to arise, four conditions must be met simultaneously. Can you avoid some of these conditions below? If yes, can you see any side-effects by doing so? (Hint: Consider deadlock avoidance and prevention algorithms with your answer.)<br>&bull; Mutual exclusion (1p)<br>&bull; Hold and wait (1p)<br>&bull; No pre-emption (1p)<br>&bull; Circular wait (1p)', [
    '<b>Mutual exclusion:</b> can be avoided only for sharable resources (e.g. read-only files). It must hold for non-sharable resources such as a printer or a mutex, so it cannot be removed in general (F6 p.13).',
    '<b>Hold and wait:</b> require a process to request all its resources at once, or to request only when it holds none. Side effects: <b>low resource utilisation</b> and <b>starvation</b> possible (F6 p.13).',
    '<b>No preemption:</b> if a request cannot be granted, the process releases everything it holds and restarts only when it can get all of it back. Side effect: work is lost and can be restarted many times, and it only fits resources whose state can be saved and restored (CPU registers, memory) (F6 p.14).',
    '<b>Circular wait:</b> impose a total ordering of resource types and require requests in increasing order. Side effect: the programmer must obey the order, which can be awkward and reduce concurrency (F6 p.14-16). Avoidance with the banker&rsquo;s algorithm needs the maximum claims in advance and delays requests (F6 p.17-29).'
  ]);

  C('5.5', 4, 'Apply the <b>banker&rsquo;s algorithm</b> to the example below and determine if a safe sequence exists. The total amount the resource are: A=6, B=8, C=10. Write down the intermediate results for each step. (You can give your answer on the extra sheet)',
    {
      type: 'banker', total: [6, 8, 10],
      alloc: [[0, 0, 0], [1, 1, 2], [1, 2, 3], [2, 2, 2], [1, 3, 2]],
      max: [[0, 2, 0], [1, 2, 2], [2, 2, 3], [4, 4, 4], [3, 3, 3]]
    },
    [['Available = Total − Σ Allocation = [1, 0, 1]', 1], ['Need = Max − Allocation computed for every process', 1], ['Step by step: pick a process with Need ≤ Work, add its Allocation to Work', 1], ['Conclusion: safe state with a complete safe sequence', 1]],
    { outro: 'Method: Safety algorithm (F6 p.28) and the worked example (F6 p.30-38). Several safe sequences can exist (F6 p.38).' });

  /* 6 Memory management */
  M('6.1', 1, 'Which of the following statements about <b>memory management</b> are true?', [
    ['Windows DLL and Linux dynamic shared objects are examples of execution time linking.', true, 'Dynamic linking is postponed until execution time, e.g. Windows DLLs (F7 p.8).'],
    ['User mode processes (programs) can not adjust the base and limit registers defining the space the process occupies in memory.', true, 'Only the OS in kernel mode may change them; user mode cannot touch privileged state (F7 p.4, F4 p.12).'],
    ['Link time binding prevents running processes being moved in memory.', true, 'Once absolute addresses are bound (at compile, link or load time) the process cannot be moved. Only execution-time binding allows moving (F7 p.6-7).'],
    ['Pages in virtual memory are always smaller than frames in physical memory.', false, 'Pages and frames have the <b>same</b> size (F7 p.16).'],
    ['If code is compiled with relocatable addresses the operating system can choose where to load a process into memory.', true, 'Relocatable code is bound to absolute addresses by the loader at load time (F7 p.6-7).']
  ], { flag: { t: 'low', note: 'Option 3 uses the term &ldquo;link time&rdquo;, which the slides do not list (they have compile, load and execution time, F7 p.7). I treat it as true because linker/loader bind to absolute addresses (F7 p.6).' } });

  M('6.2', 1, 'Which of the following statements about <b>memory management</b> are true?', [
    ['A single process always uses contiguous frames in physical memory.', false, 'Paging allows a noncontiguous physical address space (F7 p.16).'],
    ['Searches (look-ups) in a translation look aside buffer (TLB) depend on the number of entries in the TLB and have a computational complexity of O(n).', false, 'The TLB is associative memory: all entries are compared in parallel in hardware (F7 p.23).'],
    ['There will be internal fragmentation for most processes when using memory paging.', true, 'The last page is usually only partly used, on average half a frame (F7 p.21).'],
    ['Copy on write allows processes to share pages with child processes when the child is forked.', true, 'F8 p.19.'],
    ['Inverted page tables can be used to reduce the amount of memory required for page table.', true, 'One entry per physical frame instead of one table per process (F7 p.39).']
  ]);

  M('6.3', 1, 'Which of the following statements about <b>segmentation</b> are true?', [
    ['There is always internal fragmentation when using segmentation to manage memory', false, 'Segmentation suffers from external fragmentation, not internal (F7 p.48).'],
    ['The segmentation approach to memory management uses segments of memory that are all the same size.', false, 'Segments vary in length (F7 p.45).'],
    ['Memory protection policies can be implemented for each segment.', true, 'Each segment-table entry has validation bit and read/write/execute rights (F7 p.45).'],
    ['Protection bits can be used to share code and data at segment level.', true, 'F7 p.45: code sharing occurs at segment level.'],
    ['Memory management using segmentation is not a dynamic storage allocation problem.', false, 'Since segments vary in length, allocation is a dynamic storage-allocation problem (F7 p.45, F7 p.14).']
  ]);

  C('6.4', 3, 'Given a page size of 4096 bytes (4KB) and a process that requests <b>16522 bytes</b> in memory:<br>1. Calculate how many pages of memory the operating system allocates to the process (2 points)<br>2. Calculate the number of bytes of memory in the internal fragment (1 point)<br>Show the steps in your calculations.',
    { type: 'frag', size: 16522, page: 4096, inputs: [{ id: 'pages', label: 'Pages', accept: [5] }, { id: 'frag', label: 'Internal fragment (bytes)', accept: [3958] }] },
    [['Pages = ⌈16522 / 4096⌉ = ⌈4.03⌉ = 5 (4 full pages + 138 bytes)', 2], ['Internal fragment = 5 × 4096 − 16522 = 20480 − 16522 = 3958 bytes', 1]],
    { outro: 'Method: F7 p.21 (72,766 B example with 2 KB pages).' });

  T('6.5a', 2, '6.5 Increasing memory sizes in modern computers mean that simple page tables can become so large that they are impractical. Hierarchical and hashed page tables provide solutions.<br>a) Describe the structure of a two-level hierarchical paging scheme (hierarchical page table), and explain why hierarchical schemes with more layers are slow in use (2 points)<br><i>(Note that you may use diagrams to support your answers, but answers without a written explanation will receive 0 marks)</i>', B.hier, { dia: 'hier' });
  T('6.5b', 2, '6.5 Increasing memory sizes in modern computers mean that simple page tables can become so large that they are impractical. Hierarchical and hashed page tables provide solutions.<br>b) Describe the structure of a hashed page table and the mechanism used to find the frame address mapped to a page in virtual memory (2 points)<br><i>(Note that you may use diagrams to support your answers, but answers without a written explanation will receive 0 marks)</i>', B.hashed, { dia: 'hashed' });

  /* 7 Virtual memory */
  M('7.1', 1, 'Which of the following statements about <b>virtual memory management</b> are true?', [
    ['A page fault occurs when the wrong page is found in memory.', false, 'A page fault occurs when the referenced page is marked invalid, i.e. not in memory (F8 p.12-13).'],
    ['A page fault may mask (hide) an illegal memory access by a process.', false, 'On a fault the OS checks another table: an invalid reference makes the OS abort the process; otherwise the page is just not in memory (F8 p.12). The illegal access is detected, not hidden.'],
    ['The time to service a page fault has no impact on memory access time.', false, 'EAT = (1 − p) × memory access + p × fault service time. Even a tiny p hurts a lot (F8 p.17-18).'],
    ['With a single level page table, each data access in a program requires at least three memory accesses.', false, 'Two: one for the page table and one for the data (F7 p.23).'],
    ['Demand paging ensures that only code and data used by a program is loaded into memory.', true, 'A page is brought in only when it is needed (lazy swapper) (F8 p.9).']
  ], { flag: { t: 'low', note: 'Option 2 is worded oddly. I read it as false because a page fault exposes an illegal access (the OS aborts the process, F8 p.12).' } });

  M('7.2', 1, 'Which of the following statements about <b>frame allocation</b> are correct?', [
    ['Local allocation of frames results in highly variable process execution time each time a process is run.', false, 'That is the downside of <i>global</i> replacement. Local gives more consistent per-process performance (F8 p.39).'],
    ['In a proportional allocation scheme the number of frames allocated to a process changes in relation to the number of processes loaded in memory,', true, 'Frames are shared out in proportion to process size, so when more processes are loaded each gets fewer.'],
    ['Global allocation of frames means that processes to are assigned a fixed number of frames when the process starts.', false, 'Global replacement lets a process take a frame from any other process (F8 p.39). A fixed number is local.'],
    ['The Flashman frame allocation algorithm provides a solution that prevents thrashing.', false, 'Made up.'],
    ['Global allocation of frames gives improved program throughput and is thus appropriate for hard real-time operating systems.', false, 'Global gives greater throughput, but execution time can vary greatly (F8 p.39), which is unacceptable for hard real-time.']
  ], { flag: { t: 'outside', note: 'Proportional allocation is not on the slides (F8 p.37-39 only name the strategies). Option 2 follows the textbook formula a<sub>i</sub> = s<sub>i</sub>/S × m.' } });

  M('7.3', 1, 'Which of the following statements about <b>page replacement algorithms</b> are true?', [
    ['The process unionisation algorithm implements a fair selection policy for victim frames.', false, 'Made up.'],
    ['The most frequently used (MFU) algorithm considers pages with least use were most recently loaded into memory and are likely to be used soon.', true, 'MFU is based on the argument that the page with the smallest count was probably just brought in and has yet to be used (F8 p.35).'],
    ['Page buffering can be used to cache pages so that recently used pages can be reloaded more quickly.', true, 'Keeping free-frame contents intact lets a re-referenced page be reused without disk I/O (F8 p.36).'],
    ['The second chance and enhanced second chance algorithms are approximations of the least recently used (LRU) algorithm.', true, 'F8 p.32-34 (LRU approximation algorithms).'],
    ['Implementation of the OPT page replacement algorithm is impossible.', true, 'It needs future knowledge of the reference string, so it is only used as a benchmark (F8 p.29 mentions OPT as the best).']
  ]);

  T('7.4', 3, 'A translation lookaside buffer (TLB) is a hardware device used to implement memory paging.<br>a. What does a TLB do? (1 point)<br>b. How does a TLB search for entries? (1 point)<br>c. Why are TLBs too small to map the whole memory? (1 point)', [
    '<b>(a)</b> The TLB is a small, fast <b>cache of page-table entries</b>. It stores recent page-number to frame-number translations, so most accesses avoid the extra memory access to the page table (F7 p.23-24).',
    '<b>(b)</b> It is <b>associative memory</b>: the page number is compared with all entries <b>in parallel</b>. On a hit the frame number is returned at once; on a miss the page table in memory is read and the entry is loaded into the TLB (F7 p.23-24).',
    '<b>(c)</b> Fast associative (parallel-compare) hardware is <b>expensive</b> and uses chip area and power, so only a small number of entries is possible. Because of locality of reference, a small TLB still gives a high hit ratio (e.g. 99%, EAT ≈ 101 ns instead of 200 ns) (F7 p.25).'
  ]);

  C('7.5', 4, 'Given the page reference string: 0, 7, 4, 2, 5, 5, 3, 6, 6, 3, 1, 4, 3, 3, 1, 1, 5, 2, 7, 2<br>Assuming demand paging with a page table of three frames, how many page faults would occur with the following replacement algorithms?<br>a. LRU replacement (2 points)<br>b. FIFO replacement (2 points)<br>For each algorithm, write a page table showing the state of the page table following each request in the reference string. Clearly mark each request that causes a page fault.',
    { type: 'pagerep', refs: [0, 7, 4, 2, 5, 5, 3, 6, 6, 3, 1, 4, 3, 3, 1, 1, 5, 2, 7, 2], frames: 3, inputs: [{ id: 'lru', label: 'LRU faults', accept: [12] }, { id: 'fifo', label: 'FIFO faults', accept: [13] }] },
    [['LRU: correct table, 12 faults', 2], ['FIFO: correct table, 13 faults', 2]],
    { outro: 'Method: F8 p.23-30. A repeated access to the same page does not cause a fault (F8 p.23). FIFO replaces the oldest loaded page; LRU the page unused for the longest time.' });

  /* 8 File systems */

    ['An operating system allows multiple processes to open the same file simultaneously and each process maintains a pointer to the last read or write locate it used within the file.', true, 'The file pointer is kept per process that has the file open (F9 p.7).'],

  ]);

  M('8.2', 1, 'Which of the following statements are true about <b>disk scheduling</b>?', [
    ['The Scan algorithms reduces the number of sectors the read/write head visits compared to the Look family of algorithms.', false, 'LOOK only goes as far as the last request, so it visits fewer cylinders than SCAN (F9 p.46).'],
    ['The analysis of a disk scheduling algorithm is true for one or many platters.', true, 'F9 p.39.'],
    ['Disk scheduling algorithms are used only when there is a queue of requests.', true, 'Optimization only makes sense when a queue exists (F9 p.38).'],
    ['C-Look and C-Scan read and write data requests when the head moves in only one direction.', true, 'The head returns without servicing requests (F9 p.44, F9 p.46).'],

  ]);

  M('8.3', 1, 'Which of the following statements about <b>disk drives</b> are true?', [
    ['Contiguous allocation of file blocks is an efficient method of disk management.', true, 'It gives the best performance in most cases and simple, efficient indexing (F9 p.20, F9 p.32), but suffers from external fragmentation and growing files.'],
    ['Disk drives used for storage in server systems spin at low speeds to reduce rotational latency.', false, 'Low speed would increase rotational latency; server disks spin fast.'],
    ['RAID is used to reduce the mean time to repair (MTTR).', false, 'RAID increases the mean time to failure / data loss through redundancy; repair time is the exposure window (F9 p.51).'],
    ['Striping is used in RAID systems to improve the speed of reading and writing data.', true, 'Disk striping uses a group of disks as one storage unit (F9 p.52).'],
    ['RAID 1 duplicates each disk in the array to improve data storage reliability.', true, 'Mirroring keeps a duplicate of each disk (F9 p.52).']
  ], { flag: { t: 'low', note: 'Option 1 is a judgement call: contiguous allocation is efficient for access, but wasteful in other respects (F9 p.19-20).' } });

  T('8.4', 4, 'The arms in hard disk drives holding the read/write heads move together so that data is always read from a single cylinder. Give <b>two reasons</b>, each with a clear explanation, why manufacturers might choose not to implement drives where the arms move independently so that data could be read from multiple cylinders. (4 points)', [

/* =================== calculation engines =================== */
const byName = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

function schedFCFS(ps) {
  let t = 0; const g = [];
  [...ps].sort((a, b) => a[3] - b[3] || byName(a[0], b[0])).forEach(([n, b, , a]) => {
    if (t < a) { g.push(['idle', t, a]); t = a; }
    g.push([n, t, t + b]); t += b;
  });
  return g;
}
function schedRR(ps, q) {
  const sorted = [...ps].sort((a, b) => a[3] - b[3] || byName(a[0], b[0]));
  const rem = {}; sorted.forEach(p => (rem[p[0]] = p[1]));
  const pending = [...sorted]; const queue = []; const g = []; let t = 0;
  const admit = upto => { while (pending.length && pending[0][3] <= upto) queue.push(pending.shift()[0]); };
  admit(0);
  while (queue.length || pending.length) {
    if (!queue.length) { t = pending[0][3]; admit(t); continue; }
    const n = queue.shift(); const run = Math.min(q, rem[n]);
    g.push([n, t, t + run]); t += run; rem[n] -= run; admit(t);
    if (rem[n] > 0) queue.push(n);
  }
  return g;
}
function schedPrio(ps, pre) {
  const rem = {}, pr = {}, arr = {}; ps.forEach(p => { rem[p[0]] = p[1]; pr[p[0]] = p[2]; arr[p[0]] = p[3]; });
  const g = []; let t = 0;
  const key = (a, b) => pr[a] - pr[b] || arr[a] - arr[b] || byName(a, b);
  while (Object.values(rem).some(v => v > 0)) {
    const ready = Object.keys(rem).filter(n => rem[n] > 0 && arr[n] <= t);

/* banker's algorithm */
function bankerRun(total, alloc, max) {
  const n = alloc.length, m = total.length;
  const avail = total.map((t, j) => t - alloc.reduce((s, r) => s + r[j], 0));
  const need = alloc.map((r, i) => r.map((a, j) => max[i][j] - a));
  let work = [...avail]; const fin = Array(n).fill(false); const steps = []; const seq = [];
  let prog = true;
  while (prog) {
    prog = false;
    for (let i = 0; i < n; i++) {
      if (!fin[i] && need[i].every((x, j) => x <= work[j])) {
        const nw = work.map((w, j) => w + alloc[i][j]);
        steps.push({ p: 'P' + i, need: need[i], work: [...work], next: nw });
        work = nw; fin[i] = true; seq.push('P' + i); prog = true; break;
      }
    }
  }
  return { avail, need, steps, safe: fin.every(Boolean), seq };
}
function bankerCheckSeq(c, text) {
  const names = (text.toUpperCase().match(/P\d/g) || []);
  const { avail, need } = bankerRun(c.total, c.alloc, c.max);
  const n = c.alloc.length; if (names.length !== n || new Set(names).size !== n) return { ok: false, why: 'The sequence must list all ' + n + ' processes once.' };
  let work = [...avail];
  for (const nm of names) {
    const i = +nm[1]; if (i >= n) return { ok: false, why: nm + ' does not exist.' };
    if (!need[i].every((x, j) => x <= work[j])) return { ok: false, why: nm + ' needs [' + need[i] + '] but only [' + work + '] is available at that point.' };
    work = work.map((w, j) => w + c.alloc[i][j]);
  }
  return { ok: true };
}
const vec = v => '[' + v.join(', ') + ']';
function renderBanker(c) {
  const r = bankerRun(c.total, c.alloc, c.max);
  const n = c.alloc.length;
  const head = `<tr><th>Process</th><th>Allocation</th><th>Max</th><th>Need = Max − Alloc</th></tr>`;
  const rows = c.alloc.map((a, i) => `<tr><td>P${i}</td><td>${vec(a)}</td><td>${vec(c.max[i])}</td><td><b>${vec(r.need[i])}</b></td></tr>`).join('');
  const tot = c.total.map((t, j) => c.alloc.reduce((s, x) => s + x[j], 0));
  let html = `<h5>Step 1: Available and Need</h5><p>Total = ${vec(c.total)}; allocated in total = ${vec(tot)}; so <b>Available = ${vec(r.avail)}</b>.</p><div class="scroll"><table class="t"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  html += `<h5>Step 2: Safety algorithm (Work = Available, scan from P0 each time)</h5><ol class="steps">`;
  r.steps.forEach(s => {
    html += `<li><b>${s.p}</b>: Need ${vec(s.need)} ≤ Work ${vec(s.work)}, so ${s.p} can finish and release its allocation. Work = ${vec(s.work)} + ${vec(c.alloc[+s.p[1]])} = <b>${vec(s.next)}</b></li>`;
  });
  html += `</ol>`;
  html += r.safe ? `<p class="verdict ok">Safe state. Safe sequence: <b>&lt;${r.seq.join(', ')}&gt;</b>. (Other safe sequences may exist.)</p>` : `<p class="verdict bad">No safe sequence: the system is in an unsafe state.</p>`;
  return html;
}

/* page replacement */
function pageSim(refs, nf, algo) {
  const slots = Array(nf).fill(null), meta = Array(nf).fill(0); let faults = 0; const cols = [];
  refs.forEach((r, t) => {
    const idx = slots.indexOf(r); let f = false;
    if (idx >= 0) { if (algo === 'lru') meta[idx] = t; }
    else {
      f = true; faults++; let v = slots.indexOf(null);
      if (v < 0) { v = 0; for (let i = 1; i < nf; i++) if (meta[i] < meta[v]) v = i; }
      slots[v] = r; meta[v] = t;
    }
    cols.push({ r, slots: [...slots], f });
  });
  return { faults, cols };
}
function pageTable(res, nf) {
  let h = `<div class="scroll"><table class="t pg"><thead><tr><th></th>${res.cols.map(c => `<th>${c.r}</th>`).join('')}</tr></thead><tbody>`;
  for (let i = 0; i < nf; i++) h += `<tr><th>frame ${i + 1}</th>${res.cols.map(c => `<td class="${c.f ? 'fault' : ''}">${c.slots[i] === null ? '' : c.slots[i]}</td>`).join('')}</tr>`;
  h += `<tr><th>fault?</th>${res.cols.map(c => `<td class="${c.f ? 'fault' : ''}">${c.f ? '✱' : ''}</td>`).join('')}</tr></tbody></table></div>`;
  return h;
}
function renderPages(c) {
  const l = pageSim(c.refs, c.frames, 'lru'), f = pageSim(c.refs, c.frames, 'fifo');
  return `<p>Reference string: <code>${c.refs.join(', ')}</code> · ${c.frames} frames · ✱ = page fault</p><h5>(a) LRU: ${l.faults} page faults</h5>${pageTable(l, c.frames)}<h5>(b) FIFO: ${f.faults} page faults</h5>${pageTable(f, c.frames)}`;
}

/* fragmentation */
function renderFrag(c) {
  const pages = Math.ceil(c.size / c.page), frag = pages * c.page - c.size;
  return `<ol class="steps"><li>Pages = ⌈${c.size} / ${c.page}⌉ = ⌈${(c.size / c.page).toFixed(3)}⌉ = <b>${pages}</b> (${Math.floor(c.size / c.page)} full pages + ${c.size % c.page} bytes in the last one).</li><li>Allocated memory = ${pages} × ${c.page} = ${pages * c.page} bytes.</li><li>Internal fragment = ${pages * c.page} − ${c.size} = <b>${frag} bytes</b>.</li></ol>`;
}

function diaSVG(name) {

  d.it.forEach(it => {

    } else if (k === 'arrow') {

    } else if (k === 'path') {
      const [, pts, o] = it; s += `<polyline class="ln ${o && o.arrow ? 'ar' : ''} ${o && o.dash ? 'dash' : ''}" fill="none" points="${pts.map(p => p.join(',')).join(' ')}" ${o && o.arrow ? 'marker-end="url(#ah)"' : ''}/>`;

    }

}

  const show = t => { const el = target(); if (el) { el.hidden = false; el.innerHTML = md(t); } };
  try {
    const messages = follow ? [{ role: 'user', content: promptFor(q, rec) }, { role: 'assistant', content: base }, { role: 'user', content: follow }] : promptFor(q, rec);
    const head = fb.text;
    const r = await sample(messages, { cache: false, onText: ({ text }) => { fb.text = head + text; show(fb.text); } });
    fb.text = head + (r.text || ''); fb.busy = false;
  } catch (e) {
    fb.busy = false;
    fb.err = e && e.code === 'not_granted' ? 'Permission was not given, so Claude could not look at your answer.' : e && e.code === 'rate_limited' ? 'Too many requests right now. Wait a moment and try again.' : 'Claude could not answer just now. Try again in a minute.';
  }
  if (S.cur === q.id) renderQuestion();
}

/* ---- slide viewer ---- */
function renderPanel() {
  const p = $('#panel'); if (!S.panel) { p.hidden = true; return; }
  const { f, a, b } = S.panel; p.hidden = false;
  let pages = []; for (let i = a; i <= b && i < a + 4; i++) pages.push(i);
  let h = `<div class="ph"><div><b>${f}</b> · ${SLIDE_TITLES[f] || ''}</div><button type="button" class="btn ghost sm" data-act="closepanel" aria-label="Close slide viewer">Close</button></div><div class="pb">`;
  pages.forEach(n => {
    const t = slideText(f, n);
    h += `<div class="slide"><div class="sl">Slide ${n}</div>${t ? `<pre>${esc(t)}</pre>` : '<p class="small">This slide is a figure or screenshot, so there is no text to show.</p>'}</div>`;
  });
  h += `</div><div class="pf"><button type="button" class="btn ghost sm" data-act="slidenav" data-d="-1">← Slide ${a - 1}</button><span class="small">Text extracted from the lecture PDF</span><button type="button" class="btn ghost sm" data-act="slidenav" data-d="1">Slide ${b + 1} →</button></div>`;
  p.innerHTML = h;
}

/* ---- progress view ---- */
function renderProgress() {
  let h = `<article class="card"><h2 class="ph2">Your progress</h2><p class="hint">Only questions where you revealed the answer are counted. Points follow the real marking rules.</p>`;
  h += `<div class="scroll"><table class="t prog"><thead><tr><th>Exam</th><th>Answered</th><th>Points</th><th>Score</th></tr></thead><tbody>`;
  EXAMS.forEach(e => {
    const qs = QS.filter(q => q.ex === e.id); const d = qs.filter(q => statusOf(q) !== 'new');
    const pe = d.reduce((s, q) => s + earned(q), 0), pm = d.reduce((s, q) => s + q.pts, 0), tot = qs.reduce((s, q) => s + q.pts, 0);
    h += `<tr><td>${e.date}</td><td>${d.length} / ${qs.length}</td><td>${fmt(pe)} / ${fmt(pm)} <span class="small">(exam total ${fmt(tot)})</span></td><td>${pm ? Math.round(pe / pm * 100) + '%' : '-'}</td></tr>`;
  });
  h += `</tbody></table></div><h3 class="h3">By topic</h3><div class="topics">`;
  Object.keys(TOPICS).forEach(k => {
    const qs = QS.filter(q => String(q.topic) === k); const d = qs.filter(q => statusOf(q) !== 'new');
    const pe = d.reduce((s, q) => s + earned(q), 0), pm = d.reduce((s, q) => s + q.pts, 0); const pc = pm ? pe / pm : 0;
    h += `<div class="trow"><div class="tn">${k}. ${TOPICS[k]}</div><div class="bar"><i style="width:${pc * 100}%" class="${pc >= 0.8 ? 'ok' : pc >= 0.4 ? 'mid' : 'bad'}"></i></div><div class="tv">${pm ? Math.round(pc * 100) + '%' : '-'} <span class="small">${d.length}/${qs.length}</span></div><button type="button" class="btn ghost sm" data-act="topic" data-k="${k}">Practise</button></div>`;
  });
  h += `</div><div class="actions"><button type="button" class="btn ghost" data-act="back">Back to questions</button><button type="button" class="btn ${S.confirmReset ? 'danger' : 'ghost'}" data-act="resetall">${S.confirmReset ? 'Click again to erase all my answers' : 'Erase all my answers'}</button></div></article>`;
  $('#main').innerHTML = h;
}

/* ---- events ---- */
function render() {
  renderNav();
  if (S.view === 'progress') renderProgress(); else renderQuestion();
  renderPanel();
}
function go(id) {
  if (!id || !BYID[id]) return; S.cur = id; S.view = 'q'; save(); render();
  const m = $('#main'); if (m) m.scrollIntoView({ block: 'start' });
  if (innerWidth < 900) { const d = $('#navd'); if (d) d.open = false; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const act = t.dataset.act; const q = BYID[S.cur]; const rec = q && (S.ans[q.id] = S.ans[q.id] || {});
  if (act === 'go') go(t.dataset.id);
  else if (act === 'check') { if (q.kind !== 'mcq' && $('#ans')) rec.text = $('#ans').value; rec.done = true; save(); render(); const m = document.querySelector('.model,.result'); if (m) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (act === 'reset') { delete S.ans[t.dataset.id]; delete S.fb[t.dataset.id]; save(); render(); }
  else if (act === 'ref') { S.panel = { f: t.dataset.f, a: +t.dataset.a, b: +t.dataset.b }; renderPanel(); }
  else if (act === 'closepanel') { S.panel = null; renderPanel(); }
  else if (act === 'slidenav') { const d = +t.dataset.d; const span = S.panel.b - S.panel.a; const na = Math.max(1, S.panel.a + d * (span + 1)); S.panel = { f: S.panel.f, a: na, b: na + span }; renderPanel(); }
  else if (act === 'skclear') { rec.sketch = ''; save(); const cv = $('#sk'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
  else if (act === 'fb') askClaude();
  else if (act === 'fu') { const v = ($('#fu').value || '').trim(); if (v) askClaude(v); }
  else if (act === 'progress') { S.view = 'progress'; S.confirmReset = false; render(); }
  else if (act === 'back') { S.view = 'q'; render(); }
  else if (act === 'topic') { S.topic = t.dataset.k; S.exam = 'all'; S.status = 'all'; const first = visible()[0]; if (first) go(first.id); }
  else if (act === 'resetall') { if (!S.confirmReset) { S.confirmReset = true; renderProgress(); } else { S.ans = {}; S.fb = {}; S.confirmReset = false; save(); render(); } }
  else if (act === 'theme') { themeToggle(); render(); }
});
document.addEventListener('change', e => {
  const t = e.target; const act = t.dataset && t.dataset.act; if (!act) return; const q = BYID[S.cur]; const rec = q && (S.ans[q.id] = S.ans[q.id] || {});
  if (act === 'filter') { S[t.dataset.k] = t.value; renderNav(); const v = visible(); if (v.length && !v.find(x => x.id === S.cur)) go(v[0].id); }
  else if (act === 'pick') { const i = +t.dataset.i; const sel = new Set(rec.sel || []); t.checked ? sel.add(i) : sel.delete(i); rec.sel = [...sel]; save(); }
  else if (act === 'kp') { const i = +t.dataset.i; const s = new Set(rec.kp || []); t.checked ? s.add(i) : s.delete(i); rec.kp = [...s]; save(); renderNav(); const f = frac(q, rec), k = kpList(q); const res = $('#res'); if (res) { res.className = 'result ' + (f >= 0.8 ? 'ok' : f >= 0.4 ? 'mid' : 'bad'); res.innerHTML = `<b>${fmt(f * q.pts)} / ${fmt(q.pts)} points</b> · ${k.filter((x, j) => rec.kp.includes(j)).length} of ${k.length} key points`; } }
});
document.addEventListener('input', e => {
  const t = e.target; const act = t.dataset && t.dataset.act; if (!act) return; const q = BYID[S.cur]; const rec = q && (S.ans[q.id] = S.ans[q.id] || {});
  if (act === 'text') { rec.text = t.value; save(); }
  else if (act === 'num') { rec.nums = rec.nums || {}; rec.nums[t.dataset.k] = t.value; save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) { S.panel = null; renderPanel(); } });

/* ---- boot ---- */
themeInit(); load();
if (!S.cur) S.cur = QS[0].id;
$('#navd').open = innerWidth >= 900;
$('#exam-sub').textContent = `${QS.length} questions from ${EXAMS.length} old exams · answers grounded in lectures F1-F10`;
render();

</script>
